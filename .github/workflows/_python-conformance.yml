name: Python conformance

# The JacPython runtime's gates: the native compiler is active, the
# code-object boundary holds, and every ported module and frontend suite passes
# its vendored conformance tests (jac/tests/python_conformance).
#
# Called by ci.yml (on the run's kit) and nightly.yml (a binary built on every
# release platform).

on:
  workflow_call:
    inputs:
      runners:
        description: JSON list of runners to build and test on.
        type: string
        default: '["blacksmith-8vcpu-ubuntu-2404"]'
      kit:
        description: Test this run's jac-kit artifact (Linux x86_64) instead of building a binary.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python-conformance:
    name: python-conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Get this run's kit
        if: inputs.kit
        uses: ./.github/actions/jac-kit
        with:
          sealed: "true"

      - name: Build jac (cached)
        if: ${{ !inputs.kit }}
        uses: ./.github/actions/setup-jac

      # The gates below run the binary's own compiler, not the checkout's.
      - if: ${{ !inputs.kit }}
        uses: ./.github/actions/seal-checkout

      - name: Probe the native compiler
        working-directory: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          jac -c '
          import ast, ctypes, sys
          assert ctypes.pythonapi._PyJac_CompilerRequired() == 1
          assert ctypes.pythonapi._PyJac_CompilerBridgeVersion() == 4
          assert not hasattr(sys, "_jacpython_compile")
          assert not hasattr(sys, "_jacpython_image")
          assert eval(compile(ast.parse("6 * 7", mode="eval"), "<packaged-native>", "eval")) == 42
          print("JacPython: native compiler active")
          '

      - name: Check the JacPython native code-object boundary
        run: jac run scripts/test_jacpython_native.jac

      # Suites whose subject is the interpreter's own `compile`, the native
      # compiler.
      - name: Run the JacPython compiler tests
        env:
          JAC_TEST_JOBS: "0"
        run: jac test jac/tests/compiler/test_jacpython_block_tail_compare.jac

      - name: Run the conformance suites of the native modules and frontend
        run: |
          jac install "hypothesis>=6,<7" --global
          # Every module runs; the step fails at the end with the full list.
          failed=""
          while read -r module tests _ <&3; do
            case "$module" in ''|'#'*) continue ;; esac
            for test in $(printf '%s' "$tests" | tr ',' ' '); do
              jac run scripts/run_python_conformance.jac --module "$test" --native-modules "$module" || failed="$failed $test"
            done
          done 3< jac/bootstrap/python/jacpython-modules.txt
          # The frontend suites (tokenizer, parser, AST, codegen) read their
          # own registry: they exercise no single replaced module.
          while read -r test flags <&3; do
            case "$test" in ''|'#'*) continue ;; esac
            jac run scripts/run_python_conformance.jac --module "$test" $flags || failed="$failed $test"
          done 3< jac/bootstrap/python/jacpython-compiler-tests.txt
          if [ -n "$failed" ]; then
            echo "::error::conformance test modules failed:$failed"
            exit 1
          fi

      - name: Diagnose macOS native startup failures
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        working-directory: jac
        run: |
          if [ -x zig-out/bin/jac ]; then
            lldb --batch -o 'settings set target.disable-aslr false' -o run \
              -k 'thread backtrace all' -k 'image list -o -f' \
              -- zig-out/bin/jac -c 'import ast, ctypes; assert ctypes.pythonapi._PyJac_CompilerBridgeVersion() == 4; assert eval(compile(ast.parse("6 * 7", mode="eval"), "<packaged-native>", "eval")) == 42'
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: python-conformance-logs-${{ runner.os }}-${{ runner.arch }}
          path: |
            jac/.python-build/**/*.log
            ~/Library/Logs/DiagnosticReports/python*.ips
          include-hidden-files: true
          if-no-files-found: ignore
