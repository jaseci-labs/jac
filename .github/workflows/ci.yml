name: CI

# Pull requests and pushes test on the dev kit: `dev-kit` builds the dev
# binary and its floors, `dev-precompile` precompiles the checkout in three
# legs, and every test lane runs through that binary over the checkout.
#
# The test lanes are data: .github/ci/lanes.json names each lane's paths,
# workers, tools and packages, and the `changes` job turns it into the `test`
# matrix (scripts/ci_plan.sh). A pull request that only touches tests runs just
# the tests it can reach; every other run runs every lane. The plan also fails
# if a test file belongs to no lane, so a new test cannot go unrun.
#
# The sealed, release-shaped kit and the lanes that need it live in
# ci-sealed.yml (schedule, manual runs, and the `ci:sealed` label). The darwin
# native lane lives in nightly.yml.

on:
  workflow_dispatch:
  # The full suite every 6 hours on main, including the lanes pull requests
  # and pushes run only when their paths change (android, jac-pack, aarch64).
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    # A backport onto a release line is judged by the same suites as main.
    # `push` stays main-only: release/* branches are also the heads of release
    # PRs into main, which this trigger already covers.
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

# Adding a label that does not add a lane (one outside the list below, which
# the `changes` job repeats) must neither rerun the suites nor cancel the run in
# flight, so that run gets a group of its own and only Contribution Checks and
# Everything Passed run. The skip-* labels are such labels: they only waive a
# check, so Everything Passed drops the waived job from the verdict it carries.
concurrency:
  group: >-
    ci-${{ github.event.pull_request.number || github.ref }}${{
    github.event.action == 'labeled'
    && github.event.label.name != 'type-error-report'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

# A lane is sealed or rerouted once, by its jac-kit step's `sealed` input:
# sealing edits the checkout, so a per-step choice could not undo it.

jobs:
  # Path filter used ONLY to skip jobs on PRs; push/dispatch runs everything.
  changes:
    if: >-
      github.event.action != 'labeled'
      || github.event.label.name == 'type-error-report'
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      installer: ${{ steps.filter.outputs.installer }}
      native: ${{ steps.filter.outputs.native }}
      scope: ${{ steps.plan.outputs.scope }}
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # A pull request checkout is the merge commit, so HEAD^1..HEAD is its diff.
      - name: Plan the test lanes
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scope=$(bash scripts/ci_plan.sh scope HEAD^1 HEAD | head -n 1 | cut -d= -f2)
            lanes=$(bash scripts/ci_plan.sh plan .github/ci/lanes.json HEAD^1 HEAD)
          else
            scope=full
            lanes=$(bash scripts/ci_plan.sh plan .github/ci/lanes.json)
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          echo "scope: $scope"
          python3 -c 'import json,sys; [print("  %s: %d files" % (l["name"], l["count"])) for l in json.loads(sys.argv[1])]' "$lanes"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'jac/**'
              - 'jac.toml'
              - '.github/workflows/build-binaries.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'scripts/ci_cache_keys.sh'
              - 'scripts/test_ci_cache_keys.sh'
              - 'scripts/ci_carry_verdict.sh'
              - 'scripts/test_ci_carry_verdict.sh'
              - 'scripts/ci_plan.sh'
              - 'scripts/test_ci_plan.sh'
              - '.github/ci/**'
            docs:
              - 'jac/jaclang/cli/docs/**'
              - 'jac/jaclang/cli/skills/**'
              - 'release_notes/**'
            installer:
              - 'scripts/install.sh'
              # The lane's own definition lives here, so a change to what it
              # runs must run it -- same reasoning as `native` listing ci.yml.
              # Without this an edit to the installer test ships unexercised.
              - '.github/workflows/_installer.yml'
            # Narrowing filter: the aarch64 and launcher lanes only run when a
            # path that can move them changes (or on push/dispatch).
            native:
              - 'jac/jaclang/compiler/backends/native/**'
              - 'jac/tests/compiler/backends/native/**'
              - 'jac/jaclang/compiler/tests/test_prim_equivalence.jac'
              - 'jac/jaclang/compiler/tests/fixtures/prim_*.jac'
              - 'jac/native/**'
              - 'jac/build.zig'
              - 'jac/build.zig.zon'
              - 'jac/bootstrap/**'
              - 'jac/launcher/**'
              - 'jac/jaclang/dist/fused/**'
              - 'jac/jaclang/runtime/na_stdlib/**'
              - 'jac/jaclang/dist/payload/**'
              - '.github/workflows/ci.yml'
              # Payload-baked inputs the launcher lane must see.
              - 'jac/launcher/**'
              - 'jac/_jac_finder.py'
              - 'jac/sitecustomize.py'
              - 'jac/jaclang/dist/precompile_bytecode.jac'
              - 'jac/jaclang/cli/commands/precompile.jac'
              - 'jac/jaclang/cli/commands/impl/precompile.impl.jac'
              - '.github/actions/**'
              - 'scripts/ci_cache_keys.sh'

  # The kit every pull request, push and scheduled test lane runs on: a -Ddev
  # binary (launcher + Python payload, jaclang linked from this checkout), the
  # checkout's own precompile bundle and stub catalog, and the floors, shim
  # and bun at their checkout paths. No native prebuild, seal or pack: the
  # sealed, release-shaped kit is ci-sealed.yml's build-kit.
  dev-kit:
    runs-on: ubuntu-24.04
    needs: changes
    steps:
      - uses: actions/checkout@v5

      # The cache home the test lanes pin (jac-kit), so the stub catalog
      # lands in the slot they look it up in.
      - name: Pin the cache home
        run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/.cache" >> "$GITHUB_ENV"

      - name: Fingerprint immutable build inputs
        id: inputs
        run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

      # The compiler modules compiled from the checkout, keyed by the compiler
      # digest. Restored before anything calls jac, so a run that leaves the
      # compiler alone skips compiling it from source.
      - name: Restore the compiled compiler modules
        id: dev-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/.cache/jac/jir/modules
          key: jac-dev-modules-c${{ steps.inputs.outputs.compiler }}

      - name: Build the dev jac binary (cached)
        uses: ./.github/actions/setup-jac
        with:
          need-build-inputs: "true"
          bytecode-kit: "true"
          dev: "true"

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Ensure the LLVMPY shim is present
        working-directory: jac
        run: |
          set -euo pipefail
          if ls jaclang/compiler/backends/native/llvm/libjacllvm.* >/dev/null 2>&1; then
            exit 0
          fi
          zig build fetch-llvm --summary all
          zig build jacllvm --summary all

      # bun, both static musl runtimes and the wasm libc depend only on the
      # devassets inputs, so a hit skips ~3 min of Zig and payload-tool work.
      - name: Restore the dev vendored runtimes
        id: dev-assets-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            jac/jaclang/client/_bun
            jac/.pbs-build/linux-x86_64/musl/lib
            jac/.pbs-build/linux-aarch64/musl/lib
            jac/.pbs-build/wasm32/libc
          key: dev-assets-v1-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-${{ steps.inputs.outputs.devassets }}

      - name: Materialize typeshed, bun + vendored runtimes
        working-directory: jac
        env:
          ASSETS_HIT: ${{ steps.dev-assets-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [ -d jaclang/vendor/typeshed/stdlib ] || zig build fetch-typeshed --summary all
          if [ "$ASSETS_HIT" != "true" ]; then
            zig build fetch-bun --summary all
            zig build vendor-musl --summary all
            zig build vendor-musl-linux-aarch64 --summary all
            zig build vendor-wasm-libc --summary all
          fi

      - name: Save the dev vendored runtimes
        if: steps.dev-assets-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            jac/jaclang/client/_bun
            jac/.pbs-build/linux-x86_64/musl/lib
            jac/.pbs-build/linux-aarch64/musl/lib
            jac/.pbs-build/wasm32/libc
          key: dev-assets-v1-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-${{ steps.inputs.outputs.devassets }}

      - name: Restore the dev stub catalog
        id: dev-stubcat-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/.cache/jac/jir/stubcat
          key: dev-stubcat-v2-${{ runner.os }}-${{ runner.arch }}-c${{ steps.inputs.outputs.compiler }}-${{ hashFiles('jac/jaclang/vendor/typeshed/PIN') }}

      # Built here, before any precompile shard: without it every unit's type
      # evaluator parses the typeshed stubs from source, about two thirds of
      # a cold precompile. Keyed on the whole compiler, since any type-system
      # change can change the catalog. The build also compiles the compiler
      # modules uploaded below, so it runs whenever either cache missed.
      - name: Build the stub catalog
        if: steps.dev-stubcat-cache.outputs.cache-hit != 'true' || steps.dev-modules-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/jac/zig-out/bin:$PATH"
          jac native build stubcat
          ls "$XDG_CACHE_HOME/jac/jir/stubcat"/*.bin

      - name: Save the dev stub catalog
        if: steps.dev-stubcat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/.cache/jac/jir/stubcat
          key: dev-stubcat-v2-${{ runner.os }}-${{ runner.arch }}-c${{ steps.inputs.outputs.compiler }}-${{ hashFiles('jac/jaclang/vendor/typeshed/PIN') }}

      - name: Upload the dev kit
        uses: actions/upload-artifact@v4
        with:
          name: jac-dev-kit
          path: |
            jac/zig-out/bin/jac
            jac/jaclang/vendor/typeshed/stdlib
            jac/jaclang/compiler/backends/native/llvm/libjacllvm.*
            jac/jaclang/client/_bun
            jac/.pbs-build/linux-x86_64/python/build/lib
            jac/.pbs-build/linux-x86_64/musl/lib
            jac/.pbs-build/linux-aarch64/musl/lib
            jac/.pbs-build/wasm32/libc
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Upload the dev stub catalog
        uses: actions/upload-artifact@v4
        with:
          name: jac-dev-stubcat
          path: ${{ runner.temp }}/.cache/jac/jir/stubcat
          retention-days: 1
          if-no-files-found: error

      # The compiler modules this job compiled from the checkout to build the
      # catalog. A cached module is checked against its source and compiler,
      # not file times, so the precompile legs start from them instead of
      # each compiling the compiler again.
      - name: Save the compiled compiler modules
        if: steps.dev-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/.cache/jac/jir/modules
          key: jac-dev-modules-c${{ steps.inputs.outputs.compiler }}

      - name: Upload the compiled compiler modules
        uses: actions/upload-artifact@v4
        with:
          name: jac-dev-modules
          path: ${{ runner.temp }}/.cache/jac/jir/modules
          retention-days: 1
          if-no-files-found: error

  # The checkout's precompile bundle (jaclang/_precompiled), in three
  # parallel legs of every third source (JAC_PRECOMPILE_SHARD). Each leg keeps
  # its own cache, and every unit is checked against its source and compiler,
  # so a restored tree only lets unchanged modules skip the recompile. The
  # lanes merge the three artifacts back into one tree (jac-kit).
  dev-precompile:
    runs-on: ubuntu-24.04
    needs: dev-kit
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - name: Pin the cache home
        run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/.cache" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: jac-dev-kit
          path: jac

      - uses: actions/download-artifact@v4
        with:
          name: jac-dev-stubcat
          path: ${{ runner.temp }}/.cache/jac/jir/stubcat

      - uses: actions/download-artifact@v4
        with:
          name: jac-dev-modules
          path: ${{ runner.temp }}/.cache/jac/jir/modules

      - name: Fingerprint immutable build inputs
        id: inputs
        run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

      - name: Restore this leg's precompile bundle
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: jac/jaclang/_precompiled
          key: jac-dev-precompiled-s${{ matrix.shard }}of3-c${{ steps.inputs.outputs.compiler }}-${{ steps.inputs.outputs.payload }}
          restore-keys: |
            jac-dev-precompiled-s${{ matrix.shard }}of3-c${{ steps.inputs.outputs.compiler }}-

      - name: Precompile this leg's share of the checkout
        env:
          JAC_PRECOMPILE_JOBS: "4"
          JAC_PRECOMPILE_RSS_LOG: "1"
          JAC_PRECOMPILE_SHARD: ${{ matrix.shard }}/3
        run: |
          set -euo pipefail
          chmod +x jac/zig-out/bin/jac
          export PATH="$GITHUB_WORKSPACE/jac/zig-out/bin:$PATH"
          jac precompile ./jac
          DIR="$(find jac/jaclang/_precompiled -maxdepth 1 -type d -name 'cpython-*' | head -1)"
          [ -n "$DIR" ] || { echo "::error::no jac/jaclang/_precompiled/cpython-<ver> tree"; exit 1; }
          UNITS="$(find "$DIR" -name '*.jir' | wc -l | tr -d ' ')"
          [ "$UNITS" -ge 130 ] || { echo "::error::precompile leg has only $UNITS units"; exit 1; }
          rm -f jac/jaclang/_precompiled/PRECOMPILE_RESULT.json
          echo "precompile leg ${{ matrix.shard }}/3: $UNITS units in $DIR"

      - name: Save this leg's precompile bundle
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: jac/jaclang/_precompiled
          key: jac-dev-precompiled-s${{ matrix.shard }}of3-c${{ steps.inputs.outputs.compiler }}-${{ steps.inputs.outputs.payload }}

      - name: Upload this leg's precompile bundle
        uses: actions/upload-artifact@v4
        with:
          name: jac-dev-precompiled-${{ matrix.shard }}
          path: jac/jaclang/_precompiled
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  jac-check:
    needs: [changes, dev-kit, dev-precompile]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-24.04
    # Three legs, each running the whole project-wide check (jac.toml
    # [check] exclude applies) over every third file of the heaviest-first
    # list (JAC_CHECK_SHARD); together they check what `jac check .` does.
    # The fmt steps run in the first leg only.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Leave memory for the driver and self-hosted compiler on the 16 GB runner.
      JAC_CHECK_JOBS: "2"
      JAC_CHECK_SHARD: ${{ matrix.shard }}/3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Fingerprint immutable build inputs
        id: inputs
        run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

      # On PRs, scope fmt to .jac files changed vs the merge-base. `jac check`
      # is deliberately NOT scoped: a type error is a property of the whole
      # program, so a scoped run answers a different question than the push
      # sweep and a green PR stops predicting a green main.
      - name: Determine changed .jac files
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --quiet origin "${{ github.base_ref }}"
          BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.jac' > changed-jac.txt || true
          echo "mode=scoped" >> "$GITHUB_OUTPUT"
          if [ -s changed-jac.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          cat changed-jac.txt || true

      # The analysis cache is content+env keyed (every entry folds the
      # compiler-source digest), so restoring any prior cache is safe by
      # construction: entries from another compiler generation simply miss
      # and get swept. The key's digest segment covers the compiler digest
      # roots, so a compiler edit starts cold exactly when it must, while
      # app-and-test-only PRs restore a fully warm analysis cache and the
      # whole-repo sweep collapses to diagnostics replay. Restored before
      # jac-kit (which pins XDG_CACHE_HOME to this path) so the kit's own
      # warm-up precompile re-wraps cached JIRs instead of compiling.
      #
      # The path is the whole jac cache, not jac/jir: this lane runs the
      # reroute (the checkout's compiler), and a rerouted compiler keeps
      # every JIR it writes -- its own precompiled modules and the sweep's
      # analysis entries -- under jac/rt/<generation>/. Caching jac/jir alone
      # saved ~7 MB and restored nothing. There is no digest-agnostic
      # fallback key: a generation directory from another compiler digest
      # is dead weight to restore.
      # Retries must be able to rule out a stale analysis/runtime cache.
      - name: Restore JIR analysis cache
        if: github.run_attempt == 1
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/.cache/jac
          key: jac-check-cache-v3-s${{ matrix.shard }}-${{ runner.os }}-${{ steps.inputs.outputs.compiler }}-${{ github.sha }}
          restore-keys: |
            jac-check-cache-v3-s${{ matrix.shard }}-${{ runner.os }}-${{ steps.inputs.outputs.compiler }}-

      - uses: ./.github/actions/jac-kit
        if: matrix.shard == 1 || needs.changes.outputs.scope != 'tests'
        with:
          dev: "true"

      - name: Install plugin deps so jac check resolves scale/byllm imports
        if: needs.changes.outputs.scope != 'tests'
        # Pins mirror jac/jaclang/project/capabilities.jac.
        run: |
          jac install \
            "python-dotenv>=1.2.1,<2.0.0" \
            "prometheus-client>=0.21.0,<1.0.0" \
            "opentelemetry-sdk>=1.27.0,<2.0.0" \
            "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0" \
            "apscheduler>=3.11.2,<4.0.0" "kubernetes>=34.1.0,<35.0.0" \
            "docker>=7.1.0,<8.0.0" "boto3>=1.40.0,<2.0.0" \
            "google-cloud-firestore>=2.21.0,<3.0.0" "google-cloud-storage>=2.19.0,<3.0.0" \
            "firebase-admin>=6.0.0,<8.0.0" "requests>=2.32.0,<3.0.0" \
            --global
          jac install \
            "litellm>=1.102.1,<1.103.0" "pillow>=12.0.0,<14.0.0" \
            "httpx>=0.27.0" "loguru>=0.7.2,<0.8.0" \
            --global

      - name: Run jac fmt (check formatting)
        id: fmt
        if: matrix.shard == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.mode }}" = "scoped" ]; then
            if [ "${{ steps.changes.outputs.any }}" != "true" ]; then
              echo "No .jac files changed in this PR; skipping format check."
              exit 0
            fi
            FILES="$(grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$)' changed-jac.txt || true)"
            if [ -z "$FILES" ]; then
              echo "No formattable .jac files changed (all excluded); skipping."
              exit 0
            fi
            printf '%s\n' "$FILES" | tr '\n' '\0' \
              | xargs -0 --no-run-if-empty jac fmt --check --lintfix
          else
            git ls-files -z '*.jac' | grep -zv -E '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$|_syntax_err\.jac$)' | xargs -0 --no-run-if-empty jac fmt --check --lintfix
          fi

      # Autofix push mirrors pre-commit.ci. Without a JAC_AUTOFIX_TOKEN secret
      # the pushed commit does not retrigger CI (GitHub loop protection).
      - name: Push jac fmt autofix to the PR branch
        if: |
          steps.fmt.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTOFIX_TOKEN: ${{ secrets.JAC_AUTOFIX_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$HEAD_REF"
          if git log -1 --format=%s FETCH_HEAD | grep -q '^style: jac fmt autofix'; then
            echo "::warning::Head commit is already an autofix commit but the check still failed; not pushing again."
            exit 0
          fi
          git checkout -B "$HEAD_REF" FETCH_HEAD
          FILES="$(grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$)' changed-jac.txt || true)"
          if [ -z "$FILES" ]; then
            echo "No formattable .jac files to fix."
            exit 0
          fi
          printf '%s\n' "$FILES" | tr '\n' '\0' \
            | xargs -0 --no-run-if-empty jac fmt --lintfix || true
          if git diff --quiet; then
            echo "Fixer produced no changes on the head branch; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: jac fmt autofix"
          if [ -n "$AUTOFIX_TOKEN" ]; then
            git remote set-url origin \
              "https://x-access-token:${AUTOFIX_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git push origin "HEAD:$HEAD_REF"
          echo "::notice::Pushed jac fmt autofix to $HEAD_REF; the new commit's CI run supersedes this one."

      # Fork PRs cannot receive autofix pushes; print the patch so the author
      # can apply it locally.
      - name: Show formatting diff
        if: steps.fmt.outcome == 'failure'
        run: |
          set -euo pipefail
          FILES="$(grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$)' changed-jac.txt || true)"
          if [ -n "$FILES" ]; then
            printf '%s\n' "$FILES" | tr '\n' '\0' \
              | xargs -0 --no-run-if-empty jac fmt --lintfix || true
            git --no-pager diff
          fi

      - name: Fail if formatting was not clean
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::jac fmt --check --lintfix failed for this commit (an autofix was pushed to the branch if this is a same-repo PR; fork PRs: apply the 'Show formatting diff' patch above)."
          exit 1

      # The seed-manifest bootstrap invariants and the CLI startup
      # regressions live in the suite now
      # (tests/compiler/test_seed_manifest_bootstrap.jac,
      # tests/cli/test_*_isolation.jac),
      # which the test lanes run on the same filter as this job.

      # The targets ARE jaclang's source, and jaclang.* belongs to the running
      # compiler: checked sealed, a checkout module's `import from
      # jaclang.x` resolves into the kit's bundled copy, and one class gets two
      # identities ("Cannot assign ServingApp to parameter of type
      # ServingApp"). Check the tree with its own compiler instead: this is a
      # reroute lane, as the equivalence chunk is.
      # jac.toml excludes every `tests` path from the check, so a pull request
      # that only touches tests has nothing for it to check.
      - name: Run jac check (exclusions from jac.toml [check] exclude)
        if: needs.changes.outputs.scope != 'tests'
        run: jac check . --nowarn

      - name: Save JIR analysis cache
        if: success() && needs.changes.outputs.scope != 'tests'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/.cache/jac
          key: jac-check-cache-v3-s${{ matrix.shard }}-${{ runner.os }}-${{ steps.inputs.outputs.compiler }}-${{ github.sha }}

      - name: Error-code breakdown (label "type-error-report")
        if: matrix.shard == 1 && contains(github.event.pull_request.labels.*.name, 'type-error-report')
        run: |
          set +e
          JAC_CHECK_SHARD= jac check . --nowarn > jac-check-full.log 2>&1
          {
            echo "## jac check error-code breakdown (whole codebase, no ignores)"
            echo ""
            echo "| Error code | Count |"
            echo "| --- | ---: |"
            grep -oE 'error\[E[0-9]+\]' jac-check-full.log \
              | grep -oE 'E[0-9]+' \
              | sort | uniq -c | sort -rn \
              | awk '{ printf "| %s | %d |\n", $2, $1; total += $1 }
                     END { printf "| **TOTAL** | **%d** |\n", total }'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Pure PR-metadata policy: no kit, no jac. Docs code blocks are validated
  # by the suite (tests/cli/test_docs_code_blocks.jac) in the test lanes.
  contribution-checks:
    name: Contribution Checks
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result == 'success' || github.event.action == 'labeled')
      && (github.event_name != 'push' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Block AI co-author attribution
        if: github.event_name == 'pull_request'
        run: |
          if git log origin/${{ github.base_ref }}..HEAD --format='%b' \
            | grep -iP 'co-authored-by:.*\b(claude|anthropic|openai|copilot|composer|cursor|gpt|gemini|ai|bot)\b'; then
            echo "::error::AI co-author attribution found in commit messages. Please remove Co-Authored-By lines referencing AI tools."
            exit 1
          fi

      - name: Block Python files
        if: |
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-no-python-check')
        run: |
          if git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD \
            | grep -P '\.py$'; then
            echo "::error::New Python (.py) files detected in this PR. This codebase does not allow adding Python files."
            echo "To skip this check, add the 'skip-no-python-check' label to your PR."
            exit 1
          fi

      - name: Block duplicate diagnostic codes
        # Two branches each take the next free code and the merge keeps both;
        # the registry refuses at import, which here means the kit fails to
        # build. Reading the source names the collision in seconds instead.
        # Mirrors tests/compiler/test_diagnostic_registry.jac.
        run: |
          dupes=$(grep -Pzo '\b[EW]\d{4} = _(?:err|warn)\(\s*"\K[EW]\d{4}' \
            jac/jaclang/compiler/frontend/diagnostics.jac | tr '\0' '\n' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::diagnostic code(s) claimed more than once in diagnostics.jac: $(echo $dupes)"
            exit 1
          fi

      - name: Check Release Notes Updated
        if: |
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-release-notes-check')
        env:
          CI: "true"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRE_COMMIT_FROM_REF: origin/${{ github.base_ref }}
          PRE_COMMIT_TO_REF: HEAD
        run: bash scripts/check-release-notes.sh

  # Every test lane is one entry in .github/ci/lanes.json; `changes` turns the
  # catalog into this matrix (scripts/ci_plan.sh), listing each lane's files.
  # A pull request that only touches tests gets just the lanes and files it
  # can reach; every other run gets every lane.
  test:
    name: test (${{ matrix.name }})
    needs: [changes, dev-kit, dev-precompile]
    if: needs.changes.outputs.lanes != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: ${{ matrix.submodules }}
      # Lanes that install deps with --global and re-home the test step pin
      # the runtime cache outside $HOME, before jac-kit warms it.
      - name: Pin the runtime cache outside $HOME
        if: matrix.xdg
        run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/.cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/jac-kit
        with:
          dev: "true"
      - uses: actions/setup-node@v4
        if: matrix.node
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        if: matrix.bun
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: "0.16.0"
          use-cache: false
      - name: Install the lane's packages
        if: matrix.deps != ''
        env:
          DEPS: ${{ matrix.deps }}
        run: |
          mapfile -t specs <<<"$DEPS"
          jac install "${specs[@]}" --global
      - name: Run ${{ matrix.count }} test files
        working-directory: jac
        env:
          FILES: ${{ matrix.files }}
          FILTER: ${{ matrix.filter }}
          JAC_IFACE_VERIFY: ${{ matrix.iface_verify }}
          JAC_TEST_ARTIFACTS: ${{ runner.temp }}/native-test-artifacts
          JAC_TEST_JOBS: ${{ matrix.jobs }}
          JAC_TEST_RSS_LOG: "1"
          JAC_TEST_STRICT: "1"
        run: |
          set -uo pipefail
          if [ "${{ matrix.home }}" = "true" ]; then export HOME="$(mktemp -d)"; fi
          # shellcheck disable=SC2086
          jac test $FILES ${FILTER:+-f "$FILTER"}
      - name: Preserve failed native executables
        if: failure() && matrix.artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-test-failures-${{ matrix.name }}
          path: ${{ runner.temp }}/native-test-artifacts
          if-no-files-found: ignore

  # aarch64 cross lane: in-house ELF linker + arch-parameterized musl from the
  # kit, binaries run under qemu-user.
  test-native-aarch64:
    needs: [changes, dev-kit, dev-precompile]
    # Runs on the schedule, manual runs, and pull requests that touch native
    # paths; pushes leave it to the schedule. Was:
    # if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.native == 'true') }}
    # ubuntu-latest (26.04) no longer ships qemu-user-static as an installable package.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install qemu-user and aarch64 cross libc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static libc6-arm64-cross
      - uses: ./.github/actions/jac-kit
        with:
          dev: "true"
      - name: Run aarch64 cross tests under qemu
        env:
          JAC_TEST_JOBS: "0"
        run: >-
          jac test jac/tests/compiler/backends/native/test_native_gen_pass.jac
          -f aarch64

  # The single-binary launcher and its build tooling are Jac: the trailer codec
  # and payload tool (tests/payload), the bundled zstd/tar decode path the
  # launcher materializes through, the walk-up import shape the stub is built
  # with, and an end-to-end fused-runtime boot of a freshly compiled na host.
  test-launcher-jac:
    needs: [changes, dev-kit, dev-precompile]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/jac-kit
        with:
          dev: "true"
      - name: Payload tool + trailer codec
        run: jac test jac/tests/payload/
      - name: Bundled zstd + tarfile decode path
        run: |
          jac test jac/jaclang/compiler/tests/test_zstd_equivalence.jac
          jac test jac/jaclang/compiler/tests/test_tarfile_equivalence.jac
      - name: Native import shapes the stub relies on
        run: |
          jac test jac/tests/compiler/backends/native/test_walkup_imports.jac
          jac test jac/jaclang/compiler/tests/test_prim_equivalence.jac -f "environ"
      - name: Fused-runtime boot of a fresh na host
        run: jac test jac/tests/client/test_fused_runtime_boot.jac

  # Bootstrap unit tests: the Zig seeds that fetch the prebuilt CPython and the
  # other pinned inputs before any Python exists (bootstrap/). Cross-platform on
  # purpose. The
  # launcher itself is Jac; its trailer codec, payload tool and boot path are
  # covered by `jac test` in the kit lanes below.
  test-bootstrap:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Bootstrap unit tests (zig build test)
        working-directory: jac
        run: zig build test --summary all
      - name: Cache key mutation tests
        run: bash scripts/test_ci_cache_keys.sh

      - name: Test plan mutation tests
        run: bash scripts/test_ci_plan.sh
      - name: Carry-over verdict tests
        run: bash scripts/test_ci_carry_verdict.sh

  # Body lives in _installer.yml so the nightly lane runs the same test
  # instead of a second copy of it. The PR lane lints install.sh; the nightly
  # one does not (it exercises the published installer, not this checkout).
  installer-test:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.installer == 'true') }}
    uses: ./.github/workflows/_installer.yml
    with:
      shellcheck: true

  # Red on main while the latest finished release rehearsal
  # (release-rehearsal.yml, daily 03:00 Asia/Colombo) is failing, and on every
  # later main run until a rehearsal passes. release-rehearsal-verdict.yml
  # re-runs it when a rehearsal finishes. Pull requests skip it.
  release-rehearsal:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: The latest release rehearsal passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! latest="$(gh api "repos/$GH_REPO/actions/workflows/release-rehearsal.yml/runs?branch=main&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0] // empty | "\(.conclusion) \(.html_url)"')"; then
            echo "::warning::Could not read the release rehearsal runs."
            exit 0
          fi
          if [ -z "$latest" ]; then
            echo "No finished release rehearsal yet."
            exit 0
          fi
          read -r conclusion url <<<"$latest"
          if [ "$conclusion" != success ]; then
            echo "::error::The latest release rehearsal failed: $url. main stays red until a rehearsal passes; after the fix, dispatch release-rehearsal.yml."
            exit 1
          fi
          echo "The latest release rehearsal passed: $url"

  # Aggregate gate: branch protection requires only this context. A NEW job
  # must be added to needs below by hand; always() so failures upstream fail
  # the gate instead of skipping it (skipped required checks count as passing).
  everything-passed:
    name: Everything Passed
    if: always()
    needs:
      - changes
      - release-rehearsal
      - dev-kit
      - dev-precompile
      - jac-check
      - contribution-checks
      - test
      - test-native-aarch64
      - test-bootstrap
      - test-launcher-jac
      - installer-test
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # A label-only run skips every suite, and the newest Everything Passed on
      # a commit is the one that gates it, so that run repeats the verdict of
      # an earlier run (scripts/ci_carry_verdict.sh says which).
      - name: Check out the carry-over script
        if: needs.changes.result == 'skipped'
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci_carry_verdict.sh
          sparse-checkout-cone-mode: false
      - name: Carry the previous run's verdict over a label-only run
        if: needs.changes.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_K8S: ${{ contains(github.event.pull_request.labels.*.name, 'skip-k8s') }}
        run: bash scripts/ci_carry_verdict.sh
      - name: Fail if any dependency failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "::error::One or more CI jobs failed or were cancelled; blocking merge."
          echo "Per-job results:"
          echo "$RESULTS"
          exit 1
      - name: All required jobs passed (or were skipped)
        run: echo "Everything passed. ✅"
