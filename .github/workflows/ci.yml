name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:
  schedule:
    # Weekly full-suite safety net (classifier forces all jobs).
    - cron: "0 10 * * 0"

# Cancel superseded PR runs; never cancel a run for a commit on main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Test the SHIPPED binary, not the checkout's `[dev] jaclang_source` dev loop.
env:
  JAC_NO_DEV_SOURCE: "1"

jobs:
  # Fail-closed router: changed paths → expected jobs + full-suite flag.
  # Unknown/unclassified paths select full CI and fail coverage-audit.
  #
  # Per-job gates use run_<job> outputs (hyphens → underscores), one per manifest
  # job except jac-check (always runs) and always_run_jobs. GHA cannot consume a
  # single selected_jobs JSON blob in downstream if: expressions, so the router
  # mirrors each job as its own output; selected_jobs is for everything-passed only.
  # Adding a routable job requires: ci-coverage.yml jobs list, a workflow job + if
  # gate, a run_* output here, and everything-passed.needs — check-ci-coverage.sh
  # validates all four. See scripts/ci/README.md.
  ci-router:
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.route.outputs.full_ci }}
      audit_fail: ${{ steps.route.outputs.audit_fail }}
      unknown: ${{ steps.route.outputs.unknown }}
      selected_jobs: ${{ steps.route.outputs.selected_jobs }}
      run_contribution_checks: ${{ steps.route.outputs.run_contribution_checks }}
      run_test_compiler_root: ${{ steps.route.outputs.run_test_compiler_root }}
      run_test_compiler_passes_main: ${{ steps.route.outputs.run_test_compiler_passes_main }}
      run_test_compiler_passes_ecmascript: ${{ steps.route.outputs.run_test_compiler_passes_ecmascript }}
      run_test_compiler_passes_native: ${{ steps.route.outputs.run_test_compiler_passes_native }}
      run_test_compiler_passes_tool: ${{ steps.route.outputs.run_test_compiler_passes_tool }}
      run_test_compiler_equivalence: ${{ steps.route.outputs.run_test_compiler_equivalence }}
      run_test_runtime_core: ${{ steps.route.outputs.run_test_runtime_core }}
      run_test_runtime_cli_language: ${{ steps.route.outputs.run_test_runtime_cli_language }}
      run_test_runtime_project_publish_utils_langserve: ${{ steps.route.outputs.run_test_runtime_project_publish_utils_langserve }}
      run_test_solid_and_desktop: ${{ steps.route.outputs.run_test_solid_and_desktop }}
      run_test_client: ${{ steps.route.outputs.run_test_client }}
      run_test_byllm: ${{ steps.route.outputs.run_test_byllm }}
      run_test_docs: ${{ steps.route.outputs.run_test_docs }}
      run_test_native_macos: ${{ steps.route.outputs.run_test_native_macos }}
      run_test_native_aarch64: ${{ steps.route.outputs.run_test_native_aarch64 }}
      run_test_launcher: ${{ steps.route.outputs.run_test_launcher }}
      run_test_cef_build: ${{ steps.route.outputs.run_test_cef_build }}
      run_test_scale: ${{ steps.route.outputs.run_test_scale }}
      run_test_scale_k8s: ${{ steps.route.outputs.run_test_scale_k8s }}
      run_test_precompile: ${{ steps.route.outputs.run_test_precompile }}
      run_test_integration_scripts: ${{ steps.route.outputs.run_test_integration_scripts }}
      run_test_built_byllm: ${{ steps.route.outputs.run_test_built_byllm }}
      run_test_jac_site_smoke: ${{ steps.route.outputs.run_test_jac_site_smoke }}
      run_test_fullstack_eject_smoke: ${{ steps.route.outputs.run_test_fullstack_eject_smoke }}
      run_k8s_real_e2e: ${{ steps.route.outputs.run_k8s_real_e2e }}
      run_installer_test: ${{ steps.route.outputs.run_installer_test }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure PyYAML for classifier
        run: python3 -c "import yaml" || pip install -r scripts/ci/requirements.txt

      - name: Decide routing mode
        id: mode
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          mode=pr
          case "${{ github.event_name }}" in
            merge_group|workflow_dispatch|schedule|push)
              mode=full
              ;;
            pull_request)
              if printf '%s' "$LABELS" | grep -qE '"(full-ci|ready-to-merge)"'; then
                mode=full
              fi
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Collect changed paths (PR iteration mode)
        if: steps.mode.outputs.mode == 'pr'
        id: paths
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${{ github.base_ref }}"
          BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          # --no-renames: classify a rename as delete(source) + add(destination)
          # so removing a full-CI file into an allowlisted dir cannot hide the
          # impact of the vanished source path (name-only would emit only the
          # destination and silently narrow the routing).
          # --diff-filter=ACDMRT includes T (type change, e.g. file -> symlink);
          # ACDMR would drop pure type-only changes and let CI narrow on a
          # change that is effectively a content change to that path.
          git diff -z --name-only --diff-filter=ACDMRT --no-renames "$BASE" HEAD > changed-paths.z

      - name: Classify changed paths
        id: route
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            scripts/ci/classify-changed-files.sh --mode full
          else
            scripts/ci/classify-changed-files.sh < changed-paths.z
          fi

  coverage-audit:
    needs: ci-router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ensure PyYAML for CI scripts
        run: python3 -c "import yaml" || pip install -r scripts/ci/requirements.txt
      - name: Manifest ↔ workflow sync
        run: scripts/ci/check-ci-coverage.sh
      - name: Shard inventory completeness
        run: scripts/ci/verify-shard-inventory.sh
      - name: Router safety tests
        run: bash scripts/ci/test/router-tests.sh
      - name: Fail on unclassified paths
        if: needs.ci-router.outputs.audit_fail == 'true'
        run: |
          echo "::error::Unclassified changed paths — update scripts/ci/ci-coverage.yml"
          exit 1

  # Build (or cache-restore) the jac binary ONCE per run, smoke it hermetically,
  # and publish it (plus the gitignored typeshed stubs) as artifacts. Every
  # Linux job below gates on this and downloads the artifact instead of calling
  # setup-jac again -- a second setup-jac is a ~3 min rebuild whenever
  # jaclang/** changed (the binary cache key hashes it), paid once per job.
  # Only jac-check and contribution-checks still run setup-jac: they are
  # required checks that must not depend on this job (a skipped required check
  # would satisfy branch protection). Jobs that ship or introspect the binary
  # by path expect it at jac/zig-out/bin/jac, where setup-jac builds it, so
  # the download steps below restore it there.
  build-jac:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - name: Set up jac (build the binary once, cached)
        uses: ./.github/actions/setup-jac

      # On a binary-cache hit the build (and its typeshed fetch) is skipped;
      # fetch-typeshed is a cheap idempotent materializer either way.
      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Materialize typeshed stdlib stubs into the checkout
        working-directory: jac
        # -Dno-ninja: typeshed is editor-independent. setup-jac above may have
        # hit the binary cache (no build), so a bare fetch-typeshed would pull
        # the neovim + Lua closure just to materialize stubs.
        run: zig build -Dno-ninja fetch-typeshed --summary all

      - name: Hermeticity + smoke (no system Python)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          ldd "$BIN" || true
          ! ldd "$BIN" | grep -qi python
          WORK="$(mktemp -d)"
          printf 'obj P { has x:int=0; def sq->int { return self.x*self.x; } }\nwith entry { print(P(x=7).sq()); }\n' > "$WORK/obj.jac"
          env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_NO_DEV_SOURCE=1 "$BIN" --version
          out="$(env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_NO_DEV_SOURCE=1 "$BIN" run "$WORK/obj.jac")"
          echo "$out" | grep -q 49

      - name: Run real jac programs (end-to-end execution)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          WORK="$(mktemp -d)"; cd "$WORK"
          cat > a.jac <<'JAC'
          obj Point { has x: int; has y: int; def dist -> float { return (self.x*self.x + self.y*self.y) ** 0.5; } }
          with entry {
              p = Point(x=3, y=4);
              print("dist", p.dist());
              print([i*i for i in range(5)]);
          }
          JAC
          out="$(env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_NO_DEV_SOURCE=1 "$BIN" run "$WORK/a.jac")"
          echo "$out" | grep -q "dist 5.0"
          echo "$out" | grep -q "0, 1, 4, 9, 16"

      - name: jac test runner (self-contained test file)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          WORK="$(mktemp -d)"
          cat > "$WORK/test_smoke.jac" <<'JAC'
          test "arithmetic" { assert 6 * 7 == 42; }
          test "comprehension" { assert [i for i in range(3)] == [0, 1, 2]; }
          test "strings" { assert "ja" + "c" == "jac"; }
          JAC
          env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_TEST_JOBS=0 JAC_NO_DEV_SOURCE=1 "$BIN" test "$WORK/test_smoke.jac"

      - name: Upload the jac binary
        uses: actions/upload-artifact@v4
        with:
          name: jac-binary
          path: jac/zig-out/bin/jac
          retention-days: 1
          if-no-files-found: error

      - name: Upload typeshed stdlib stubs
        uses: actions/upload-artifact@v4
        with:
          name: typeshed-stdlib
          path: jac/jaclang/vendor/typeshed/stdlib
          retention-days: 1
          if-no-files-found: error

  # Compiler suite shards (directory-complete; replaces monolithic test-compiler).
  test-compiler-root:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_compiler_root == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-compiler-test-env
      - name: Compiler root tests
        working-directory: jac
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          rc=0
          HOME="$WORK" JAC_TEST_JOBS=auto jac test tests/compiler --ignore tests/compiler/passes | tee /tmp/compiler-root.log || rc=$?
          grep -E '^(FAILED|ERROR)|passed|failed' /tmp/compiler-root.log | tail -30 >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

  test-compiler-passes-main:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_compiler_passes_main == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-compiler-test-env
      - name: Compiler passes/main
        working-directory: jac
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          HOME="$WORK" JAC_TEST_JOBS=auto jac test tests/compiler/passes/main

  test-compiler-passes-ecmascript:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_compiler_passes_ecmascript == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-compiler-test-env
      - name: Compiler passes/ecmascript
        working-directory: jac
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          HOME="$WORK" JAC_TEST_JOBS=auto jac test tests/compiler/passes/ecmascript

  test-compiler-passes-native:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_compiler_passes_native == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-compiler-test-env
      - name: Compiler passes/native
        working-directory: jac
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          HOME="$WORK" JAC_TEST_JOBS=auto jac test tests/compiler/passes/native

  test-compiler-passes-tool:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_compiler_passes_tool == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-compiler-test-env
      - name: Compiler passes/tool
        working-directory: jac
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          HOME="$WORK" JAC_TEST_JOBS=auto jac test tests/compiler/passes/tool

  test-compiler-equivalence:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_compiler_equivalence == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-compiler-test-env
      - name: Cross-backend equivalence suite (py/es/native congruence)
        working-directory: jac
        env:
          JAC_NO_DEV_SOURCE: ""
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          rc=0
          HOME="$WORK" JAC_TEST_JOBS=auto jac test jaclang/compiler/tests | tee /tmp/equivalence.log || rc=$?
          {
            echo "## binary equivalence-suite result"
            echo '```'
            grep -E '^(FAILED|ERROR)|passed|failed' /tmp/equivalence.log | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  test-runtime-core:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_runtime_core == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-compiler-test-env
        with:
          with-typeshed: "false"
          setup-bun: "true"
      - name: Runtime core (excludes client — dedicated job)
        working-directory: jac
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          rc=0
          HOME="$WORK" JAC_TEST_JOBS=auto jac test tests/runtimelib --ignore tests/runtimelib/client | tee /tmp/runtime-core.log || rc=$?
          grep -E '^(FAILED|ERROR)|passed|failed' /tmp/runtime-core.log | tail -60 >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

  test-runtime-cli-language:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_runtime_cli_language == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-compiler-test-env
        with:
          with-typeshed: "false"
          setup-bun: "true"
      - name: CLI + language tests (excludes docs corpus — test-docs job)
        working-directory: jac
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          HOME="$WORK" JAC_TEST_JOBS=auto jac test tests/cli tests/language \
            --ignore tests/cli/test_docs_content.jac \
            --ignore tests/cli/test_guide_docs.jac

  test-runtime-project-publish-utils-langserve:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_runtime_project_publish_utils_langserve == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-compiler-test-env
        with:
          with-typeshed: "false"
          setup-bun: "true"
      - name: Project / publish / utils / langserve
        working-directory: jac
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          HOME="$WORK" JAC_TEST_JOBS=auto jac test tests/project tests/publish tests/utils tests/langserve

  # Required check: no needs on build-jac (a skipped required check would
  # satisfy branch protection); it restores the same binary cache itself.
  jac-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      # On PRs, scope format/check to the .jac files changed vs the merge-base;
      # otherwise run the whole repo.
      - name: Determine changed .jac files
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Full-repo mode (event: ${{ github.event_name }})."
            exit 0
          fi
          git fetch --no-tags --quiet origin "${{ github.base_ref }}"
          BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.jac' > changed-jac.txt || true
          echo "mode=scoped" >> "$GITHUB_OUTPUT"
          if [ -s changed-jac.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed .jac files in this PR:"
          cat changed-jac.txt || true

      - name: Set up jac (build the binary)
        uses: ./.github/actions/setup-jac

      - name: Install plugin deps so jac check resolves scale/byllm imports
        # Pins mirror jac/jaclang/project/capabilities.jac.
        run: |
          jac install \
            "fastapi>=0.121.3,<0.122.0" "uvicorn[standard]>=0.38.0,<0.39.0" \
            "pyjwt>=2.10.1,<2.11.0" "fastapi-sso>=0.21.0,<1.0.0" \
            "python-multipart>=0.0.21,<1.0.0" "bcrypt>=4.0.0,<5.0.0" \
            "aiohttp>=3.9.0,<4.0.0" "sqlalchemy>=2.0.0,<3.0.0" \
            "email-validator>=2.3.0,<3.0.0" "python-dotenv>=1.2.1,<2.0.0" \
            "pymongo>=4.15.4,<5.0.0" "redis>=7.1.0,<8.0.0" \
            "prometheus-client>=0.21.0,<1.0.0" \
            "opentelemetry-sdk>=1.27.0,<2.0.0" \
            "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0" \
            "apscheduler>=3.11.2,<4.0.0" "kubernetes>=34.1.0,<35.0.0" \
            "docker>=7.1.0,<8.0.0" "boto3>=1.40.0,<2.0.0" \
            "google-cloud-firestore>=2.21.0,<3.0.0" "google-cloud-storage>=2.19.0,<3.0.0" \
            "firebase-admin>=6.0.0,<8.0.0" "requests>=2.32.0,<3.0.0" \
            --global
          jac install \
            "litellm>=1.70.0,<=1.82.6" "pillow>=12.0.0,<13.0.0" \
            "httpx>=0.27.0" "loguru>=0.7.2,<0.8.0" \
            --global

      - name: Warm up compiler cache
        run: jac --version

      - name: Run jac fmt (check formatting)
        id: fmt
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.mode }}" = "scoped" ]; then
            if [ "${{ steps.changes.outputs.any }}" != "true" ]; then
              echo "No .jac files changed in this PR; skipping format check."
              exit 0
            fi
            FILES="$(grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$|/manifest\.impl\.jac$)' changed-jac.txt || true)"
            if [ -z "$FILES" ]; then
              echo "No formattable .jac files changed (all excluded); skipping."
              exit 0
            fi
            printf '%s\n' "$FILES" | tr '\n' '\0' \
              | xargs -0 --no-run-if-empty jac fmt --check --lintfix
          else
            # Sweep only git-tracked files: the build materializes generated
            # trees in-place (e.g. jac/zig-pkg/ zig package fetches with their
            # own sample .jac files), and a bare `find .` walks those too.
            git ls-files -z '*.jac' | grep -zv -E '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$|_syntax_err\.jac$|/manifest\.impl\.jac$)' | xargs -0 --no-run-if-empty jac fmt --check --lintfix
          fi

      # When the format check fails on a same-repo PR, run the fixer on the PR
      # head branch and push the result, mirroring what pre-commit.ci does for
      # the hooks it can run (it cannot run jac, so jac fmt is autofixed here).
      # NOTE: pushes made with the default GITHUB_TOKEN deliberately do NOT
      # trigger new workflow runs (GitHub's loop protection), so the pushed fix
      # only re-runs CI automatically when a JAC_AUTOFIX_TOKEN repo secret (a
      # fine-grained PAT or GitHub App token with contents: write) is
      # configured. Without it the fix still lands on the branch, but the
      # checks on the new commit must be started manually (or by the next
      # push). Fork PRs are skipped: no writable token exists for them.
      - name: Push jac fmt autofix to the PR branch
        if: |
          steps.fmt.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTOFIX_TOKEN: ${{ secrets.JAC_AUTOFIX_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$HEAD_REF"
          # Loop breaker: if the head commit is already an autofix and the
          # check still failed, the formatter is unstable -- do not ping-pong.
          if git log -1 --format=%s FETCH_HEAD | grep -q '^style: jac fmt autofix'; then
            echo "::warning::Head commit is already an autofix commit but the check still failed; not pushing again."
            exit 0
          fi
          git checkout -B "$HEAD_REF" FETCH_HEAD
          FILES="$(grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$|/manifest\.impl\.jac$)' changed-jac.txt || true)"
          if [ -z "$FILES" ]; then
            echo "No formattable .jac files to fix."
            exit 0
          fi
          printf '%s\n' "$FILES" | tr '\n' '\0' \
            | xargs -0 --no-run-if-empty jac fmt --lintfix || true
          if git diff --quiet; then
            echo "Fixer produced no changes on the head branch; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: jac fmt autofix"
          if [ -n "$AUTOFIX_TOKEN" ]; then
            git remote set-url origin \
              "https://x-access-token:${AUTOFIX_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git push origin "HEAD:$HEAD_REF"
          echo "::notice::Pushed jac fmt autofix to $HEAD_REF; the new commit's CI run supersedes this one."

      - name: Fail if formatting was not clean
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::jac fmt --check --lintfix failed for this commit (an autofix was pushed to the branch if this is a same-repo PR)."
          exit 1

      - name: Verify jir_registry.jac is up to date
        run: |
          jac gen-jir-registry --verify

      - name: Verify manifest route table is up to date
        run: |
          jac gen-cli-manifest --verify

      - name: Run CLI startup regression tests
        env:
          JAC_TEST_JOBS: "0"
        run: |
          jac test \
            jac/tests/cli/test_command_isolation.jac \
            jac/tests/cli/test_config_key_bridge.jac \
            jac/tests/cli/test_manifest_parity.jac \
            jac/tests/cli/test_startup_isolation.jac

      - name: Run jac check (using .jacignore)
        run: |
          set -euo pipefail
          IGNORE_ARGS="tests checker_*.jac *_err.jac $(grep -v '^#' .jacignore | grep -v '^[[:space:]]*$' | tr '\n' ' ')"
          if [ "${{ steps.changes.outputs.mode }}" = "scoped" ]; then
            if [ "${{ steps.changes.outputs.any }}" != "true" ]; then
              echo "No .jac files changed in this PR; skipping jac check."
              exit 0
            fi
            jac check $(cat changed-jac.txt) --ignore $IGNORE_ARGS --nowarn
          else
            jac check . --ignore $IGNORE_ARGS --nowarn
          fi

      - name: Error-code breakdown (label "type-error-report")
        if: contains(github.event.pull_request.labels.*.name, 'type-error-report')
        run: |
          set +e
          echo "Scanning the whole codebase (no ignores) for an error-code breakdown..."
          jac check . --nowarn > jac-check-full.log 2>&1

          {
            echo "## jac check error-code breakdown (whole codebase, no ignores)"
            echo ""
            echo "| Error code | Count |"
            echo "| --- | ---: |"
            grep -oE 'error\[E[0-9]+\]' jac-check-full.log \
              | grep -oE 'E[0-9]+' \
              | sort | uniq -c | sort -rn \
              | awk '{ printf "| %s | %d |\n", $2, $1; total += $1 }
                     END { printf "| **TOTAL** | **%d** |\n", total }'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

  # Required check ("Contribution Checks" is the branch-protection context
  # name): independent of build-jac for the same reason as jac-check.
  contribution-checks:
    name: Contribution Checks
    needs: ci-router
    # On push/merge_group/schedule the router runs in full mode, so run_* is always true.
    if: ${{ github.event_name != 'push' || needs.ci-router.outputs.run_contribution_checks == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Block AI co-author attribution
        if: github.event_name == 'pull_request'
        run: |
          if git log origin/${{ github.base_ref }}..HEAD --format='%b' \
            | grep -iP 'co-authored-by:.*\b(claude|anthropic|openai|copilot|composer|cursor|gpt|gemini|ai|bot)\b'; then
            echo "::error::AI co-author attribution found in commit messages. Please remove Co-Authored-By lines referencing AI tools."
            exit 1
          fi

      - name: Block Python files
        if: |
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-no-python-check')
        run: |
          if git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD \
            | grep -P '\.py$'; then
            echo "::error::New Python (.py) files detected in this PR. This codebase does not allow adding Python files."
            echo "To skip this check, add the 'skip-no-python-check' label to your PR."
            exit 1
          fi

      - name: Check bun version lockstep
        run: |
          jac_ver=$(grep -oE 'glob BUN_VERSION = "[^"]+"' jac/jaclang/runtimelib/client/bun_installer.jac | grep -oE '"[^"]+"' | tr -d '"')
          zig_ver=$(grep -oE 'const BUN_VERSION = "[^"]+"' jac/launcher/payload.zig | grep -oE '"[^"]+"' | tr -d '"')
          echo "jaclang BUN_VERSION='$jac_ver'  payload.zig BUN_VERSION='$zig_ver'"
          if [ -z "$jac_ver" ] || [ -z "$zig_ver" ]; then
            echo "::error::Could not read BUN_VERSION from both bun_installer.jac and payload.zig"
            exit 1
          fi
          if [ "$jac_ver" != "$zig_ver" ]; then
            echo "::error::BUN_VERSION mismatch: bun_installer.jac=$jac_ver vs payload.zig=$zig_ver. The Jac resolver/deploy pin and the Zig fetcher must stay in lockstep."
            exit 1
          fi

      - name: Set up jac (build the binary)
        uses: ./.github/actions/setup-jac

      - name: Validate Jac code blocks in the docs corpus
        run: jac run scripts/validate_docs_code.jac

      - name: Check Release Notes Updated
        if: |
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-release-notes-check')
        env:
          CI: "true"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/check-release-notes.sh

  test-solid-and-desktop:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_solid_and_desktop == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Check out code
      uses: actions/checkout@v5
      with:
        submodules: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - uses: ./.github/actions/use-jac-binary
      with:
        with-typeshed: "false"
        binary-path: jac/zig-out/bin

    - name: Run Solid jsdom runtime test
      env:
        JAC_CLIENT_INTEGRATION: "1"
      run: jac test jac/tests/runtimelib/test_solid_jsdom.jac -x

    - name: Run dependency-free desktop tests
      run: jac test jac/tests/runtimelib/client/test_desktop_binding.jac

  test-client:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_client == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Check out code
      uses: actions/checkout@v5
      with:
        submodules: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - uses: ./.github/actions/use-jac-binary
      with:
        with-typeshed: "false"
        binary-path: jac/zig-out/bin

    - name: Set environment for testing
      run: echo "TEST_ENV=true" >> $GITHUB_ENV

    - name: Run all client tests
      # Serial: xdist workers intermittently disagree on collection of
      # test_react_native_target.jac ("Different tests were collected").
      env:
        JAC_TEST_JOBS: "0"
      run: jac test jac/tests/runtimelib/client --ignore jac/tests/runtimelib/client/test_inprocess_dispatch.jac

    - name: Re-run in-process sv dispatch against the built-in scale backend
      # Pins mirror jac/jaclang/project/capabilities.jac.
      run: |
        jac install \
          "fastapi>=0.121.3,<0.122.0" "uvicorn[standard]>=0.38.0,<0.39.0" \
          "pyjwt>=2.10.1,<2.11.0" "fastapi-sso>=0.21.0,<1.0.0" \
          "python-multipart>=0.0.21,<1.0.0" "bcrypt>=4.0.0,<5.0.0" \
          "aiohttp>=3.9.0,<4.0.0" "sqlalchemy>=2.0.0,<3.0.0" \
          "email-validator>=2.3.0,<3.0.0" "python-dotenv>=1.2.1,<2.0.0" \
          --global
        jac test -vv jac/tests/runtimelib/client/test_inprocess_dispatch.jac

  test-byllm:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_byllm == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Check out code
      uses: actions/checkout@v5
      with:
        submodules: true

    - uses: ./.github/actions/use-jac-binary
      with:
        with-typeshed: "false"
        binary-path: jac/zig-out/bin

    - name: Install byllm deps + test deps
      run: |
        jac install \
          "litellm>=1.70.0,<=1.82.6" "pillow>=12.0.0,<13.0.0" \
          "httpx>=0.27.0" "loguru>=0.7.2,<0.8.0" \
          --global

    - name: Set environment for testing
      run: echo "TEST_ENV=true" >> $GITHUB_ENV

    - name: Run package tests
      run: jac test jac/jaclang/byllm/tests

  test-docs:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_docs == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - name: Check out code
      uses: actions/checkout@v5
      with:
        submodules: true

    - uses: ./.github/actions/use-jac-binary
      with:
        with-typeshed: "false"

    - name: Run docs corpus tests
      run: jac test jac/tests/cli/test_docs_content.jac jac/tests/cli/test_guide_docs.jac

  test-native-macos:
    needs: ci-router
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_native_macos == 'true'
    runs-on: macos-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v5
      with:
        submodules: true

    - name: Set up jac (build the binary)
      uses: ./.github/actions/setup-jac

    - name: Run native Mach-O linker regression tests
      run: |
        jac test jac/tests/compiler/passes/native/test_shared_lib.jac
        jac test jac/tests/compiler/passes/native/test_exec_link.jac

    # na->wasm had no CI lane at all: test_wasm_build.jac ran nowhere and
    # `vendor-wasm-libc` was never invoked, so a floor compiled from an older
    # wasm_rt/ (the #7149 __jac64_realloc gap) could only be found by a user.
    # setup-jac builds the binary, which builds the floor, so this also proves
    # the shipped floor and the source tree agree.
    - name: Run na->wasm floor + import-contract tests
      run: jac test jac/tests/compiler/passes/native/test_wasm_build.jac

    - name: Run bundled-stdlib equivalence pins (darwin, #7626 C3)
      env:
        JAC_TEST_JOBS: "0"
        # os.path + textwrap + keyword are pure-compute na modules that must
        # agree on darwin; the shutil pin self-skips there until the stat
        # seam gets a per-OS floor (see test_prim_equivalence.jac).
        PYTEST_ADDOPTS: -k "shutil or path or textwrap or keyword"
      run: jac test jac/jaclang/compiler/tests/test_prim_equivalence.jac

  # aarch64 cross lane (#7626 C1): cross-compile with the in-house ELF linker
  # (MOVW_UABS relocation family) + arch-parameterized vendored musl, run the
  # binaries under qemu-user. This was the native suite's last environmental
  # skip: without qemu + cross libc the #6366 runtime tests never execute.
  test-native-aarch64:
    needs: ci-router
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_native_aarch64 == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install qemu-user and aarch64 cross libc
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends qemu-user-static libc6-arm64-cross

    - name: Set up jac (build the binary)
      uses: ./.github/actions/setup-jac

    - name: Vendor cross musl (aarch64)
      working-directory: jac
      run: zig build -Dno-ninja vendor-musl-linux-aarch64 --summary all

    - name: Run aarch64 cross tests under qemu
      env:
        JAC_TEST_JOBS: "0"
        PYTEST_ADDOPTS: -k aarch64
        # The sealed CI binary's pkg_root only bundles host-arch musl; point
        # the static-link search at the repo-vendored cross runtime.
        JAC_NATIVE_MUSL_DIR: ${{ github.workspace }}/jac/.pbs-build/linux-aarch64/musl/lib
      run: jac test jac/tests/compiler/passes/native/test_native_gen_pass.jac

  # Launcher unit tests: trailer codec + `.jab`-overlay round-trip
  # (append / detect / materialize-steps-over-overlay / graft). runtime.zig is
  # the sole owner of the trailer format, so these guard the whole `--as binary`
  # boot shape. Host-native, no libpython/LLVM/typeshed -- just checkout + zig.
  # Cross-platform matrix on purpose: the format code has Linux/macOS-divergent
  # syscall behavior (a /proc createDirPath livelock once hung this on Linux
  # only, while macOS was green). -Dno-ninja skips the editor closure this
  # never needs.
  test-launcher:
    needs: ci-router
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_launcher == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Launcher unit tests (zig build test)
        working-directory: jac
        run: zig build -Dno-ninja test --summary all

  test-cef-build:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_cef_build == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - uses: ./.github/actions/use-jac-binary
      with:
        with-typeshed: "false"
        binary-path: jac/zig-out/bin

    - name: Build dispatch shim and subprocess binary
      working-directory: jac/jaclang/runtimelib/client/targets/desktop/native/cef
      run: jac run build.jac

    - name: Verify shared-object exports
      working-directory: jac/jaclang/runtimelib/client/targets/desktop/native/cef
      run: |
        nm -D libcef_dispatch.so | grep -q cef_dispatch_startup
        nm -D libcef_dispatch.so | grep -q cef_dispatch_execute_process
        nm -D libcef_dispatch.so | grep -q cef_platform_bootstrap

    - name: Check RPATH
      working-directory: jac/jaclang/runtimelib/client/targets/desktop/native/cef
      run: |
        readelf -d libcef_dispatch.so | grep -qE '(RUN)?PATH.*\$ORIGIN'

    - name: ldd audit (no missing deps against libc + libcef stub)
      working-directory: jac/jaclang/runtimelib/client/targets/desktop/native/cef
      run: |
        MISSING=$(ldd libcef_dispatch.so 2>&1 | grep 'not found' | grep -v libcef || true)
        [ -z "$MISSING" ] || (echo "Unexpected missing deps: $MISSING" && exit 1)

  test-scale:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_scale == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        group: [server, data, microservices, deploy, misc]
    steps:
    - name: Check out code
      uses: actions/checkout@v5
      with:
        submodules: true

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    # Artifact MUST land at jac/zig-out/bin: microservices bundle tests read
    # the pod binary from that checkout path via __file__-relative lookup.
    - uses: ./.github/actions/use-jac-binary
      with:
        with-typeshed: "false"
        binary-path: jac/zig-out/bin

    - name: Install scale deps + test deps
      # Pins mirror jac/jaclang/project/capabilities.jac.
      run: |
        jac install \
          "fastapi>=0.121.3,<0.122.0" "uvicorn[standard]>=0.38.0,<0.39.0" \
          "pyjwt>=2.10.1,<2.11.0" "fastapi-sso>=0.21.0,<1.0.0" \
          "python-multipart>=0.0.21,<1.0.0" "bcrypt>=4.0.0,<5.0.0" \
          "aiohttp>=3.9.0,<4.0.0" "sqlalchemy>=2.0.0,<3.0.0" \
          "email-validator>=2.3.0,<3.0.0" "python-dotenv>=1.2.1,<2.0.0" \
          "pymongo>=4.15.4,<5.0.0" "redis>=7.1.0,<8.0.0" \
          "prometheus-client>=0.21.0,<1.0.0" \
          "opentelemetry-sdk>=1.27.0,<2.0.0" \
          "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0" \
          "apscheduler>=3.11.2,<4.0.0" "kubernetes>=34.1.0,<35.0.0" \
          "docker>=7.1.0,<8.0.0" "boto3>=1.40.0,<2.0.0" \
          requests "testcontainers[mongodb,redis]>=4.15,<5" "moto[s3]>=5.0.0" \
          --global

    - name: Run ${{ matrix.group }} tests
      run: |
        set +e
        failed=""
        # One process per file: the suite relies on per-file isolation.
        for f in jac/jaclang/scale/tests/${{ matrix.group }}/test_*.jac; do
          echo "::group::$f"
          JAC_TEST_JOBS=0 jac test "$f" || failed="$failed $f"
          echo "::endgroup::"
        done
        if [ -n "$failed" ]; then
          echo "::error::Failed ${{ matrix.group }} test files:$failed"
          exit 1
        fi

    - name: Run root-level scale tests (identity, firebase, inprocess, version pin)
      if: matrix.group == 'data'
      # Root-level test_*.jac files the matrix globs don't reach. Base scale
      # deps only (bcrypt, config) - no firebase-admin needed here. Includes
      # test_inprocess / test_version_pin, which previously ran under no job.
      env:
        JAC_TEST_JOBS: "0"
      run: |
        jac test jac/jaclang/scale/tests/test_identity_password.jac -x
        jac test jac/jaclang/scale/tests/test_firebase_env.jac -x
        jac test jac/jaclang/scale/tests/test_inprocess.jac -x
        jac test jac/jaclang/scale/tests/test_version_pin.jac -x

    - name: Install scale firebase deps
      if: matrix.group == 'data'
      run: jac install "google-cloud-firestore>=2.21.0,<3.0.0" "google-cloud-storage>=2.19.0,<3.0.0" "firebase-admin>=6.0.0,<8.0.0" --global

    - name: Run Firebase storage / Firestore / Auth SSO tests
      if: matrix.group == 'data'
      # Serial: these tests share one shelf_db_path SQLite file.
      env:
        JAC_TEST_JOBS: "0"
      run: |
        jac test jac/jaclang/scale/tests/test_gcs_storage.jac -x
        jac test jac/jaclang/scale/tests/test_firestore_db.jac -x
        jac test jac/jaclang/scale/tests/test_firebase_auth_sso.jac -x

  # One job, not a two-leg matrix: the deploy-core and failure-path phases
  # partition a single test file and share one MicroK8s cluster (exactly how
  # the suite runs locally), so the cluster + deps setup is paid once.
  test-scale-k8s:
    needs: [ci-router, build-jac]
    if: >-
      (github.event_name != 'pull_request' ||
       needs.ci-router.outputs.full_ci == 'true' ||
       needs.ci-router.outputs.run_test_scale_k8s == 'true') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-k8s')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/use-jac-binary
        with:
          with-typeshed: "false"
          binary-path: jac/zig-out/bin
      # use-jac-binary already appends jac/zig-out/bin to GITHUB_PATH via its
      # default add-to-path=true; no separate PATH step is needed.

      - name: Install scale deploy deps
        # Pins mirror jac/jaclang/project/capabilities.jac.
        run: |
          jac install \
            "fastapi>=0.121.3,<0.122.0" "uvicorn[standard]>=0.38.0,<0.39.0" \
            "pyjwt>=2.10.1,<2.11.0" "fastapi-sso>=0.21.0,<1.0.0" \
            "python-multipart>=0.0.21,<1.0.0" "bcrypt>=4.0.0,<5.0.0" \
            "aiohttp>=3.9.0,<4.0.0" "sqlalchemy>=2.0.0,<3.0.0" \
            "email-validator>=2.3.0,<3.0.0" "python-dotenv>=1.2.1,<2.0.0" \
            "pymongo>=4.15.4,<5.0.0" "redis>=7.1.0,<8.0.0" \
            "kubernetes>=34.1.0,<35.0.0" "docker>=7.1.0,<8.0.0" \
            --global

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # MicroK8s (not kind): hostpath-storage binds the ReadWriteMany bundle PVC.
      - name: Set up MicroK8s (RWX-capable hostpath storage)
        run: |
          set -euxo pipefail
          sudo snap install microk8s --classic --channel=1.31/stable
          sudo microk8s status --wait-ready
          sudo microk8s enable hostpath-storage dns
          sudo microk8s kubectl -n kube-system rollout status deploy/coredns --timeout=180s
          sudo microk8s kubectl -n kube-system rollout status deploy/hostpath-provisioner --timeout=180s || true
          mkdir -p "$HOME/.kube"
          sudo microk8s config > "$HOME/.kube/config"
          sudo chown "$(id -u):$(id -g)" "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl get storageclass
          kubectl get nodes -o wide

      - name: Run K8 tests (deploy-core)
        env:
          JAC_TEST_JOBS: "0"
        run: |
          jac test jac/jaclang/scale/tests/test_pod_env.jac -x
          jac test jac/jaclang/scale/tests/test_k8s_utils.jac -x
          jac test jac/jaclang/scale/tests/test_deploy_k8s.jac -x -f "not (early and exit)"

      - name: Run K8 tests (failure-path)
        env:
          JAC_TEST_JOBS: "0"
          # Seal + ship the jac built from this checkout (channel LOCAL) so the
          # deploy uses the PR binary instead of downloading a stable release
          # (no published asset for this arch on CI).
          JAC_SCALE_BINARY_PATH: ${{ github.workspace }}/jac/zig-out/bin/jac
        run: |
          jac test jac/jaclang/scale/tests/test_deploy_k8s.jac -x --test_name "early exit"

  test-precompile:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_precompile == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/use-jac-binary
      - name: Precompile all packages
        run: jac run jac/jaclang/utils/precompile_bytecode.jac ./jac
      - name: Verify cold start with precompiled bytecode
        run: |
          jac purge
          timeout 5 jac --version

  test-integration-scripts:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_integration_scripts == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/use-jac-binary
        with:
          with-typeshed: "false"
      - name: Verify bundled guides print from the built wheel
        run: bash scripts/check-guide.sh jac
      - name: Install scale serve deps (for the integration admin-server test)
        run: |
          jac install \
            "fastapi>=0.121.3,<0.122.0" "uvicorn[standard]>=0.38.0,<0.39.0" \
            "pyjwt>=2.10.1,<2.11.0" "fastapi-sso>=0.21.0,<1.0.0" \
            "python-multipart>=0.0.21,<1.0.0" "bcrypt>=4.0.0,<5.0.0" \
            "aiohttp>=3.9.0,<4.0.0" "sqlalchemy>=2.0.0,<3.0.0" \
            "email-validator>=2.3.0,<3.0.0" "python-dotenv>=1.2.1,<2.0.0" \
            "requests>=2.32.0,<3.0.0" \
            --global
      - name: Run integration tests
        run: jac run scripts/integration_tests.jac

  test-built-byllm:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_built_byllm == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/use-jac-binary
        with:
          with-typeshed: "false"
      - name: Install byllm deps (for the built-package byllm test)
        run: |
          jac install \
            "litellm>=1.70.0,<=1.82.6" "pillow>=12.0.0,<13.0.0" \
            "httpx>=0.27.0" "loguru>=0.7.2,<0.8.0" \
            --global
      - name: Run tests on built packages
        run: |
          jac check jac/tests/compiler/passes/main/fixtures/checker/checker_type_ref.jac
          JAC_TEST_JOBS=0 jac test jac/jaclang/byllm/tests/test_byllm.jac

  test-jac-site-smoke:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_jac_site_smoke == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/use-jac-binary
        with:
          with-typeshed: "false"
      # JAC_NO_DEV_SOURCE=1 on every jac_site step: the site's jac.toml carries a
      # [dev] jaclang_source stanza for its own contributors, and this smoke must
      # exercise the payload binary built by THIS job, never a checkout compiler.
      - name: Clone jac_site
        env:
          JAC_NO_DEV_SOURCE: 1
        run: |
          git clone --depth 1 https://github.com/jaseci-labs/jac_site jac_site
          cd jac_site && jac install
      - name: Type check jac_site
        working-directory: jac_site
        env:
          JAC_NO_DEV_SOURCE: 1
        run: jac check main.jac
      - name: Start jac_site server in background
        working-directory: jac_site
        env:
          JAC_NO_DEV_SOURCE: 1
        run: |
          timeout 600 jac start main.jac > /tmp/jac-site-server.log 2>&1 &
          SERVER_PID=$!
          echo "JAC_SITE_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "jac_site server starting with PID $SERVER_PID..."
          sleep 10
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server process died during startup"
            cat /tmp/jac-site-server.log
            exit 1
          fi
      - name: Wait for jac_site server to be ready
        run: |
          for i in $(seq 1 24); do
            kill -0 ${{ env.JAC_SITE_PID }} 2>/dev/null || { cat /tmp/jac-site-server.log; exit 1; }
            curl -sf --max-time 10 http://localhost:8000 -o /dev/null && exit 0
            sleep 15
          done
          tail -100 /tmp/jac-site-server.log
          exit 1
      - name: Verify jac_site HTTP response
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://localhost:8000)
          test "$HTTP_CODE" -ge 200 && test "$HTTP_CODE" -lt 500
      - name: Stop jac_site server
        if: always()
        run: kill ${{ env.JAC_SITE_PID }} 2>/dev/null || true
      - name: Upload jac_site server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jac-site-test-logs
          path: /tmp/jac-site-server.log
          retention-days: 7

  test-fullstack-eject-smoke:
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'pull_request' ||
      needs.ci-router.outputs.full_ci == 'true' ||
      needs.ci-router.outputs.run_test_fullstack_eject_smoke == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v3
        with:
          python-version: 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/use-jac-binary
        with:
          with-typeshed: "false"
      - name: Create fullstack project and eject it
        run: |
          jac create --use web-app fs-smoke
          cd fs-smoke && jac build --as source --no_typecheck
      - name: Install ejected backend and start it
        working-directory: fs-smoke/ejected/backend
        run: |
          pip install -r requirements.txt
          PORT=8000 timeout 600 python main.py > /tmp/fullstack-ejected.log 2>&1 &
          EJECTED_PID=$!
          echo "EJECTED_PID=$EJECTED_PID" >> $GITHUB_ENV
          sleep 5
          kill -0 $EJECTED_PID
      - name: Verify ejected fullstack backend responds
        run: |
          for i in $(seq 1 12); do
            kill -0 ${{ env.EJECTED_PID }} 2>/dev/null || { tail -100 /tmp/fullstack-ejected.log; exit 1; }
            curl -sf --max-time 5 http://localhost:8000/__health -o /dev/null && exit 0
            sleep 5
          done
          tail -100 /tmp/fullstack-ejected.log
          exit 1
      - name: Stop ejected fullstack server
        if: always()
        run: kill ${{ env.EJECTED_PID }} 2>/dev/null || true
      - name: Upload fullstack ejected backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-ejected-logs
          path: /tmp/fullstack-ejected.log
          retention-days: 7

  # Real-app microservice e2e on kind (not microk8s) so it runs on the fast blacksmith runner, whose minimal kernel lacks the ipset modules microk8s' calico needs. PR-only on core changes; not a required check.
  # Two pod-base legs: `slim` = the plain python default; `official-image` =
  # an image built from THIS PR's binary via docker/jaclang.Dockerfile, which
  # exercises the baked-runtime path (container-local cache site, checksum
  # binary reuse) that only exists on jaseci/jaclang bases.
  k8s-real-e2e:
    name: microservice e2e (k8s, ${{ matrix.base }})
    needs: [ci-router, build-jac]
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       needs.ci-router.outputs.full_ci == 'true' ||
       needs.ci-router.outputs.run_k8s_real_e2e == 'true') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-k8s')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        base: [slim, official-image]
    env:
      # Ship the jac binary built from THIS PR (the build-jac artifact) to the
      # pods via channel LOCAL, so the e2e validates the code under test rather
      # than a published release. JAC_SCALE_BINARY_PATH is set once the artifact
      # is on disk (below); the deploy driver reads it as the pod binary.
      JAC_SCALE_BINARY_PATH: ${{ github.workspace }}/jac/zig-out/bin/jac
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/use-jac-binary
        with:
          with-typeshed: "false"
          binary-path: jac/zig-out/bin
          add-to-path: "false"

      - name: Install the PR jac binary as the deploy driver
        run: |
          chmod +x "$JAC_SCALE_BINARY_PATH"
          mkdir -p "$HOME/.local/bin"
          cp "$JAC_SCALE_BINARY_PATH" "$HOME/.local/bin/jac"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jac" --version

      - name: Install scale deploy deps
        # Pins mirror jac/jaclang/project/capabilities.jac.
        run: |
          jac install \
            "fastapi>=0.121.3,<0.122.0" "uvicorn[standard]>=0.38.0,<0.39.0" \
            "pyjwt>=2.10.1,<2.11.0" "fastapi-sso>=0.21.0,<1.0.0" \
            "python-multipart>=0.0.21,<1.0.0" "bcrypt>=4.0.0,<5.0.0" \
            "aiohttp>=3.9.0,<4.0.0" "sqlalchemy>=2.0.0,<3.0.0" \
            "email-validator>=2.3.0,<3.0.0" "python-dotenv>=1.2.1,<2.0.0" \
            "pymongo>=4.15.4,<5.0.0" "redis>=7.1.0,<8.0.0" \
            "kubernetes>=34.1.0,<35.0.0" "docker>=7.1.0,<8.0.0" "humanize>=4.0.0" \
            --global

      - name: Set up kind cluster
        # Single node labelled ingress-ready + host 80/443 mapped so ingress-nginx's kind provider can bind them.
        run: |
          # Fetch kind + kubectl and verify their published SHA256 before installing with sudo.
          curl -fsSL -o ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          curl -fsSL -o ./kind.sha256 https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64.sha256sum
          echo "$(cut -d' ' -f1 ./kind.sha256)  ./kind" | sha256sum -c -
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -fsSL -o kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
          curl -fsSL -o kubectl.sha256 https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          sudo install kubectl /usr/local/bin/kubectl
          cat > /tmp/kind.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - { containerPort: 80, hostPort: 80, protocol: TCP }
                - { containerPort: 443, hostPort: 443, protocol: TCP }
          EOF
          kind create cluster --name jac --config /tmp/kind.yaml --wait 150s
          kubectl get nodes -o wide

      - name: Verify pod DNS + egress (fail fast)
        run: |
          # kind can report the control plane ready before kube-dns accepts traffic.
          kubectl -n kube-system rollout status deploy/coredns --timeout=180s
          for attempt in 1 2 3; do
            kubectl delete pod netcheck --ignore-not-found --wait=true
            kubectl run netcheck --image=busybox:1.36 --restart=Never --command -- \
              sh -c 'nslookup deb.debian.org && wget -q --spider http://deb.debian.org/ && echo NETCHECK_OK'
            if kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/netcheck --timeout=60s; then
              kubectl logs netcheck
              kubectl delete pod netcheck --ignore-not-found
              exit 0
            fi
            kubectl logs netcheck || true
            echo "WARN: netcheck attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo "::error::Pod networking/egress is broken on this runner (DNS or CNI), so no app pod can bootstrap."
          kubectl describe pod netcheck || true
          kubectl get pods -n kube-system -o wide || true
          kubectl delete pod netcheck --ignore-not-found
          exit 1

      - name: Deploy ingress-nginx + metrics-server (kind, best-effort)
        continue-on-error: true
        run: |
          # ingress-nginx kind provider binds hostPort 80/443, exposed at 127.0.0.1 for the e2e's ingress probe.
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.5/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
              --selector=app.kubernetes.io/component=controller --timeout=180s \
              || echo "WARN: ingress controller not ready; ingress path will skip"
          # metrics-server for HPA; kind's kubelet serves a self-signed cert.
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]' \
            || echo "WARN: metrics-server patch failed"

      - name: Show cluster info
        run: |
          kubectl version
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -A

      - name: Build the official base image from this PR's binary (official-image leg)
        if: matrix.base == 'official-image'
        run: |
          mkdir -p /tmp/imgctx/amd64
          cp "$JAC_SCALE_BINARY_PATH" /tmp/imgctx/amd64/jac
          docker build --build-arg TARGETARCH=amd64 \
              -f docker/jaclang.Dockerfile -t jaclang-e2e:pr /tmp/imgctx
          kind load docker-image jaclang-e2e:pr --name jac
          echo "E2E_POD_BASE_IMAGE=jaclang-e2e:pr" >> "$GITHUB_ENV"

      - name: Run K8s microservice real-app e2e
        env:
          CLUSTER_TYPE: kind
        run: |
          bash jac/jaclang/scale/scripts/k8s_microservice_real_e2e.sh \
              jac/jaclang/scale/tests/fixtures/k8s_e2e

      # Same cluster, separate namespace: deploy examples/sdk-deploy through
      # the programmatic SDK (ScaleClient) instead of the target-level path
      # above. official-image leg only - its baked runtime keeps the extra
      # boot inside the job timeout, and the SDK path is base-image agnostic.
      - name: Run SDK programmatic deploy e2e (ScaleClient)
        if: matrix.base == 'official-image'
        env:
          CLUSTER_TYPE: kind
        run: bash jac/jaclang/scale/tests/deploy/sdk_deploy_real_e2e.sh

      - name: Dump kubectl state on failure
        if: failure()
        env:
          NS: jac-e2e
        run: |
          echo "=== nodes ==="; kubectl get nodes -o wide || true
          echo "=== all pods (every namespace) ==="; kubectl get pods -A -o wide || true
          echo "=== events (${NS}, time-sorted) ==="
          kubectl get events -n "${NS}" --sort-by='.lastTimestamp' || true
          echo "=== per-pod status + all container logs (${NS}) ==="
          for pod in $(kubectl get pods -n "${NS}" -o name 2>/dev/null); do
            echo "############################## ${pod} ##############################"
            echo "----- phase + container readiness -----"
            kubectl get -n "${NS}" "${pod}" -o jsonpath='phase={.status.phase}{"\n"}{range .status.initContainerStatuses[*]}init/{.name}: ready={.ready} restarts={.restartCount} state={.state}{"\n"}{end}{range .status.containerStatuses[*]}main/{.name}: ready={.ready} restarts={.restartCount} state={.state}{"\n"}{end}' 2>/dev/null || true
            echo ""
            echo "----- describe (Init Containers -> Events) -----"
            kubectl describe -n "${NS}" "${pod}" 2>/dev/null | sed -n '/Init Containers:/,/^[^ ]/p;/Events:/,$p' || true
            for c in $(kubectl get -n "${NS}" "${pod}" -o jsonpath='{range .spec.initContainers[*]}{.name}{"\n"}{end}{range .spec.containers[*]}{.name}{"\n"}{end}' 2>/dev/null); do
              echo "----- logs ${pod} [${c}] (tail 120) -----"
              kubectl logs -n "${NS}" "${pod}" -c "${c}" --tail=120 2>&1 | tail -120 || true
              kubectl logs -n "${NS}" "${pod}" -c "${c}" --previous --tail=60 2>/dev/null | tail -60 || true
            done
          done
          echo "=== ingress status ==="; kubectl describe ingress -n "${NS}" || true
          echo "=== ingress controller logs ==="
          kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=50 || true

  installer-test:
    needs: ci-router
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       needs.ci-router.outputs.run_installer_test == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-14
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh

      # A missing asset on the latest release is a release regression that
      # breaks `curl ... | bash` -- fail loudly instead of skipping.
      - name: Require a native binary asset on the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' 2>/dev/null \
               | grep -q "jac-.*-${{ matrix.platform }}$"; then
            echo "::error::Latest GitHub Release has no jac-*-${{ matrix.platform }} asset; 'curl ... | bash' is broken for this platform."
            exit 1
          fi

      - name: "install: download + run the binary"
        env:
          # install.sh authenticates its GitHub API calls when a token is set;
          # shared runners (macOS especially) exhaust the unauthenticated
          # per-IP rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install.sh

      - name: "install: verify jac"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          which jac
          jac --version

      - name: "install: run a test program"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo 'with entry { print("hello from the jac binary"); }' > /tmp/test_install.jac
          jac /tmp/test_install.jac

      - name: "install: uninstall"
        run: bash scripts/install.sh --uninstall

      - name: "install: verify removal"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if command -v jac &>/dev/null; then
            echo "FAIL: jac still found after uninstall"
            exit 1
          fi
          echo "PASS: jac removed"

  # Aggregate gate: fails on failure/cancelled AND on unexpected skips when the
  # router selected a job (or full_ci / merge_group / schedule forced all jobs).
  everything-passed:
    name: Everything Passed
    if: always()
    needs:
      - ci-router
      - coverage-audit
      - build-jac
      - test-compiler-root
      - test-compiler-passes-main
      - test-compiler-passes-ecmascript
      - test-compiler-passes-native
      - test-compiler-passes-tool
      - test-compiler-equivalence
      - test-runtime-core
      - test-runtime-cli-language
      - test-runtime-project-publish-utils-langserve
      - jac-check
      - contribution-checks
      - test-solid-and-desktop
      - test-client
      - test-byllm
      - test-docs
      - test-native-macos
      - test-native-aarch64
      - test-launcher
      - test-cef-build
      - test-scale
      - test-scale-k8s
      - test-precompile
      - test-integration-scripts
      - test-built-byllm
      - test-jac-site-smoke
      - test-fullstack-eject-smoke
      - k8s-real-e2e
      - installer-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fail on upstream failure or cancellation
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "::error::One or more CI jobs failed or were cancelled; blocking merge."
          echo "$RESULTS"
          exit 1

      - name: Reject unexpected skips for selected jobs
        env:
          FULL_CI: ${{ needs.ci-router.outputs.full_ci }}
          SELECTED: ${{ needs.ci-router.outputs.selected_jobs }}
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          MODE=pr
          if [ "$FULL_CI" = "true" ]; then MODE=full; fi
          printf '%s' "$SELECTED" > /tmp/selected.json
          printf '%s' "$NEEDS" > /tmp/needs.json
          scripts/ci/validate-expected-jobs.sh /tmp/selected.json /tmp/needs.json "$MODE" "$EVENT" "$LABELS"

      - name: All required jobs passed
        run: echo "Everything passed. ✅"
