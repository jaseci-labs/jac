name: CI

# One lane: build the sealed jac binary once per platform (build-kit), publish
# it plus its gitignored runtime pieces as a single "kit" artifact, and run
# every test job against that kit. No dev-lane reroute, no per-job vendoring,
# no cross-job cache choreography. Deep/exotic sweeps live in nightly.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Test the SHIPPED binary, never a checkout reroute (one step opts back in).
env:
  JAC_NO_DEV_SOURCE: "1"

jobs:
  # Path filter used ONLY to skip jobs on PRs; push/dispatch runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      scale: ${{ steps.filter.outputs.scale }}
      byllm: ${{ steps.filter.outputs.byllm }}
      docs: ${{ steps.filter.outputs.docs }}
      desktop: ${{ steps.filter.outputs.desktop }}
      installer: ${{ steps.filter.outputs.installer }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'jac/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            scale:
              - 'jac/jaclang/scale/**'
            byllm:
              - 'jac/jaclang/byllm/**'
            docs:
              - 'jac/jaclang/cli/docs/**'
              - 'jac/jaclang/cli/skills/**'
              - 'release_notes/**'
            desktop:
              - 'jac/jaclang/runtimelib/client/targets/desktop/**'
            installer:
              - 'scripts/install.sh'
              # The lane's own definition lives here, so a change to what it
              # runs must run it -- same reasoning as `native` listing ci.yml.
              # Without this an edit to the installer test ships unexercised.
              - '.github/workflows/_installer.yml'
            # Narrowing filter: the macOS and aarch64 lanes only run when a
            # path that can move them changes (or on push/dispatch).
            native:
              - 'jac/jaclang/compiler/passes/native/**'
              - 'jac/tests/compiler/passes/native/**'
              - 'jac/jaclang/compiler/tests/test_prim_equivalence.jac'
              - 'jac/jaclang/compiler/tests/fixtures/prim_*.jac'
              - 'jac/native/**'
              - 'jac/build.zig'
              - 'jac/build.zig.zon'
              - '.github/workflows/ci.yml'

  # Build the sealed binary once, smoke it, vendor the deterministic runtime
  # trees, and publish everything test jobs need as one artifact.
  build-kit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - name: Build the jac binary (cached)
        uses: ./.github/actions/setup-jac

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      # Explicit: a binary-cache hit skips zig build, so these gitignored
      # trees must be materialized either way. -Dno-ninja skips the editor
      # closure nothing here needs. The wasm floor is in this list for the
      # same reason as the rest: a full build writes it as a side effect, a
      # cache hit does not, so leaving it implicit made the kit's contents a
      # function of cache state -- present on a miss, missing on a hit, with
      # if-no-files-found blind to it because the other paths matched.
      - name: Materialize typeshed + vendored runtimes
        working-directory: jac
        run: |
          zig build -Dno-ninja fetch-typeshed --summary all
          zig build -Dno-ninja vendor-musl --summary all
          zig build -Dno-ninja vendor-musl-linux-aarch64 --summary all
          zig build -Dno-ninja vendor-wasm-libc --summary all

      - name: Hermeticity + smoke (no system Python)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          ldd "$BIN" || true
          ! ldd "$BIN" | grep -qi python
          WORK="$(mktemp -d)"
          printf 'obj P { has x:int=0; def sq->int { return self.x*self.x; } }\nwith entry { print(P(x=7).sq()); }\n' > "$WORK/obj.jac"
          env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_NO_DEV_SOURCE=1 "$BIN" --version
          out="$(env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_NO_DEV_SOURCE=1 "$BIN" run "$WORK/obj.jac")"
          echo "$out" | grep -q 49

      - name: Run real jac programs (end-to-end execution)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          WORK="$(mktemp -d)"; cd "$WORK"
          cat > a.jac <<'JAC'
          obj Point { has x: int; has y: int; def dist -> float { return (self.x*self.x + self.y*self.y) ** 0.5; } }
          with entry {
              p = Point(x=3, y=4);
              print("dist", p.dist());
              print([i*i for i in range(5)]);
          }
          JAC
          out="$(env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_NO_DEV_SOURCE=1 "$BIN" run "$WORK/a.jac")"
          echo "$out" | grep -q "dist 5.0"
          echo "$out" | grep -q "0, 1, 4, 9, 16"

      - name: jac test runner (self-contained test file)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          WORK="$(mktemp -d)"
          cat > "$WORK/test_smoke.jac" <<'JAC'
          test "arithmetic" { assert 6 * 7 == 42; }
          test "comprehension" { assert [i for i in range(3)] == [0, 1, 2]; }
          test "strings" { assert "ja" + "c" == "jac"; }
          JAC
          env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_TEST_JOBS=0 JAC_NO_DEV_SOURCE=1 "$BIN" test "$WORK/test_smoke.jac"

      # if-no-files-found only fires when NO path matches, so a single missing
      # tree ships a quietly incomplete kit to every consumer. Assert each one.
      - name: Verify the kit is complete
        working-directory: jac
        run: |
          set -euo pipefail
          for p in zig-out/bin/jac jaclang/vendor/typeshed/stdlib \
                   .pbs-build/linux-x86_64/musl/lib \
                   .pbs-build/linux-aarch64/musl/lib \
                   .pbs-build/wasm32/libc; do
            [ -e "$p" ] || { echo "::error::kit is missing $p"; exit 1; }
          done

      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: jac-kit
          path: |
            jac/zig-out/bin/jac
            jac/jaclang/vendor/typeshed/stdlib
            jac/.pbs-build/linux-x86_64/musl/lib
            jac/.pbs-build/linux-aarch64/musl/lib
            jac/.pbs-build/wasm32/libc
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  build-kit-macos:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the jac binary (cached)
        uses: ./.github/actions/setup-jac

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Materialize typeshed + wasm libc floor
        working-directory: jac
        run: |
          zig build -Dno-ninja fetch-typeshed --summary all
          zig build -Dno-ninja vendor-wasm-libc --summary all

      - name: Verify the kit is complete
        working-directory: jac
        run: |
          set -euo pipefail
          for p in zig-out/bin/jac jaclang/vendor/typeshed/stdlib \
                   .pbs-build/wasm32/libc; do
            [ -e "$p" ] || { echo "::error::kit is missing $p"; exit 1; }
          done

      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: jac-kit-macos
          path: |
            jac/zig-out/bin/jac
            jac/jaclang/vendor/typeshed/stdlib
            jac/.pbs-build/wasm32/libc
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  jac-check:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      # On PRs, scope fmt/check to .jac files changed vs the merge-base.
      - name: Determine changed .jac files
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --quiet origin "${{ github.base_ref }}"
          BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.jac' > changed-jac.txt || true
          echo "mode=scoped" >> "$GITHUB_OUTPUT"
          if [ -s changed-jac.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          cat changed-jac.txt || true

      - uses: ./.github/actions/jac-kit

      - name: Install plugin deps so jac check resolves scale/byllm imports
        # Pins mirror jac/jaclang/project/capabilities.jac.
        run: |
          jac install \
            "python-dotenv>=1.2.1,<2.0.0" \
            "prometheus-client>=0.21.0,<1.0.0" \
            "opentelemetry-sdk>=1.27.0,<2.0.0" \
            "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0" \
            "apscheduler>=3.11.2,<4.0.0" "kubernetes>=34.1.0,<35.0.0" \
            "docker>=7.1.0,<8.0.0" "boto3>=1.40.0,<2.0.0" \
            "google-cloud-firestore>=2.21.0,<3.0.0" "google-cloud-storage>=2.19.0,<3.0.0" \
            "firebase-admin>=6.0.0,<8.0.0" "requests>=2.32.0,<3.0.0" \
            --global
          jac install \
            "litellm>=1.70.0,<=1.82.6" "pillow>=12.0.0,<13.0.0" \
            "httpx>=0.27.0" "loguru>=0.7.2,<0.8.0" \
            --global

      - name: Run jac fmt (check formatting)
        id: fmt
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.mode }}" = "scoped" ]; then
            if [ "${{ steps.changes.outputs.any }}" != "true" ]; then
              echo "No .jac files changed in this PR; skipping format check."
              exit 0
            fi
            FILES="$(grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$|/manifest\.impl\.jac$)' changed-jac.txt || true)"
            if [ -z "$FILES" ]; then
              echo "No formattable .jac files changed (all excluded); skipping."
              exit 0
            fi
            printf '%s\n' "$FILES" | tr '\n' '\0' \
              | xargs -0 --no-run-if-empty jac fmt --check --lintfix
          else
            git ls-files -z '*.jac' | grep -zv -E '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$|_syntax_err\.jac$|/manifest\.impl\.jac$)' | xargs -0 --no-run-if-empty jac fmt --check --lintfix
          fi

      # Autofix push mirrors pre-commit.ci. Without a JAC_AUTOFIX_TOKEN secret
      # the pushed commit does not retrigger CI (GitHub loop protection).
      - name: Push jac fmt autofix to the PR branch
        if: |
          steps.fmt.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTOFIX_TOKEN: ${{ secrets.JAC_AUTOFIX_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$HEAD_REF"
          if git log -1 --format=%s FETCH_HEAD | grep -q '^style: jac fmt autofix'; then
            echo "::warning::Head commit is already an autofix commit but the check still failed; not pushing again."
            exit 0
          fi
          git checkout -B "$HEAD_REF" FETCH_HEAD
          FILES="$(grep -vE '(/fixtures/|^scripts/|/passes/native/llvm/|_err\.jac$|/manifest\.impl\.jac$)' changed-jac.txt || true)"
          if [ -z "$FILES" ]; then
            echo "No formattable .jac files to fix."
            exit 0
          fi
          printf '%s\n' "$FILES" | tr '\n' '\0' \
            | xargs -0 --no-run-if-empty jac fmt --lintfix || true
          if git diff --quiet; then
            echo "Fixer produced no changes on the head branch; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: jac fmt autofix"
          if [ -n "$AUTOFIX_TOKEN" ]; then
            git remote set-url origin \
              "https://x-access-token:${AUTOFIX_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git push origin "HEAD:$HEAD_REF"
          echo "::notice::Pushed jac fmt autofix to $HEAD_REF; the new commit's CI run supersedes this one."

      - name: Fail if formatting was not clean
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::jac fmt --check --lintfix failed for this commit (an autofix was pushed to the branch if this is a same-repo PR)."
          exit 1

      - name: Verify manifest route table is up to date
        run: jac gen-cli-manifest --verify

      - name: Run CLI startup regression tests
        env:
          JAC_TEST_JOBS: "0"
        run: |
          jac test \
            jac/tests/cli/test_command_isolation.jac \
            jac/tests/cli/test_config_key_bridge.jac \
            jac/tests/cli/test_manifest_parity.jac \
            jac/tests/cli/test_startup_isolation.jac

      - name: Run jac check (using .jacignore)
        run: |
          set -euo pipefail
          IGNORE_ARGS="tests checker_*.jac *_err.jac $(grep -v '^#' .jacignore | grep -v '^[[:space:]]*$' | tr '\n' ' ')"
          if [ "${{ steps.changes.outputs.mode }}" = "scoped" ]; then
            if [ "${{ steps.changes.outputs.any }}" != "true" ]; then
              echo "No .jac files changed in this PR; skipping jac check."
              exit 0
            fi
            jac check $(cat changed-jac.txt) --ignore $IGNORE_ARGS --nowarn
          else
            jac check . --ignore $IGNORE_ARGS --nowarn
          fi

      - name: Error-code breakdown (label "type-error-report")
        if: contains(github.event.pull_request.labels.*.name, 'type-error-report')
        run: |
          set +e
          jac check . --nowarn > jac-check-full.log 2>&1
          {
            echo "## jac check error-code breakdown (whole codebase, no ignores)"
            echo ""
            echo "| Error code | Count |"
            echo "| --- | ---: |"
            grep -oE 'error\[E[0-9]+\]' jac-check-full.log \
              | grep -oE 'E[0-9]+' \
              | sort | uniq -c | sort -rn \
              | awk '{ printf "| %s | %d |\n", $2, $1; total += $1 }
                     END { printf "| **TOTAL** | **%d** |\n", total }'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  contribution-checks:
    name: Contribution Checks
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'push' || needs.changes.outputs.docs == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Block AI co-author attribution
        if: github.event_name == 'pull_request'
        run: |
          if git log origin/${{ github.base_ref }}..HEAD --format='%b' \
            | grep -iP 'co-authored-by:.*\b(claude|anthropic|openai|copilot|composer|cursor|gpt|gemini|ai|bot)\b'; then
            echo "::error::AI co-author attribution found in commit messages. Please remove Co-Authored-By lines referencing AI tools."
            exit 1
          fi

      - name: Block Python files
        if: |
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-no-python-check')
        run: |
          if git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD \
            | grep -P '\.py$'; then
            echo "::error::New Python (.py) files detected in this PR. This codebase does not allow adding Python files."
            echo "To skip this check, add the 'skip-no-python-check' label to your PR."
            exit 1
          fi

      - name: Check bun version lockstep
        run: |
          jac_ver=$(grep -oE 'glob BUN_VERSION = "[^"]+"' jac/jaclang/runtimelib/client/bun_installer.jac | grep -oE '"[^"]+"' | tr -d '"')
          zig_ver=$(grep -oE 'const BUN_VERSION = "[^"]+"' jac/launcher/payload.zig | grep -oE '"[^"]+"' | tr -d '"')
          echo "jaclang BUN_VERSION='$jac_ver'  payload.zig BUN_VERSION='$zig_ver'"
          if [ -z "$jac_ver" ] || [ -z "$zig_ver" ]; then
            echo "::error::Could not read BUN_VERSION from both bun_installer.jac and payload.zig"
            exit 1
          fi
          if [ "$jac_ver" != "$zig_ver" ]; then
            echo "::error::BUN_VERSION mismatch: bun_installer.jac=$jac_ver vs payload.zig=$zig_ver. The Jac resolver/deploy pin and the Zig fetcher must stay in lockstep."
            exit 1
          fi

      - uses: ./.github/actions/jac-kit

      - name: Validate Jac code blocks in the docs corpus
        run: jac run scripts/validate_docs_code.jac

      - name: Check Release Notes Updated
        if: |
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-release-notes-check')
        env:
          CI: "true"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/check-release-notes.sh

  # Compiler suite, one chunk per runner. Chunking is load-bearing: the
  # materializer crossing leaks its native parse tree per compile, so one long
  # run OOMs; fresh runners bound the accumulation and parallelize the suite.
  test-compiler:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - chunk: passes-native
            paths: tests/compiler/passes/native tests/compiler/passes/tool
            sealed: "1"
          - chunk: passes-main
            paths: tests/compiler/passes/main tests/compiler/passes/ecmascript
            sealed: "1"
          - chunk: toplevel
            paths: tests/compiler/test_*.jac
            sealed: "1"
          # The equivalence suite builds fixture paths from jaclang.__file__,
          # which only resolve in the checkout: run it through the checkout
          # reroute (sealed: "" clears JAC_NO_DEV_SOURCE).
          - chunk: equivalence
            paths: jaclang/compiler/tests
            sealed: ""
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/jac-kit
      - name: Set up Node.js (ES backend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ${{ matrix.chunk }} chunk
        working-directory: jac
        env:
          JAC_NO_DEV_SOURCE: ${{ matrix.sealed }}
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          HOME="$WORK" JAC_TEST_JOBS=auto jac test ${{ matrix.paths }}

  # Everything except the compiler tests.
  test-runtime:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/jac-kit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Runtime suite via the binary
        working-directory: jac
        run: |
          set -uxo pipefail
          WORK="$(mktemp -d)"
          HOME="$WORK" JAC_TEST_JOBS=auto jac test tests/ --ignore tests/compiler

  # Degradation path: no LLVM shim, no binary -- programs must still compile
  # cleanly in the server codespace with zero scheduling errors.
  test-no-llvm:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Cold-clone compile (no shim, no typeshed stubs)
        working-directory: jac
        run: |
          set -euxo pipefail
          test ! -e jaclang/compiler/passes/native/llvm/libjacllvm.so
          test ! -e jaclang/vendor/typeshed/stdlib
          WORK="$(mktemp -d)"
          printf 'def add(a: int, b: int) -> int {\n    return a + b;\n}\n\nwith entry {\n    print(add(40, 2));\n}\n' > "$WORK/prog.jac"
          out="$(HOME="$WORK" XDG_CACHE_HOME="$WORK/cache" PYTHONPATH="$PWD" python -m jaclang run "$WORK/prog.jac" 2>&1)" || { echo "$out"; exit 1; }
          echo "$out" | tail -5
          echo "$out" | grep -qx '42'
          ! echo "$out" | grep -q 'scheduling error'
          ! echo "$out" | grep -q 'preferred native but did not lower'
      # The kit brings typeshed (and the binary, unused here); shim still absent.
      - uses: ./.github/actions/jac-kit
      - name: No-LLVM compile (typeshed present, shim absent)
        working-directory: jac
        run: |
          set -euxo pipefail
          test ! -e jaclang/compiler/passes/native/llvm/libjacllvm.so
          WORK="$(mktemp -d)"
          printf 'def mul(a: int, b: int) -> int {\n    return a * b;\n}\n\nwith entry {\n    print(mul(6, 7));\n}\n' > "$WORK/prog.jac"
          out="$(HOME="$WORK" XDG_CACHE_HOME="$WORK/cache" PYTHONPATH="$PWD" python -m jaclang run "$WORK/prog.jac" 2>&1)" || { echo "$out"; exit 1; }
          echo "$out" | tail -5
          echo "$out" | grep -qx '42'
          ! echo "$out" | grep -q 'scheduling error'
          ! echo "$out" | grep -q 'preferred native but did not lower'

  test-client:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/jac-kit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Run all client tests
        # Serial: parallel workers intermittently disagreed on collection of
        # test_react_native_target.jac under the old pytest-xdist runner.
        env:
          TEST_ENV: "true"
          JAC_TEST_JOBS: "0"
        run: jac test jac/tests/runtimelib/client --ignore jac/tests/runtimelib/client/test_inprocess_dispatch.jac
      - name: Re-run in-process sv dispatch against the built-in scale backend
        run: |
          jac install "python-dotenv>=1.2.1,<2.0.0" --global
          jac test -vv jac/tests/runtimelib/client/test_inprocess_dispatch.jac

  test-solid-and-desktop:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.desktop == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/jac-kit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Run jsdom runtime tests
        # Every suite here skips itself unless JAC_CLIENT_INTEGRATION is set,
        # so this step is the ONLY place they actually execute. A jsdom suite
        # not named here is a suite that never runs.
        env:
          JAC_CLIENT_INTEGRATION: "1"
        run: |
          jac test \
            jac/tests/runtimelib/test_solid_jsdom.jac \
            jac/tests/runtimelib/test_react_state_semantics.jac \
            jac/tests/runtimelib/test_react_auth_jsdom.jac \
            -x
      - name: Run dependency-free desktop tests
        run: jac test jac/tests/runtimelib/client/test_desktop_binding.jac

  test-packages-and-docs:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.byllm == 'true' || needs.changes.outputs.docs == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/jac-kit
      - name: Install byllm deps + test deps
        run: |
          jac install \
            "litellm>=1.70.0,<=1.82.6" "pillow>=12.0.0,<13.0.0" \
            "httpx>=0.27.0" "loguru>=0.7.2,<0.8.0" \
            --global
      - name: Run package tests
        env:
          TEST_ENV: "true"
        run: jac test jac/jaclang/byllm/tests
      - name: Run docs corpus tests
        run: jac test jac/tests/cli/test_docs_content.jac jac/tests/cli/test_guide_docs.jac

  test-scale:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.scale == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        group: [server, data, microservices, deploy, misc]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      # The bundle tests read the pod binary from jac/zig-out/bin via a
      # __file__-relative lookup and silently self-skip when it is missing.
      - uses: ./.github/actions/jac-kit
      - name: Install scale deps + test deps
        # Pins mirror jac/jaclang/project/capabilities.jac.
        run: |
          jac install \
            "python-dotenv>=1.2.1,<2.0.0" \
            "prometheus-client>=0.21.0,<1.0.0" \
            "opentelemetry-sdk>=1.27.0,<2.0.0" \
            "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0" \
            "apscheduler>=3.11.2,<4.0.0" "kubernetes>=34.1.0,<35.0.0" \
            "docker>=7.1.0,<8.0.0" "boto3>=1.40.0,<2.0.0" \
            requests "moto[s3]>=5.0.0" \
            --global
      - name: Run ${{ matrix.group }} tests
        run: |
          set +e
          failed=""
          # One process per file: the suite relies on per-file isolation.
          for f in jac/jaclang/scale/tests/${{ matrix.group }}/test_*.jac; do
            echo "::group::$f"
            JAC_TEST_JOBS=0 jac test "$f" || failed="$failed $f"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed ${{ matrix.group }} test files:$failed"
            exit 1
          fi
      - name: Run root-level scale tests (identity password, firebase env)
        if: matrix.group == 'data'
        env:
          JAC_TEST_JOBS: "0"
        run: |
          jac test jac/jaclang/scale/tests/test_identity_password.jac -x
          jac test jac/jaclang/scale/tests/test_firebase_env.jac -x
      - name: Install scale firebase deps
        if: matrix.group == 'data'
        run: jac install "google-cloud-firestore>=2.21.0,<3.0.0" "google-cloud-storage>=2.19.0,<3.0.0" "firebase-admin>=6.0.0,<8.0.0" --global
      - name: Run Firebase storage / Firestore / Auth SSO tests
        if: matrix.group == 'data'
        # Serial: these tests share one shelf_db_path SQLite file.
        env:
          JAC_TEST_JOBS: "0"
        run: |
          jac test jac/jaclang/scale/tests/test_gcs_storage.jac -x
          jac test jac/jaclang/scale/tests/test_firebase_auth_sso.jac -x

  # One job: both phases share one MicroK8s cluster (hostpath-storage binds
  # the RWX bundle PVC, which kind cannot).
  test-scale-k8s:
    needs: [changes, build-kit]
    if: >-
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.core == 'true' ||
       needs.changes.outputs.scale == 'true') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-k8s')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/jac-kit
      - name: Install scale deploy deps
        run: |
          jac install \
            "python-dotenv>=1.2.1,<2.0.0" \
            "kubernetes>=34.1.0,<35.0.0" "docker>=7.1.0,<8.0.0" \
            --global
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Set up MicroK8s (RWX-capable hostpath storage)
        run: |
          set -euxo pipefail
          sudo snap install microk8s --classic --channel=1.31/stable
          sudo microk8s status --wait-ready
          sudo microk8s enable hostpath-storage dns
          sudo microk8s kubectl -n kube-system rollout status deploy/coredns --timeout=180s
          sudo microk8s kubectl -n kube-system rollout status deploy/hostpath-provisioner --timeout=180s || true
          mkdir -p "$HOME/.kube"
          sudo microk8s config > "$HOME/.kube/config"
          sudo chown "$(id -u):$(id -g)" "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl get storageclass
          kubectl get nodes -o wide
      - name: Run K8 tests (deploy-core)
        env:
          JAC_TEST_JOBS: "0"
        run: |
          jac test jac/jaclang/scale/tests/test_pod_env.jac -x
          jac test jac/jaclang/scale/tests/test_k8s_utils.jac -x
          jac test jac/jaclang/scale/tests/test_deploy_k8s.jac -x -f "not (early and exit)"
      - name: Run K8 tests (failure-path)
        env:
          JAC_TEST_JOBS: "0"
          # Ship the jac built from this checkout to the pods (channel LOCAL).
          JAC_SCALE_BINARY_PATH: ${{ github.workspace }}/jac/zig-out/bin/jac
        run: |
          jac test jac/jaclang/scale/tests/test_deploy_k8s.jac -x --test_name "early exit"

  # aarch64 cross lane: in-house ELF linker + arch-parameterized musl from the
  # kit, binaries run under qemu-user.
  test-native-aarch64:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install qemu-user and aarch64 cross libc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static libc6-arm64-cross
      - uses: ./.github/actions/jac-kit
      - name: Run aarch64 cross tests under qemu
        env:
          JAC_TEST_JOBS: "0"
          # The sealed binary bundles host-arch musl only; point the
          # static-link search at the kit's cross runtime.
          JAC_NATIVE_MUSL_DIR: ${{ github.workspace }}/jac/.pbs-build/linux-aarch64/musl/lib
        run: >-
          jac test jac/tests/compiler/passes/native/test_native_gen_pass.jac
          -f aarch64

  test-native-macos:
    needs: [changes, build-kit-macos]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/jac-kit
        with:
          name: jac-kit-macos
      - name: Run native Mach-O linker regression tests
        run: |
          jac test jac/tests/compiler/passes/native/test_shared_lib.jac
          jac test jac/tests/compiler/passes/native/test_exec_link.jac
      - name: Run na->wasm floor + import-contract tests
        run: jac test jac/tests/compiler/passes/native/test_wasm_build.jac
      - name: Run bundled-stdlib equivalence pins (darwin)
        env:
          JAC_TEST_JOBS: "0"
        # Pure-compute na modules that must agree on darwin; str/bytes guard
        # the libc-binding divergence (musl static vs libSystem).
        run: >-
          jac test jac/jaclang/compiler/tests/test_prim_equivalence.jac
          -f "shutil or path or textwrap or keyword or str or bytes"

  # Launcher unit tests: trailer codec + .jab-overlay round-trip. Zig only.
  # Cross-platform matrix on purpose: the format code has OS-divergent
  # syscall behavior.
  test-launcher:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Launcher unit tests (zig build test)
        working-directory: jac
        run: zig build -Dno-ninja test --summary all

  test-cef-build:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/jac-kit
      - name: Build dispatch shim and subprocess binary
        working-directory: jac/jaclang/runtimelib/client/targets/desktop/native/cef
        run: jac run build.jac
      - name: Verify shared-object exports
        working-directory: jac/jaclang/runtimelib/client/targets/desktop/native/cef
        run: |
          nm -D libcef_dispatch.so | grep -q cef_dispatch_startup
          nm -D libcef_dispatch.so | grep -q cef_dispatch_execute_process
          nm -D libcef_dispatch.so | grep -q cef_platform_bootstrap
      - name: Check RPATH
        working-directory: jac/jaclang/runtimelib/client/targets/desktop/native/cef
        run: |
          readelf -d libcef_dispatch.so | grep -qE '(RUN)?PATH.*\$ORIGIN'
      - name: ldd audit (no missing deps against libc + libcef stub)
        working-directory: jac/jaclang/runtimelib/client/targets/desktop/native/cef
        run: |
          MISSING=$(ldd libcef_dispatch.so 2>&1 | grep 'not found' | grep -v libcef || true)
          [ -z "$MISSING" ] || (echo "Unexpected missing deps: $MISSING" && exit 1)

  test-jac-pack-smoke:
    needs: [changes, build-kit]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.scale == 'true' || needs.changes.outputs.byllm == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/jac-kit

      # The same capacity floor build-binaries.yml gained in #8279 and
      # .github/actions/setup-jac carries for the jobs that build through it.
      # This job does not build the binary -- it takes build-kit's -- but the
      # step below runs the precompiler, and the inline seal that closes it is
      # the same one-process compile of every NATIVE_SEAL_ROOTS entry, with the
      # same stranded materializer trees: 19.3 GiB at eleven roots, 22.4 GiB at
      # thirteen, against a 16 GiB runner with a 4 GiB stock swapfile. It died
      # here exactly as it died there, as "the runner lost communication" with
      # no diagnostic. Third copy of this block (#8279, setup-jac, here);
      # folding the three into one composite action is a clean follow-up.
      # Retire it outright when the crossing reclaims its tree (#8139).
      - name: Swap headroom for the sealed precompile (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "--- before"
          free -h
          swapon --show || true
          df -h
          WORK_DEV="$(df -P "$RUNNER_TEMP" | awk 'NR==2 {print $1}')"
          MNT_DEV="$(df -P /mnt 2>/dev/null | awk 'NR==2 {print $1}' || true)"
          if [ -n "$MNT_DEV" ] && [ "$MNT_DEV" != "$WORK_DEV" ]; then
            SWAP_DIR=/mnt
            RESERVE_GB=2
          else
            SWAP_DIR="$RUNNER_TEMP"
            RESERVE_GB=25
          fi
          AVAIL_GB=$(( $(df -Pk "$SWAP_DIR" | awk 'NR==2 {print $4}') / 1048576 ))
          SIZE_GB=$(( AVAIL_GB - RESERVE_GB ))
          if [ "$SIZE_GB" -gt 24 ]; then
            SIZE_GB=24
          fi
          if [ "$SIZE_GB" -lt 4 ]; then
            echo "::error::$SWAP_DIR has ${AVAIL_GB}G free, too little to spare;" \
                 "the seal needs swap headroom at this root count and would exhaust the runner"
            exit 1
          fi
          SWAP_FILE="$SWAP_DIR/jac-seal-swap"
          sudo fallocate -l "${SIZE_GB}G" "$SWAP_FILE" \
            || sudo dd if=/dev/zero of="$SWAP_FILE" bs=1M count=$(( SIZE_GB * 1024 ))
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          echo "--- after"
          free -h
          swapon --show

      - name: Precompile all packages
        run: jac run jac/jaclang/utils/precompile_bytecode.jac ./jac

      - name: Verify cold start with precompiled bytecode
        run: |
          jac purge
          timeout 5 jac --version

      - name: Verify bundled guides print from the built wheel
        run: bash scripts/check-guide.sh jac

      - name: Install scale serve deps (for the integration admin-server test)
        run: |
          jac install \
            "python-dotenv>=1.2.1,<2.0.0" \
            "requests>=2.32.0,<3.0.0" \
            --global

      - name: Run integration tests
        run: jac run scripts/integration_tests.jac

      - name: Run tests on built packages
        run: jac check jac/tests/compiler/passes/main/fixtures/checker/checker_type_ref.jac

      # jac_site fullstack smoke: JAC_NO_DEV_SOURCE=1 on every step because the
      # site's own jac.toml carries a [dev] stanza for its contributors.
      - name: Clone jac_site
        run: |
          git clone --depth 1 https://github.com/jaseci-labs/jac_site jac_site
          cd jac_site && jac install

      - name: Type check jac_site
        working-directory: jac_site
        run: jac check main.jac

      - name: Start jac_site server in background
        working-directory: jac_site
        run: |
          timeout 600 jac start main.jac > /tmp/jac-site-server.log 2>&1 &
          SERVER_PID=$!
          echo "JAC_SITE_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "jac_site server starting with PID $SERVER_PID..."
          sleep 10
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server process died during startup"
            cat /tmp/jac-site-server.log
            exit 1
          fi

      - name: Wait for jac_site server to be ready
        run: |
          for i in $(seq 1 24); do
            if ! kill -0 ${{ env.JAC_SITE_PID }} 2>/dev/null; then
              echo "Server process exited unexpectedly"
              cat /tmp/jac-site-server.log
              exit 1
            fi
            if curl -sf --max-time 10 http://localhost:8000 -o /dev/null 2>&1; then
              echo "jac_site server is ready (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/24: not ready, waiting 15s..."
            sleep 15
          done
          echo "Server failed to respond after 24 attempts"
          tail -100 /tmp/jac-site-server.log
          exit 1

      - name: Verify jac_site HTTP response
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://localhost:8000)
          echo "jac_site root endpoint: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
            echo "jac_site server responding correctly"
          else
            echo "Unexpected HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Ensure a Chromium binary for jac browse
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "found browser: $c"
              exit 0
            fi
          done
          sudo apt-get update && sudo apt-get install -y chromium-browser

      # Drive the rendered page: assert the install one-liner and the ninja
      # book cover anchor (regex checks so copy edits don't break this).
      - name: Browse jac_site landing page (rendered client checks)
        timeout-minutes: 5
        run: |
          jac browse open http://localhost:8000
          jac browse wait '#top'
          jac browse eval '(() => {
            const text = document.body.innerText;
            if (!/curl\s+-fsSL\s+\S*install\.sh\s*\|\s*bash/.test(text)) {
              throw new Error("install curl one-liner not rendered on the landing page");
            }
            return "install curl one-liner rendered";
          })()'
          jac browse eval '(async () => {
            const section = document.querySelector("#book");
            if (!section) throw new Error("no #book section on the landing page");
            section.scrollIntoView({block: "center"});
            const img = section.querySelector("a[href] img[src*=ninja-book-cover]");
            if (!img) throw new Error("no ninja book cover image inside a link");
            const href = img.closest("a").href;
            if (!/doi\.org|zenodo/.test(href)) {
              throw new Error("book cover links to " + href + ", not the book");
            }
            const deadline = Date.now() + 15000;
            while (Date.now() < deadline) {
              const rect = img.getBoundingClientRect();
              const unobscured = img.checkVisibility
                ? img.checkVisibility({checkOpacity: true, checkVisibilityCSS: true})
                : true;
              if (img.complete && img.naturalWidth > 0
                  && rect.width > 0 && rect.height > 0 && unobscured) {
                return "book cover visible, links to " + href;
              }
              await new Promise((resolve) => setTimeout(resolve, 200));
            }
            throw new Error("book cover image never became visible");
          })()'
          echo "--- client console output (informational) ---"
          jac browse console

      - name: Dump server thread stacks on failure
        if: failure()
        run: |
          pip install py-spy >/dev/null 2>&1 || true
          for p in $(pgrep -f "jac start main.jac"); do
            echo "=== py-spy dump pid $p ==="
            sudo env "PATH=$PATH" py-spy dump --pid "$p" --nonblocking || true
          done

      - name: Screenshot browse state on failure
        if: failure()
        run: jac browse screenshot /tmp/jac-site-browse-failure.png || true

      - name: Upload browse failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jac-site-browse-failure
          path: /tmp/jac-site-browse-failure.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop jac_site server
        if: always()
        run: |
          jac browse close 2>/dev/null || true
          if [ -n "${{ env.JAC_SITE_PID }}" ]; then
            kill ${{ env.JAC_SITE_PID }} 2>/dev/null || true
            sleep 3
            kill -9 ${{ env.JAC_SITE_PID }} 2>/dev/null || true
          fi

      - name: Create fullstack project and eject it
        run: |
          jac create --use web-app fs-smoke
          cd fs-smoke && jac build --as source --no_typecheck

      - name: Install ejected backend and start it
        working-directory: fs-smoke/ejected/backend
        run: |
          pip install -r requirements.txt
          PORT=8000 timeout 600 python main.py > /tmp/fullstack-ejected.log 2>&1 &
          EJECTED_PID=$!
          echo "EJECTED_PID=$EJECTED_PID" >> $GITHUB_ENV
          sleep 5
          if ! kill -0 $EJECTED_PID 2>/dev/null; then
            echo "Ejected backend died during startup"
            cat /tmp/fullstack-ejected.log
            exit 1
          fi

      - name: Verify ejected fullstack backend responds
        run: |
          for i in $(seq 1 12); do
            if ! kill -0 ${{ env.EJECTED_PID }} 2>/dev/null; then
              echo "Ejected backend exited unexpectedly"
              tail -100 /tmp/fullstack-ejected.log
              exit 1
            fi
            if curl -sf --max-time 5 http://localhost:8000/__health -o /dev/null 2>&1; then
              echo "Ejected backend responding (attempt $i)"
              exit 0
            fi
            sleep 5
          done
          echo "Ejected backend failed to respond"
          tail -100 /tmp/fullstack-ejected.log
          exit 1

      - name: Stop ejected fullstack server
        if: always()
        run: |
          if [ -n "${{ env.EJECTED_PID }}" ]; then
            kill ${{ env.EJECTED_PID }} 2>/dev/null || true
            sleep 3
            kill -9 ${{ env.EJECTED_PID }} 2>/dev/null || true
          fi

      - name: Upload jac_site server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jac-site-test-logs
          path: /tmp/jac-site-server.log
          retention-days: 7

      - name: Upload fullstack ejected backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-ejected-logs
          path: /tmp/fullstack-ejected.log
          retention-days: 7

  # Body lives in _installer.yml so the nightly lane runs the same test
  # instead of a second copy of it. The PR lane lints install.sh; the nightly
  # one does not (it exercises the published installer, not this checkout).
  installer-test:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.installer == 'true') }}
    uses: ./.github/workflows/_installer.yml
    with:
      shellcheck: true

  # Aggregate gate: branch protection requires only this context. A NEW job
  # must be added to needs below by hand; always() so failures upstream fail
  # the gate instead of skipping it (skipped required checks count as passing).
  everything-passed:
    name: Everything Passed
    if: always()
    needs:
      - changes
      - build-kit
      - build-kit-macos
      - jac-check
      - contribution-checks
      - test-compiler
      - test-runtime
      - test-no-llvm
      - test-client
      - test-solid-and-desktop
      - test-packages-and-docs
      - test-scale
      - test-scale-k8s
      - test-native-aarch64
      - test-native-macos
      - test-launcher
      - test-cef-build
      - test-jac-pack-smoke
      - installer-test
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "::error::One or more CI jobs failed or were cancelled; blocking merge."
          echo "Per-job results:"
          echo "$RESULTS"
          exit 1
      - name: All required jobs passed (or were skipped)
        run: echo "Everything passed. ✅"
