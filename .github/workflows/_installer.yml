name: Installer smoke


on:
  workflow_call:
    inputs:
      shellcheck:
        description: >-
          Lint scripts/install.sh from the checkout. On for the PR lane, whose
          whole trigger is that file changing. Off for the scheduled lane,
          which is testing the PUBLISHED installer -- linting the checkout
          there would report on a file the run never executes.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  installer:
    name: installer (${{ matrix.os }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-14
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck install.sh
        if: inputs.shellcheck && runner.os == 'Linux'
        run: shellcheck scripts/install.sh

      - name: Require a native binary asset on the latest release
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view --repo "$GITHUB_REPOSITORY" \
            --json assets --jq ' .assets[].name' \
            | grep -q "jac-.*-${{ matrix.platform }}$"

      - name: "install: download + run the binary"
        env:
          # install.sh authenticates its GitHub API calls when a token is set;
          # shared runners (macOS especially) exhaust the unauthenticated
          # per-IP rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install.sh

      - name: "install: verify jac"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          which jac
          jac --version

      - name: "install: run a test program"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo 'with entry { print("hello from the jac binary"); }' > /tmp/test_install.jac
          jac /tmp/test_install.jac

      - name: "install: uninstall"
        run: bash scripts/install.sh --uninstall

      - name: "install: verify removal"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if command -v jac &>/dev/null; then
            echo "FAIL: jac still found after uninstall"
            exit 1
          fi
          echo "PASS: jac removed"
