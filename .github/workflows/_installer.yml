name: Installer smoke

# The documented `curl ... | bash` path, exercised against the LIVE latest
# release. Two callers share this one copy:
#   - ci.yml  (installer-test): PR lane, gated on scripts/install.sh changing.
#   - nightly.yml (installer-live): daily, so a release that ships a missing
#     or broken asset is caught even when nobody touches the installer.
#
# It was duplicated between those two files and had already drifted: only the
# ci.yml copy linted install.sh, and only the ci.yml copy ran the shipped
# compiler rather than the checkout's. Two copies of an installer test
# converge on being one wrong copy, so the body lives here.

on:
  workflow_call:
    inputs:
      shellcheck:
        description: >-
          Lint scripts/install.sh from the checkout. On for the PR lane, whose
          whole trigger is that file changing. Off for the scheduled lane,
          which is testing the PUBLISHED installer -- linting the checkout
          there would report on a file the run never executes.
        required: false
        default: false
        type: boolean

permissions:
  contents: read


jobs:
  installer:
    # Named explicitly: a matrix key like `optional` would otherwise be
    # appended to the default job name and rename every leg's check.
    name: installer (${{ matrix.os }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-14
            platform: macos-aarch64
          # Mirrors `optional` in build-binaries.yml's LEGS: while the Intel
          # binary aborts on `jac --version` (#8805) that leg is non-blocking
          # there, so the latest release legitimately ships without a
          # macos-x86_64 asset. On this lane an optional leg whose asset is
          # missing reports a warning and skips the install steps (the release
          # said it may ship without one); an optional asset that IS shipped
          # still gets installed and run, and a broken one still shows red
          # without blocking. Drop both `optional` flags together when the leg
          # is green again.
          - os: macos-15-intel
            platform: macos-x86_64
            optional: true
    continue-on-error: ${{ matrix.optional || false }}
    steps:
      - uses: actions/checkout@v5
      # This job installs the SHIPPED binary and must run it, not the
      # checkout's compiler: the repo root's jac.toml would reroute it to the
      # in-repo source, and the test would stop proving anything about the
      # artifact users download.
      - uses: ./.github/actions/seal-checkout

      - name: ShellCheck install.sh
        if: inputs.shellcheck && runner.os == 'Linux'
        run: shellcheck scripts/install.sh

      # A missing asset on the latest release is a release regression that
      # breaks `curl ... | bash` -- fail loudly instead of skipping. Unless the
      # release itself marks the platform optional: then it is the declared
      # state, not a regression, and the lane says so and stands down.
      - name: Require a native binary asset on the latest release
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPTIONAL: ${{ matrix.optional || false }}
        run: |
          set -euo pipefail
          if gh release view --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' 2>/dev/null \
               | grep -q "jac-.*-${{ matrix.platform }}$"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [ "$OPTIONAL" = "true" ]; then
            echo "::warning::Latest GitHub Release has no jac-*-${{ matrix.platform }} asset. The release marks this platform optional (build-binaries.yml LEGS), so 'curl ... | bash' has no binary for it until that leg is green again; install steps skipped."
            exit 0
          fi
          echo "::error::Latest GitHub Release has no jac-*-${{ matrix.platform }} asset; 'curl ... | bash' is broken for this platform."
          exit 1

      - name: "install: download + run the binary"
        if: steps.asset.outputs.present == 'true'
        env:
          # install.sh authenticates its GitHub API calls when a token is set;
          # shared runners (macOS especially) exhaust the unauthenticated
          # per-IP rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install.sh

      - name: "install: verify jac"
        if: steps.asset.outputs.present == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          which jac
          jac --version

      - name: "install: run a test program"
        if: steps.asset.outputs.present == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo 'with entry { print("hello from the jac binary"); }' > /tmp/test_install.jac
          jac /tmp/test_install.jac

      - name: "install: uninstall"
        if: steps.asset.outputs.present == 'true'
        run: bash scripts/install.sh --uninstall

      - name: "install: verify removal"
        if: steps.asset.outputs.present == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if command -v jac &>/dev/null; then
            echo "FAIL: jac still found after uninstall"
            exit 1
          fi
          echo "PASS: jac removed"
