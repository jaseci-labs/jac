name: Release rehearsal

# A full release, minus publishing, every day at 03:00 Asia/Colombo: the
# release binaries on every platform with their smoke tests, the Docker image
# for each architecture, and every Nightly lane. ci.yml's `release-rehearsal`
# check turns main red while the latest rehearsal is failing, and stays red
# until one passes. Dispatch it by hand to confirm a fix without waiting.

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal
  cancel-in-progress: false

jobs:
  binaries:
    permissions:
      contents: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      tag: ""
      channel: release

  docker:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux-x86_64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jac-*-${{ matrix.platform }}
          path: art
          merge-multiple: true

      - name: Stage the build context
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          bin="$(find art -type f -name "jac-*-${PLATFORM}" | head -1)"
          [ -n "$bin" ] || { echo "::error::No ${PLATFORM} binary in this run's artifacts."; exit 1; }
          mkdir -p "ctx/$ARCH"
          cp "$bin" "ctx/$ARCH/jac"
          chmod +x "ctx/$ARCH/jac"
          cp docker/jaclang.Dockerfile ctx/Dockerfile

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the image (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ctx
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: jac-rehearsal:${{ matrix.arch }}

      - name: Run the image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm "jac-rehearsal:$ARCH" --version
          printf 'with entry { print("ok"); }\n' > h.jac
          out="$(docker run --rm -v "$PWD/h.jac:/app/h.jac:ro" "jac-rehearsal:$ARCH" run h.jac)"
          grep -qx ok <<<"$out"

  nightly:
    permissions:
      contents: write
    uses: ./.github/workflows/nightly.yml
