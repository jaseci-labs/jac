name: Build jac native binaries

# Builds the self-contained `jac` binary per platform and attaches it to a
# GitHub Release, with native JacPython on every target.
# One parameterized workflow serves both channels:
#   - channel=release (default): cold, glibc-2.17-pinned builds attached to a
#     versioned release. Called by release.yml after it cuts the release (a
#     GITHUB_TOKEN-created release emits no release.published event); the
#     release event is the safety net for releases published by a real user.
#   - channel=dev: cache-accelerated host-native builds re-published under the
#     rolling `dev` prerelease. Called by release-dev.yml on its nightly cron.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to upload assets to: canonical v<version>, or `dev` for the rolling prerelease."
        required: true
        type: string
      commit:
        # A tag is a mutable ref, and checking one out is how a release ends up
        # building a tree nobody approved: re-cutting a version whose tag
        # already existed rebuilt whatever that tag still pointed at, five days
        # stale (#8793). The release resolves the commit under review and names
        # it here, so the artifact is pinned to an immutable object while `tag`
        # stays what it always was -- the upload target. Empty (the release
        # event, workflow_dispatch) keeps the tag checkout.
        description: "Immutable commit SHA to build. Empty = check out `tag`."
        required: false
        default: ""
        type: string
      channel:
        description: "release: cold + glibc-pinned; dev: cached + host-native."
        required: false
        default: release
        type: string
      only:
        description: "Comma-separated platform filter. Empty builds all supported hosts. Filtered builds cannot publish a release."
        required: false
        default: ""
        type: string
    outputs:
      required_platforms:
        # The one place a caller can learn what this run was obliged to
        # produce. release.yml's `publish` used to carry its own copy of the
        # platform list under a comment asking whoever edited one to remember
        # the other; a leg dropped from the matrix would still have been
        # demanded there, hanging the release on an asset nothing was
        # building. `plan` derives this from the same array the matrix comes
        # from, so the two can no longer disagree.
        description: "Space-separated platform suffixes required to publish; non-blocking legs are excluded."
        value: ${{ jobs.plan.outputs.required }}
    # Called workflows do not see the caller's repo secrets unless passed
    # explicitly; without these the docker-image job skips its push steps.
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        # Use the canonical `v<version>` tag; a new tag would create a
        # duplicate release. Empty = build the artifact only, attach nothing.
        description: "Canonical release tag to upload assets to (e.g. v0.30.1). Empty = artifact only."
        required: false
        type: string
      # `channel` and `only` mirror the workflow_call inputs so a one-leg
      # diagnostic build is a dispatch away. This replaces macos-seal-probe.yml,
      # a wrapper whose whole body was a workflow_call with only=macos-aarch64
      # and which was never run once.
      channel:
        description: "release: cold + glibc-pinned; dev: cached + host-native."
        required: false
        default: release
        type: choice
        options: [release, dev]
      only:
        description: 'Comma-separated platform filter (e.g. macos-aarch64). Empty = the channel''s full leg list. Filtered builds cannot publish to a release tag.'
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.legs.outputs.include }}
      required: ${{ steps.legs.outputs.required }}
    steps:
      - name: Select build legs for the channel
        id: legs
        env:
          CHANNEL: ${{ inputs.channel }}
          ONLY: ${{ inputs.only }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Every host has a checksum-pinned bootstrap compiler.
          LEGS='[
            {"os": "blacksmith-4vcpu-ubuntu-2404", "platform": "linux-x86_64", "zig_target": "x86_64-linux-gnu.2.17"},
            {"os": "ubuntu-24.04-arm", "platform": "linux-aarch64", "zig_target": "aarch64-linux-gnu.2.17"},
            {"os": "macos-14",         "platform": "macos-aarch64"}
          ]'
          if [ -n "${ONLY:-}" ]; then
            LEGS="$(jq -c --arg only "$ONLY" \
              '($only | split(",") | map(ltrimstr(" ") | rtrimstr(" "))) as $want
               | map(select(.platform as $p | $want | index($p)))' <<<"$LEGS")"
            # A typo in the filter must not green-light an empty matrix.
            [ "$(jq -c 'length' <<<"$LEGS")" -gt 0 ] || {
              echo "::error::platform filter '$ONLY' matched no leg on channel '${CHANNEL:-release}'"
              exit 1
            }
          fi
          if [ -n "${ONLY:-}" ] && [ -n "${TAG:-}" ]; then
            echo "::error::a filtered build cannot publish an incomplete release"
            exit 1
          fi
          echo "include=$(jq -c . <<<"$LEGS")" >> "$GITHUB_OUTPUT"

          REQUIRED="$(jq -r 'map(.platform) | join(" ")' <<<"$LEGS")"
          echo "required=$REQUIRED" >> "$GITHUB_OUTPUT"
          echo "Building: $(jq -r 'map(.platform) | join(" ")' <<<"$LEGS")"
          echo "Required to publish: ${REQUIRED:-(none)}"

  build:
    name: ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    env:
      # -Dtarget flag for zig build: set on release-channel Linux legs, empty
      # (host-native) on the dev channel and macOS.
      DTARGET: ${{ inputs.channel != 'dev' && matrix.zig_target && format('-Dtarget={0}', matrix.zig_target) || '' }}
    steps:
      # Check out the commit the release resolved (release channel, when the
      # caller names one), else the release tag, else the pushed commit (dev
      # channel), so a recovery run after main advanced still builds the
      # release's own source. SHA-pinned: this job holds contents:write and
      # ships user-downloaded binaries, so a re-pointed tag on the action must
      # not reach it.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.channel == 'dev' && github.sha || inputs.commit || inputs.tag || github.event.release.tag_name }}

      # The provenance line the v0.37.0 post-mortem had to reconstruct from a
      # cache key. It is also the assertion: if the checkout ever resolves
      # something other than the commit the release named, this leg stops
      # instead of shipping it.
      - name: Record the commit being built
        shell: bash
        env:
          WANT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Building ${HEAD_SHA}"
          if [ -n "$WANT" ] && [ "$HEAD_SHA" != "$WANT" ]; then
            echo "::error::checkout resolved ${HEAD_SHA}, but this release is cutting ${WANT}"
            exit 1
          fi

      # Dev channel only: reuse the read-mostly caches main seeds. The release
      # channel builds cold on purpose (a cached payload could ship stale
      # bits). The LLVMPY_* shim is the most expensive artifact and depends
      # only on native/**, build.zig, and the pinned LLVM slice; same cache key
      # as setup-jac, so main usually has it warm (the arm64 leg self-seeds:
      # no other workflow runs on Linux-ARM64).
      - name: Restore cached LLVMPY shim (dev channel)
        if: inputs.channel == 'dev'
        id: shim-cache
        uses: actions/cache@v4
        with:
          path: jac/zig-out/lib/libjacllvm.*
          key: jac-shim-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/native/**', 'jac/build.zig', 'jac/bootstrap/pins.json') }}

      # Keyed on bootstrap/pins.json to match the entries setup-jac seeds (the
      # old release-dev key hashed the payload tool, so it never matched them and
      # duplicated the ~0.5 GB tree into the cache pool).
      - name: Restore cached LLVM (dev channel)
        if: inputs.channel == 'dev' && steps.shim-cache.outputs.cache-hit != 'true'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: jac/.llvm-build
          key: llvm-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/bootstrap/pins.json') }}

      - name: Fingerprint tracked build inputs
        if: inputs.channel == 'dev'
        id: build-inputs
        shell: bash
        run: |
          digest="$(git ls-tree -r HEAD -- jac jac.toml | git hash-object --stdin)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Cache compiler modules (dev channel)
        if: inputs.channel == 'dev'
        uses: actions/cache@v4
        with:
          path: jac/.compiler-build
          key: compiler-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/bootstrap/pins.json', 'jac/bootstrap/compiler.jac') }}-${{ steps.build-inputs.outputs.digest }}
          restore-keys: |
            compiler-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/bootstrap/pins.json', 'jac/bootstrap/compiler.jac') }}-
      - name: Resolve Python SDK cache input
        id: python-sdk
        shell: bash
        run: |
          sdk=zig-libc
          if [ "$RUNNER_OS" = macOS ]; then sdk=$(xcrun --sdk macosx --show-sdk-version); fi
          echo "version=$sdk" >> "$GITHUB_OUTPUT"

      - name: Restore cached source-built Python (dev channel)
        if: inputs.channel == 'dev'
        uses: actions/cache@v4
        with:
          path: jac/.python-build/jacpython
          key: python-build-v3-jacpython-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdk${{ steps.python-sdk.outputs.version }}-${{ hashFiles('jac/bootstrap/build_python.zig', 'jac/bootstrap/seed.zig', 'jac/bootstrap/python/**', 'jac/jaclang/**/*.jac', 'jac/jaclang/**/*.py', 'jac/jaclang/vendor/typeshed/PIN', 'jac/jaclang/vendor/typeshed/TARBALL_SHA256') }}

      - name: Restore cached bun runtime (dev channel)
        if: inputs.channel == 'dev'
        uses: actions/cache@v4
        with:
          path: jac/.bun-build
          key: bun-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/jaclang/client/bun_installer.jac') }}

      # The payload's compressed deps-layer frame (mkpayload --layer-cache):
      # content-addressed and verified by decompress + byte-compare before
      # reuse, so a stale restore can only miss, never mis-serve (same
      # contract as the JIR tree above). Key mirrors setup-jac verbatim.
      - name: Restore cached payload deps-layer frame (dev channel)
        if: inputs.channel == 'dev'
        uses: actions/cache@v4
        with:
          path: jac/.payload-layers/jacpython
          key: payload-layers-jacpython-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/launcher/**', 'jac/bootstrap/**', 'jac/build.zig', 'jac/build.zig.zon', 'jac/native/**', 'jac/jaclang/client/bun_installer.jac', 'jac/jaclang/compiler/backends/native/wasm_rt/**') }}
          restore-keys: |
            payload-layers-jacpython-${{ runner.os }}-${{ runner.arch }}-

      # Release channel: fetch the prebuilt, target-pinned shim that
      # build-shims.yml publishes on the rolling `deps` prerelease instead of
      # range-fetching the ~0.5 GB LLVM slice and re-linking the shim cold
      # (the most expensive step of a release build). The asset name embeds
      # the hash of the shim's complete input set, so a hit means "built from
      # exactly these inputs"; the sha256 sidecar guards transport, and the
      # floor-verification steps below re-check whatever shim gets bundled.
      # A miss (e.g. right after a shim-input change, before build-shims has
      # run on a matching tree) falls back to today's cold from-source build,
      # which then self-seeds the asset.
      - name: Fetch prebuilt shim from the deps release (release channel)
        if: inputs.channel != 'dev'
        id: shim-fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIM_KEY: ${{ hashFiles('jac/native/**', 'jac/build.zig', 'jac/bootstrap/pins.json') }}
        run: |
          set -euo pipefail
          EXT=so
          [ "$RUNNER_OS" = "macOS" ] && EXT=dylib
          ASSET="libjacllvm-${{ matrix.platform }}-${SHIM_KEY}.${EXT}"
          mkdir -p .shim-fetch
          if gh release download deps --repo "$GITHUB_REPOSITORY" \
               --pattern "$ASSET" --pattern "$ASSET.sha256" \
               --dir .shim-fetch --clobber 2>/dev/null \
             && [ -f ".shim-fetch/$ASSET" ] && [ -f ".shim-fetch/$ASSET.sha256" ] \
             && ( cd .shim-fetch && shasum -a 256 -c "$ASSET.sha256" ); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "file=$GITHUB_WORKSPACE/.shim-fetch/$ASSET" >> "$GITHUB_OUTPUT"
          else
            echo "No usable prebuilt shim asset $ASSET; falling back to the cold from-source build."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      # The Zig package store (.zig-cache/p): every git/tarball dependency
      # `zig build` fetches, as pinned by build.zig.zon. Content-addressed
      # source packages -- immutable, so (unlike the payload-artifact caches
      # above, kept dev-only to avoid shipping stale bits) this is safe on BOTH
      # channels, and a release is exactly when an upstream fetch blip must not
      # fail the build. Same key as setup-jac so the Linux-x86_64 leg reuses the
      # entry main seeds; a cross -Dtarget build fetches the same source, so
      # os/arch is the right axis.
      - name: Cache the Zig package store (avoids re-fetching zon deps)
        uses: actions/cache@v4
        with:
          path: .zig-cache/p
          key: zig-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/build.zig.zon') }}
          restore-keys: |
            zig-pkgs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install host tools (zstd)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y zstd
          else
            brew install zstd
          fi

      - name: Set up Zig 0.16.0
        # SHA-pinned: same shipping-binaries rationale as the checkout.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          # Fresh cache each run: a cached payload could ship stale bits.
          use-cache: false

      - name: Read version (from jac.toml)
        id: ver
        run: echo "version=$(grep -m1 '^version' jac.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      # The native backend statically links a pinned LLVM; fetch it per target
      # before `zig build`. Skipped when a prebuilt shim is in hand (-Dshim-bin
      # needs no LLVM at all): the dev-channel shim cache, the release-channel
      # deps-release fetch, or a dev-channel LLVM-cache hit (tree already
      # restored). The cross-channel gates are vacuous: each channel's skipped
      # restore/fetch steps leave their outputs empty, so only its own paths
      # decide.
      - name: Fetch LLVM for the jacllvm shim
        if: >-
          steps.shim-cache.outputs.cache-hit != 'true' &&
          steps.llvm-cache.outputs.cache-hit != 'true' &&
          steps.shim-fetch.outputs.hit != 'true'
        working-directory: jac
        run: zig build fetch-llvm $DTARGET --summary all

      # The shipped macOS binary's launcher stub is linked by Jac's own Mach-O
      # linker, so a mislinked image dies in native code with nothing but a
      # signal number (#8302, #8307, #8313, #8800 -- four release cycles spent
      # on a bare exit 139). ReportCrash turns that into a symbolicated .ips,
      # which the on-failure step below prints -- but only if the agent is
      # loaded, and the hosted image does not guarantee that. Best-effort and
      # before the build, because a report is only written for a crash that
      # happens after the agent is up.
      - name: Arm macOS crash reporting (so a native fault names itself)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          launchctl load -w /System/Library/LaunchAgents/com.apple.ReportCrash.plist
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.ReportCrash.Root.plist
          defaults write com.apple.CrashReporter DialogType none
          launchctl list | grep -i reportcrash
          exit 0

      - name: Build the jac binary (one command)
        working-directory: jac
        run: |
          set -euo pipefail
          if [ "${{ steps.shim-fetch.outputs.hit }}" = "true" ]; then
            shim="${{ steps.shim-fetch.outputs.file }}"
          else
            if [ "${{ steps.shim-cache.outputs.cache-hit }}" != "true" ]; then
              zig build jacllvm $DTARGET --summary all
            fi
            shims=(zig-out/lib/libjacllvm.*)
            shim="${shims[0]}"
          fi
          test -f "$shim"
          zig build $DTARGET -Dshim-bin="$shim" --summary all

      # Launcher unit tests (`zig build test`) live in ci.yml's `test-launcher`
      # job so they gate every PR on Linux + macOS, not just release time. The
      # smoke tests below validate the actually-shipped cross-compiled binary.
      - name: Smoke test (no system Python)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          WORK="$(mktemp -d)"
          env -i HOME="$WORK" PATH=/usr/bin:/bin "$BIN" --version
          printf 'with entry { print("ok"); }\n' > "$WORK/h.jac"
          env -i HOME="$WORK" PATH=/usr/bin:/bin "$BIN" run "$WORK/h.jac" | grep -q ok

      - name: Verify the shipped native JacPython compiler
        working-directory: jac
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cat > "$WORK/native_compiler.jac" <<'EOF'
          import sys;
          import ctypes;
          with entry {
              assert ctypes.pythonapi._PyJac_CompilerRequired() == 1;
              assert ctypes.pythonapi._PyJac_CompilerBridgeVersion() == 3;
              assert not hasattr(sys, "_jacpython_compile");
              assert not hasattr(sys, "_jacpython_image");
              print("native JacPython verified");
          }
          EOF
          zig-out/bin/jac run "$WORK/native_compiler.jac"

      # Guards #7047: the binary must not leak PYTHONHOME/PYTHONPATH (or any
      # interpreter config) into subprocesses -- a python-based child spawned
      # by a jac program must run with its OWN stdlib, and the user's ambient
      # PYTHONHOME/PYTHONPATH must pass through to children untouched.
      - name: Smoke test (no env leak into subprocesses)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          WORK="$(mktemp -d)"
          cat > "$WORK/leak.jac" <<'EOF'
          import os;
          import subprocess;
          with entry {
              assert "PYTHONHOME" not in os.environ;
              assert "PYTHONPATH" not in os.environ or os.environ["PYTHONPATH"] == "/user/own";
              r = subprocess.run(
                  ["python3", "-c", "import os, encodings; print('child', os.environ.get('PYTHONPATH'))"],
                  capture_output=True, text=True
              );
              assert r.returncode == 0, r.stderr[:200];
              print(r.stdout.strip());
          }
          EOF
          # Clean env: nothing leaks in.
          env -i HOME="$WORK" PATH=/usr/bin:/bin "$BIN" run "$WORK/leak.jac" | grep -qx 'child None'
          # User-supplied PYTHONPATH: passes through to children untouched.
          env -i HOME="$WORK" PATH=/usr/bin:/bin PYTHONPATH=/user/own "$BIN" run "$WORK/leak.jac" | grep -qx 'child /user/own'

      # A macOS leg that dies in native code must say WHERE. On any failure
      # above this: (1) print every crash report the OS wrote -- the .ips
      # carries the faulting thread's frames plus dyld's own message, neither
      # of which reaches the process's stderr on modern macOS; (2) dump the
      # shipped binary's Mach-O header and load commands, which is what names a
      # mislinked image; (3) replay `jac --version` under lldb for a
      # symbolicated backtrace. Gated on failure(), so a green leg pays
      # nothing.
      - name: Name the macOS crash (crash reports + header dump + lldb replay)
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        working-directory: jac
        run: |
          set +e
          REPORTS="$HOME/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports"

          # ReportCrash writes asynchronously; poll rather than sleep blind.
          for _ in $(seq 1 30); do
            ls $REPORTS 2>/dev/null | grep -qE '\.(ips|crash)$' && break
            sleep 1
          done

          echo "::group::macOS crash reports"
          FOUND=0
          for d in $REPORTS; do
            [ -d "$d" ] || continue
            for f in "$d"/*.ips "$d"/*.crash; do
              [ -f "$f" ] || continue
              FOUND=1
              echo "===== $f"
              cat "$f"
              echo
            done
          done
          [ "$FOUND" = 1 ] || echo "(no crash report -- ReportCrash is not loaded on this image)"
          echo "::endgroup::"

          BIN="$PWD/zig-out/bin/jac"
          if [ -f "$BIN" ]; then
            echo "::group::Mach-O header + load commands of the shipped binary"
            otool -hv "$BIN"
            otool -l "$BIN" | head -200
            echo "::endgroup::"

            echo "::group::lldb replay of jac --version"
            perl -e 'alarm 240; exec @ARGV' \
              lldb --batch -o run -k "thread backtrace all" -k "image list -o -f" \
                   -k quit -- "$BIN" --version 2>&1 | tail -80
            echo "::endgroup::"
          else
            echo "(no zig-out/bin/jac: the build itself did not get that far)"
          fi
          exit 0

      - name: Collect the macOS crash evidence
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          OUT="$RUNNER_TEMP/jac-crash-evidence"
          mkdir -p "$OUT"
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "$d" ] && cp -f "$d"/*.ips "$d"/*.crash "$OUT"/ 2>/dev/null
          done
          BIN="$GITHUB_WORKSPACE/jac/zig-out/bin/jac"
          if [ -f "$BIN" ]; then
            otool -l "$BIN" > "$OUT/jac.otool" 2>/dev/null
            nm -n "$BIN" > "$OUT/jac.nm" 2>/dev/null
          fi
          ls -la "$OUT"
          exit 0

      - name: Upload the macOS crash evidence
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-crash-evidence-${{ matrix.platform }}
          path: ${{ runner.temp }}/jac-crash-evidence
          if-no-files-found: ignore

      # Guards #7082: neither the launcher nor the LLVMPY_* shim may reference
      # a glibc symbol newer than the zig_target floor. Release channel only:
      # dev binaries are host-native with no pinned floor.
      - name: Verify glibc floor (from zig_target)
        if: runner.os == 'Linux' && inputs.channel != 'dev'
        working-directory: jac
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          set -euxo pipefail
          FLOOR="${ZIG_TARGET##*gnu.}"
          check() {
            local f="$1" hi
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
            hi="$(objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -V | tail -1 || true)"
            : "${hi:=0}"
            echo "$f -> max GLIBC_$hi (floor $FLOOR)"
            if [ "$(printf '%s\n%s\n' "$FLOOR" "$hi" | sort -V | tail -1)" != "$FLOOR" ]; then
              echo "::error::$f requires GLIBC_$hi (> $FLOOR)"; exit 1
            fi
          }
          check zig-out/bin/jac
          SHIM="${{ steps.shim-fetch.outputs.file }}"
          [ -n "$SHIM" ] || SHIM="zig-out/lib/libjacllvm.so"
          check "$SHIM"

      - name: Seed the deps release with the built shim (release channel)
        if: inputs.channel != 'dev' && steps.shim-fetch.outputs.hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET="${{ steps.shim-fetch.outputs.asset }}"
          mkdir -p dist-shim
          cp jac/zig-out/lib/libjacllvm.* "dist-shim/$ASSET"
          ( cd dist-shim && shasum -a 256 "$ASSET" > "$ASSET.sha256" )
          gh release create deps --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Prebuilt build dependencies (rolling)" \
            --notes "Content-addressed prebuilt build artifacts (LLVMPY shims). Consumed by build-binaries.yml; not for direct download." \
            2>/dev/null || true
          gh release upload deps --repo "$GITHUB_REPOSITORY" \
            "dist-shim/$ASSET" "dist-shim/$ASSET.sha256" --clobber

      - name: Package asset (+ checksum)
        id: pkg
        working-directory: jac
        run: |
          set -euxo pipefail
          if [ "${{ inputs.channel }}" = "dev" ]; then
            ASSET="jac-dev-${{ matrix.platform }}"
          else
            ASSET="jac-${{ steps.ver.outputs.version }}-${{ matrix.platform }}"
          fi
          mkdir -p dist
          cp zig-out/bin/jac "dist/$ASSET"
          # No codesign on macOS: the payload tarball appended past the Mach-O
          # end fails codesign's strict validation; the zig linker's ad-hoc
          # signature is content-based and survives cp.
          ( cd dist && shasum -a 256 "$ASSET" > "$ASSET.sha256" )
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: jac
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" \
            "dist/${{ steps.pkg.outputs.asset }}" \
            "dist/${{ steps.pkg.outputs.asset }}.sha256" \
            --clobber

      # install.sh's real `curl ... | bash` path is verified against the
      # published release out-of-band: nightly.yml `installer-live` (daily, both
      # platforms) and ci.yml `installer-test` (PRs touching scripts/install.sh).
      # It is deliberately NOT re-run here as a blocking release gate: install.sh
      # queries the GitHub API unauthenticated, and on shared macOS runners the
      # 60/hr anon rate limit routinely trips -- failing a release whose assets
      # uploaded fine.

      # Release channel only: dev binaries are already published on the `dev`
      # prerelease, and a per-push 3x ~130 MB artifact would be pure storage
      # churn.
      - name: Upload as workflow artifact
        if: inputs.channel != 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: jac/dist/*

      # Non-blocking must not shade into unnoticed. continue-on-error reports
      # the leg as a success to `needs:`, so without this the only trace of a
      # dead platform is a red step somebody has to go looking for -- the exact
      # inattention that let this one rot for eighteen days. Say it in the run
      # summary and as an annotation instead.
  admin-dist:
    needs: build
    if: (github.event_name == 'release' || inputs.tag != '') && inputs.only == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.channel == 'dev' && github.sha || inputs.commit || inputs.tag || github.event.release.tag_name }}

      - name: Read version (from jac.toml)
        id: ver
        run: echo "version=$(grep -m1 '^version' jac.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      # Dev-channel legs keep no workflow artifact; that path pulls the
      # asset this run just re-published on the rolling prerelease instead.
      - name: Fetch this run's linux-x86_64 binary (release channel)
        if: inputs.channel != 'dev'
        uses: actions/download-artifact@v4
        with:
          name: jac-${{ steps.ver.outputs.version }}-linux-x86_64
          path: jacbin

      - name: Build the console and package the dist
        id: pkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p jacbin
          if [ "${{ inputs.channel }}" = "dev" ]; then
            gh release download dev --repo "$GITHUB_REPOSITORY" \
              --pattern "jac-dev-linux-x86_64" --dir jacbin --clobber
            ASSET="jac-dev-admin-dist.tar.gz"
          else
            ASSET="jac-${{ steps.ver.outputs.version }}-admin-dist.tar.gz"
          fi
          BIN="$PWD/$(ls jacbin/jac-*linux-x86_64)"
          chmod +x "$BIN"
          # The admin console is a pure client app; its client bundle is
          # type-checked by the client toolchain during `build`. Skip the
          # whole-program gate, which applies native rules to `.cl.jac` code.
          ( cd jac/jaclang/scale/admin/ui && "$BIN" build main.jac )
          DIST=jac/jaclang/scale/admin/ui/.jac/client/dist
          test -f "$DIST/index.html"
          mkdir -p dist
          tar -C "$DIST" -czf "dist/$ASSET" .
          ( cd dist && shasum -a 256 "$ASSET" > "$ASSET.sha256" )
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" \
            "dist/${{ steps.pkg.outputs.asset }}" \
            "dist/${{ steps.pkg.outputs.asset }}.sha256" \
            --clobber

  # Publishes jaseci/jaclang (Docker Hub) from the binaries this run produced:
  #   <version> + latest on the release channel, dev on the rolling prerelease.
  # The image bakes the extracted runtime and the scale serve closure (see
  # docker/jaclang.Dockerfile), so it doubles as the deployment base image.
  #
  # Setup (one-time, repo secrets): DOCKERHUB_USERNAME + DOCKERHUB_TOKEN, an
  # access token from the `jaseci` Docker Hub org with write access. The job
  # is skipped when the secrets are absent (forks).
  docker-image:
    needs: build
    if: (github.event_name == 'release' || inputs.tag != '') && inputs.only == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Presence flag ("true"/"false"): `secrets` is not available in step
      # `if:` expressions, and the token value itself must not sit in env.
      DOCKERHUB_TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.channel == 'dev' && github.sha || inputs.commit || inputs.tag || github.event.release.tag_name }}

      - name: Read version (from jac.toml)
        id: ver
        run: echo "version=$(grep -m1 '^version' jac.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      # Dev-channel legs keep no workflow artifact; that path pulls the
      # binaries this run just re-published on the rolling prerelease instead.
      - name: Fetch this run's linux-x86_64 binary (release channel)
        if: inputs.channel != 'dev'
        uses: actions/download-artifact@v4
        with:
          name: jac-${{ steps.ver.outputs.version }}-linux-x86_64
          path: ctx/amd64

      - name: Fetch this run's linux-aarch64 binary (release channel)
        if: inputs.channel != 'dev'
        uses: actions/download-artifact@v4
        with:
          name: jac-${{ steps.ver.outputs.version }}-linux-aarch64
          path: ctx/arm64

      - name: Stage binaries into the build context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p ctx/amd64 ctx/arm64
          if [ "${{ inputs.channel }}" = "dev" ]; then
            gh release download dev --repo "$GITHUB_REPOSITORY" \
              --pattern "jac-dev-linux-x86_64" --dir ctx/amd64 --clobber
            gh release download dev --repo "$GITHUB_REPOSITORY" \
              --pattern "jac-dev-linux-aarch64" --dir ctx/arm64 --clobber
          fi
          # The release-channel artifact carries the binary's .sha256 beside
          # it; drop it so the rename glob matches exactly one file.
          rm -f ctx/amd64/*.sha256 ctx/arm64/*.sha256
          mv ctx/amd64/jac-* ctx/amd64/jac
          mv ctx/arm64/jac-* ctx/arm64/jac
          chmod +x ctx/amd64/jac ctx/arm64/jac
          cp docker/jaclang.Dockerfile ctx/Dockerfile

      # Forks skip publishing quietly, but on the org repo missing secrets
      # mean a misconfiguration (e.g. a caller not passing them through) --
      # fail loudly instead of green-skipping the publish.
      - name: Fail if publishing secrets are missing (org repo)
        if: github.repository == 'jaseci-labs/jac' && (env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN_SET != 'true')
        run: |
          echo "::error::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN did not reach this job; workflow_call callers must pass them via 'secrets:'."
          exit 1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: env.DOCKERHUB_USERNAME != ''

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: env.DOCKERHUB_USERNAME != ''

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        if: env.DOCKERHUB_USERNAME != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="jaseci/jaclang"
          VERSION="${{ steps.ver.outputs.version }}"
          if [ "${{ inputs.channel }}" = "dev" ]; then
            TAGS="$IMAGE:dev"
          else
            # :latest never moves backwards: a backport (0.34.8 after 0.35.0)
            # pushes its version tag only. Mirrors release.yml's publish guard.
            TAGS="$IMAGE:${VERSION}"
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || echo "")"
            if [ "$(printf '%s\n%s\n' "${latest_tag#v}" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
              TAGS="$TAGS,$IMAGE:latest"
            else
              echo "Backport: $latest_tag stays :latest, pushing $IMAGE:$VERSION only."
            fi
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
