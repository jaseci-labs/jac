name: Build compiler kernels and JacPython objects

# Builds, on one class of x86 Linux runner, the two native artifacts whose
# build is serial lowering that runs 2.5-3x slower on the ARM and macOS
# runners, for each named release platform, as artifacts of the calling run:
#
#   - `jacpython-object-<platform>`: JacPython's native object (jacpython.o,
#     its sha256, the sources it was lowered from, the generated modules
#     lowered into it and manifest.json), from `zig build jacpython-object
#     -Dtarget-platform=<platform>` (#10472). A build links it with
#     `zig build -Djacpython-object=DIR` (or setup-jac's `jacpython-object`)
#     and does the native rest itself, and refuses an object lowered for
#     another target or from other sources, tools or headers.
#   - `kernel-<platform>`: the native compiler kernel (#10219). A build adopts
#     it with `zig build -Dkernel=DIR` (or setup-jac's `kernel-dir`), and the
#     seal refuses a kernel whose unit sources, codegen, compiler, target or
#     Python do not match the tree it seals.
#
# Neither build is host-specific: lowering takes the target's canonical
# triple, the in-process linkers write ELF and Mach-O for any target, and
# neither artifact links a C archive of its target.
#
# Both run the checkout's own compiler on a linux-x86_64 JacPython runtime:
# the previous one main built (restored from the cache), else the pinned seed
# (`-Djacpython-host=auto`). The kernel's link-source driver (`zig build
# -Ddev`) bundles that runtime but is never shipped, and a kernel records
# only its Python version, so the driver reuses the runtime main last built
# whenever the sources it was lowered from are unchanged. The two jobs run in
# parallel.

on:
  workflow_call:
    inputs:
      platforms:
        description: "JSON array of release platforms (osarch), e.g. [\"linux-aarch64\", \"macos-aarch64\"]."
        required: true
        type: string
      ref:
        description: "Commit to build. Empty = the calling run's commit."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  jacpython-object:
    name: jacpython.o ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Fingerprint immutable build inputs
        id: inputs
        shell: bash
        run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

      # The object is a pure function of its Jac sources, the compiler and
      # tools that lower them and the target, so a rerun of the same commit
      # reuses it. The adopting build re-verifies it against its own tree, so
      # a restored object can only be refused, never linked stale.
      - name: Restore an object lowered from this tree
        id: object-cache
        uses: actions/cache@v4
        with:
          path: .jacpython-object
          key: jacpython-object-v1-${{ matrix.platform }}-${{ steps.inputs.outputs.jacpython_object }}

      - name: Fetch the prebuilt host shim from the deps release
        if: steps.object-cache.outputs.cache-hit != 'true'
        id: shim-fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIM_KEY: ${{ hashFiles('jac/native/**', 'jac/build.zig', 'jac/bootstrap/pins.json') }}
        run: |
          set -euo pipefail
          ASSET="libjacllvm-linux-x86_64-${SHIM_KEY}.so"
          mkdir -p .shim-fetch
          if gh release download deps --repo "$GITHUB_REPOSITORY" \
               --pattern "$ASSET" --pattern "$ASSET.sha256" \
               --dir .shim-fetch --clobber 2>/dev/null \
             && ( cd .shim-fetch && shasum -a 256 -c "$ASSET.sha256" ); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "file=$GITHUB_WORKSPACE/.shim-fetch/$ASSET" >> "$GITHUB_OUTPUT"
          else
            echo "No prebuilt shim $ASSET; building it from source."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      # The interpreter the lowering runs on: main's last linux-x86_64
      # JacPython runtime. Restored by prefix, since any recent runtime can
      # run the lowering tools; on a miss the build fetches the pinned seed.
      # Restore only: this job never seeds the shared runtime cache.
      - name: Restore the JacPython runtime to lower on
        if: steps.object-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: jac/.python-build/jacpython
          key: python-build-v4-jacpython-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdkzig-libc-${{ steps.inputs.outputs.python }}
          restore-keys: |
            python-build-v4-jacpython-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdkzig-libc-

      - name: Cache the Zig package store
        if: steps.object-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .zig-cache/p
          key: zig-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/build.zig.zon') }}
          restore-keys: |
            zig-pkgs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install host tools (zstd)
        if: steps.object-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Set up Zig 0.16.0
        if: steps.object-cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Fetch LLVM for the jacllvm shim
        if: steps.object-cache.outputs.cache-hit != 'true' && steps.shim-fetch.outputs.hit != 'true'
        working-directory: jac
        run: zig build fetch-llvm --summary all

      - name: Lower jacpython.o for ${{ matrix.platform }}
        if: steps.object-cache.outputs.cache-hit != 'true'
        working-directory: jac
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          if [ "${{ steps.shim-fetch.outputs.hit }}" = "true" ]; then
            cp "${{ steps.shim-fetch.outputs.file }}" jaclang/compiler/backends/native/llvm/libjacllvm.so
            zig build adopt-shim --summary all
          fi
          zig build jacpython-object -Dtarget-platform="${{ matrix.platform }}" \
            -Djacpython-host=auto --summary all
          rm -rf "$GITHUB_WORKSPACE/.jacpython-object"
          cp -r ".python-build/jacpython/${{ matrix.platform }}.object" "$GITHUB_WORKSPACE/.jacpython-object"

      # What the adopting build checks first, checked here so a bad object
      # fails the job that made it rather than every leg.
      - name: Check the object
        working-directory: .jacpython-object
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ls -la
          for f in jacpython.o sha256 sources manifest.json; do
            [ -s "$f" ] || { echo "::error::the object directory has no $f"; exit 1; }
          done
          [ "$(sha256sum jacpython.o | cut -d' ' -f1)" = "$(tr -d ' \r\n' < sha256)" ] || {
            echo "::error::jacpython.o does not match its sha256"; exit 1; }
          [ "$(jq -r .platform manifest.json)" = "$PLATFORM" ] || {
            echo "::error::the object was lowered for $(jq -r .platform manifest.json), not $PLATFORM"; exit 1; }

      - name: Upload the object
        uses: actions/upload-artifact@v4
        with:
          name: jacpython-object-${{ matrix.platform }}
          path: .jacpython-object/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  kernel:
    name: kernel ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Fingerprint immutable build inputs
        id: inputs
        shell: bash
        run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

      # The kernel is a pure function of the compiler tree, the native shim's
      # inputs and the target, so a rerun of the same commit (or a dev-channel
      # build of an unchanged tree) reuses it. The leg's seal re-verifies the
      # kernel against the tree, so a restored kernel can only be refused,
      # never shipped stale.
      - name: Restore a kernel built from this tree
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: .kernel
          key: kernel-v2-${{ matrix.platform }}-${{ steps.inputs.outputs.kernel }}

      - name: Fetch the prebuilt host shim from the deps release
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        id: shim-fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIM_KEY: ${{ hashFiles('jac/native/**', 'jac/build.zig', 'jac/bootstrap/pins.json') }}
        run: |
          set -euo pipefail
          ASSET="libjacllvm-linux-x86_64-${SHIM_KEY}.so"
          mkdir -p .shim-fetch
          if gh release download deps --repo "$GITHUB_REPOSITORY" \
               --pattern "$ASSET" --pattern "$ASSET.sha256" \
               --dir .shim-fetch --clobber 2>/dev/null \
             && ( cd .shim-fetch && shasum -a 256 -c "$ASSET.sha256" ); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "file=$GITHUB_WORKSPACE/.shim-fetch/$ASSET" >> "$GITHUB_OUTPUT"
          else
            echo "No prebuilt shim $ASSET; building it from source."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      # The driver's JacPython runtime is never shipped (it only runs the
      # checkout's compiler), so the runtime main seeds is safe on both
      # channels here. Restore only: this job never seeds the shared cache.
      - name: Restore the JacPython runtime (driver only)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: jac/.python-build/jacpython
          key: python-build-v4-jacpython-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdkzig-libc-${{ steps.inputs.outputs.python }}
          restore-keys: |
            python-build-v4-jacpython-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdkzig-libc-

      - name: Cache the Zig package store
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .zig-cache/p
          key: zig-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/build.zig.zon') }}
          restore-keys: |
            zig-pkgs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install host tools (zstd)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Set up Zig 0.16.0
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Fetch LLVM for the jacllvm shim
        if: steps.kernel-cache.outputs.cache-hit != 'true' && steps.shim-fetch.outputs.hit != 'true'
        working-directory: jac
        run: zig build fetch-llvm --summary all

      # A link-source driver: the payload carries no compiler of its own and
      # runs this checkout's, which is the compiler that builds the kernel.
      # -Dreuse-python keeps the restored runtime when the sources it was
      # lowered from are unchanged; otherwise the driver lowers its own.
      - name: Build the driver
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        working-directory: jac
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ "${{ steps.shim-fetch.outputs.hit }}" = "true" ]; then
            cp "${{ steps.shim-fetch.outputs.file }}" jaclang/compiler/backends/native/llvm/libjacllvm.so
            zig build adopt-shim --summary all
          fi
          zig build -Ddev -Dreuse-python=true --summary all
          zig build fetch-typeshed --summary all
          if [ "${{ matrix.platform }}" = "linux-aarch64" ]; then
            zig build vendor-musl-linux-aarch64 --summary all
          fi

      - name: Build the kernel for ${{ matrix.platform }}
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        working-directory: jac
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          BIN="$PWD/zig-out/bin/jac"
          # --exact records the compiler's full digest, which the seal's
          # payload tree reproduces; a dev build records only the ABI
          # contract's, and the seal refuses to adopt that.
          "$BIN" native build "kernel@${{ matrix.platform }}" --exact
          "$BIN" native status "kernel@${{ matrix.platform }}"
          if [ "${{ matrix.platform }}" = "linux-x86_64" ]; then
            SRC=jaclang/compiler
          else
            SRC="jaclang/compiler/kernels/${{ matrix.platform }}"
          fi
          mkdir -p "$GITHUB_WORKSPACE/.kernel"
          cp "$SRC"/*jac_compiler.* "$GITHUB_WORKSPACE/.kernel/"
          rm -f "$GITHUB_WORKSPACE/.kernel/"*.lock
          ls -la "$GITHUB_WORKSPACE/.kernel"

      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.platform }}
          path: .kernel/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

