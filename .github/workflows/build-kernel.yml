name: Build compiler kernels

# Builds the native compiler kernel for each named release platform on one
# class of x86 Linux runner and uploads it as the `kernel-<platform>` artifact
# of the calling run (#10219). The host kernel comes from stage 0 (the pinned
# previous release, stage0-kernel); for any other platform the host kernel
# then builds the target's in-process (`jac native build kernel@<platform>`):
# the kernel build takes the target's canonical triple, the in-process linkers
# write ELF and Mach-O for any target, and the kernel links no C archive of
# its target. A caller's build adopts the artifact with `zig build
# -Dkernel=DIR` (or setup-jac's `kernel-dir`), and the seal refuses a kernel
# whose unit sources, codegen, target or Python do not match the tree it
# seals.
#
# The driver's Python is never shipped, so the cache main seeds is safe for
# it on every channel.

on:
  workflow_call:
    inputs:
      platforms:
        description: "JSON array of release platforms (osarch), e.g. [\"linux-aarch64\", \"macos-aarch64\"]."
        required: true
        type: string
      ref:
        description: "Commit to build. Empty = the calling run's commit."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  kernel:
    name: kernel ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Fingerprint immutable build inputs
        id: inputs
        shell: bash
        run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

      # The kernel is a pure function of the compiler tree, the native shim's
      # inputs and the target, so a rerun of the same commit (or a dev-channel
      # build of an unchanged tree) reuses it. The leg's seal re-verifies the
      # kernel against the tree, so a restored kernel can only be refused,
      # never shipped stale.
      - name: Restore a kernel built from this tree
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: .kernel
          key: kernel-v3-${{ matrix.platform }}-${{ steps.inputs.outputs.kernel }}

      - name: Fetch the prebuilt host shim from the deps release
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        id: shim-fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIM_KEY: ${{ hashFiles('jac/native/**', 'jac/build.zig', 'jac/bootstrap/pins.json') }}
        run: |
          set -euo pipefail
          ASSET="libjacllvm-linux-x86_64-${SHIM_KEY}.so"
          mkdir -p .shim-fetch
          if gh release download deps --repo "$GITHUB_REPOSITORY" \
               --pattern "$ASSET" --pattern "$ASSET.sha256" \
               --dir .shim-fetch --clobber 2>/dev/null \
             && ( cd .shim-fetch && shasum -a 256 -c "$ASSET.sha256" ); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "file=$GITHUB_WORKSPACE/.shim-fetch/$ASSET" >> "$GITHUB_OUTPUT"
          else
            echo "No prebuilt shim $ASSET; building it from source."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      # The driver's Python is never shipped (it only runs the kernel build),
      # so the cache main seeds is safe on both channels here.
      - name: Restore cached source-built Python (driver only)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: jac/.python-build/cpython
          key: python-build-v4-cpython-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdkzig-libc-${{ steps.inputs.outputs.python_cpython }}
          restore-keys: |
            python-build-v4-cpython-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdkzig-libc-

      - name: Cache the Zig package store
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .zig-cache/p
          key: zig-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/build.zig.zon') }}
          restore-keys: |
            zig-pkgs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install host tools (zstd)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Set up Zig 0.16.0
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Fetch LLVM for the jacllvm shim
        if: steps.kernel-cache.outputs.cache-hit != 'true' && steps.shim-fetch.outputs.hit != 'true'
        working-directory: jac
        run: zig build fetch-llvm --summary all

      # A link-source (-Ddev) driver: it runs stages 2 and 3 of the host
      # kernel's bootstrap, then the target build.
      - name: Build the driver
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        working-directory: jac
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ "${{ steps.shim-fetch.outputs.hit }}" = "true" ]; then
            cp "${{ steps.shim-fetch.outputs.file }}" jaclang/compiler/backends/native/llvm/libjacllvm.so
            zig build adopt-shim --summary all
          fi
          zig build -Ddev --summary all
          zig build fetch-typeshed --summary all
          if [ "${{ matrix.platform }}" = "linux-aarch64" ]; then
            zig build vendor-musl-linux-aarch64 --summary all
          fi

      - name: Build the host kernel from stage 0
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/stage0-kernel

      # The slot holds the extension module and its `.layout.json` and
      # `.record.json` beside it; the seal adopts all three.
      - name: Build the kernel for ${{ matrix.platform }}
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        working-directory: jac
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          BIN="$PWD/zig-out/bin/jac"
          if [ "$PLATFORM" = "linux-x86_64" ]; then
            SRC=jaclang/compiler/_kernel
          else
            "$BIN" native build "kernel@$PLATFORM"
            "$BIN" native status "kernel@$PLATFORM"
            SRC="jaclang/compiler/_kernel/$PLATFORM"
          fi
          compgen -G "$SRC/jac_kernel.*.record.json" >/dev/null || {
            echo "::error::no kernel record in $SRC"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/.kernel"
          cp "$SRC"/jac_kernel.* "$GITHUB_WORKSPACE/.kernel/"
          rm -f "$GITHUB_WORKSPACE/.kernel/"*.lock
          ls -la "$GITHUB_WORKSPACE/.kernel"

      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.platform }}
          path: .kernel/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

