name: Build JacPython objects

# Builds, on one class of x86 Linux runner, JacPython's native object, whose
# serial lowering runs 2.5-3x slower on the ARM and macOS runners, for each
# named release platform, as an artifact of the calling run:
# `jacpython-object-<platform>` (jacpython.o, its sha256, the sources it was
# lowered from, the generated modules lowered into it and manifest.json), from
# `zig build jacpython-object -Dtarget-platform=<platform>` (#10472). A build
# links it with `zig build -Djacpython-object=DIR` (or setup-jac's
# `prebuilt`) and does the native rest itself, and refuses an object lowered
# for another target or from other sources, tools or headers.
#
# The build is not host-specific: lowering takes the target's canonical
# triple and JacPython's pyconfig.h is probed without a macOS SDK. It runs
# the checkout's own compiler on a linux-x86_64 JacPython runtime: the
# previous one main built, else the pinned seed (-Djacpython-host=auto).

on:
  workflow_call:
    inputs:
      platforms:
        description: "JSON array of release platforms (osarch), e.g. [\"linux-aarch64\", \"macos-aarch64\"]."
        required: true
        type: string
      ref:
        description: "Commit to build. Empty = the calling run's commit."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }} ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
        artifact: [jacpython-object]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Fingerprint immutable build inputs
        id: inputs
        run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

      # Each artifact is a pure function of its sources, the compiler and
      # tools that lower them and the target, so a rerun of the same commit
      # reuses it. The adopting build re-verifies it against its own tree, so
      # a restored one can only be refused, never used stale.
      - name: Restore a ${{ matrix.artifact }} built from this tree
        id: cache
        uses: actions/cache@v4
        with:
          path: .${{ matrix.artifact }}
          key: ${{ matrix.artifact }}-v2-${{ matrix.platform }}-${{ steps.inputs.outputs.jacpython_object }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/lowering-host
        with:
          python-key: ${{ steps.inputs.outputs.python }}

      - name: Build the ${{ matrix.artifact }} for ${{ matrix.platform }}
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: jac
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          ARTIFACT: ${{ matrix.artifact }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.$ARTIFACT"
          rm -rf "$OUT"
          zig build jacpython-object -Dtarget-platform="$PLATFORM" --summary all
          cp -r ".python-build/jacpython/$PLATFORM.object" "$OUT"
          ls -la "$OUT"

      # What the adopting build checks first, checked here so a bad object
      # fails the job that made it rather than every leg.
      - name: Check the object
        if: matrix.artifact == 'jacpython-object'
        working-directory: .jacpython-object
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for f in jacpython.o sha256 sources manifest.json; do
            [ -s "$f" ] || { echo "::error::the object directory has no $f"; exit 1; }
          done
          [ "$(sha256sum jacpython.o | cut -d' ' -f1)" = "$(tr -d ' \r\n' < sha256)" ] || {
            echo "::error::jacpython.o does not match its sha256"; exit 1; }
          [ "$(jq -r .platform manifest.json)" = "$PLATFORM" ] || {
            echo "::error::the object was lowered for $(jq -r .platform manifest.json), not $PLATFORM"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.platform }}
          path: .${{ matrix.artifact }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
