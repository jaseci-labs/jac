name: Build compiler kernels and JacPython objects

# Builds, on one class of x86 Linux runner, the two native artifacts whose
# build is serial lowering that runs 2.5-3x slower on the ARM and macOS
# runners, for each named release platform, as artifacts of the calling run:
#
#   - `jacpython-object-<platform>`: JacPython's native object (jacpython.o,
#     its sha256, the sources it was lowered from, the generated modules
#     lowered into it and manifest.json), from `zig build jacpython-object
#     -Dtarget-platform=<platform>` (#10472). A build links it with
#     `zig build -Djacpython-object=DIR` (or setup-jac's `prebuilt`) and does
#     the native rest itself, and refuses an object lowered for another target
#     or from other sources, tools or headers.
#   - `kernel-<platform>`: the native compiler kernel (#10219). A build adopts
#     it with `zig build -Dkernel=DIR` (or setup-jac's `prebuilt`), and the
#     seal refuses a kernel whose unit sources, codegen, compiler, target or
#     Python do not match the tree it seals.
#
# Neither build is host-specific: lowering takes the target's canonical
# triple, the in-process linkers write ELF and Mach-O for any target, neither
# artifact links a C archive of its target, and JacPython's pyconfig.h is
# probed without a macOS SDK.
#
# Both run the checkout's own compiler on a linux-x86_64 JacPython runtime:
# the previous one main built, else the pinned seed (-Djacpython-host=auto).
# The kernel's link-source driver (`zig build -Ddev`) bundles that runtime but
# is never shipped, and a kernel records only its Python version, so the
# driver reuses the runtime main last built whenever the sources it was
# lowered from are unchanged.

on:
  workflow_call:
    inputs:
      platforms:
        description: "JSON array of release platforms (osarch), e.g. [\"linux-aarch64\", \"macos-aarch64\"]."
        required: true
        type: string
      ref:
        description: "Commit to build. Empty = the calling run's commit."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }} ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
        artifact: [jacpython-object, kernel]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Fingerprint immutable build inputs
        id: inputs
        run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

      # Each artifact is a pure function of its sources, the compiler and
      # tools that lower them and the target, so a rerun of the same commit
      # reuses it. The adopting build re-verifies it against its own tree, so
      # a restored one can only be refused, never used stale.
      - name: Restore a ${{ matrix.artifact }} built from this tree
        id: cache
        uses: actions/cache@v4
        with:
          path: .${{ matrix.artifact }}
          key: ${{ matrix.artifact }}-v2-${{ matrix.platform }}-${{ matrix.artifact == 'kernel' && steps.inputs.outputs.kernel || steps.inputs.outputs.jacpython_object }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/lowering-host
        with:
          python-key: ${{ steps.inputs.outputs.python }}

      - name: Build the ${{ matrix.artifact }} for ${{ matrix.platform }}
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: jac
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          ARTIFACT: ${{ matrix.artifact }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.$ARTIFACT"
          rm -rf "$OUT"
          if [ "$ARTIFACT" = jacpython-object ]; then
            zig build jacpython-object -Dtarget-platform="$PLATFORM" --summary all
            cp -r ".python-build/jacpython/$PLATFORM.object" "$OUT"
          else
            # A link-source driver: the payload carries no compiler of its own
            # and runs this checkout's, which builds the kernel.
            zig build -Ddev -Dreuse-python=true --summary all
            zig build fetch-typeshed --summary all
            [ "$PLATFORM" != linux-aarch64 ] || zig build vendor-musl-linux-aarch64 --summary all
            # --exact records the compiler's full digest, which the seal's
            # payload tree reproduces; the seal refuses a dev build's.
            zig-out/bin/jac native build "kernel@$PLATFORM" --exact
            zig-out/bin/jac native status "kernel@$PLATFORM"
            SRC=jaclang/compiler
            [ "$PLATFORM" = linux-x86_64 ] || SRC="jaclang/compiler/kernels/$PLATFORM"
            mkdir -p "$OUT"
            cp "$SRC"/*jac_compiler.* "$OUT/"
            rm -f "$OUT"/*.lock
          fi
          ls -la "$OUT"

      # What the adopting build checks first, checked here so a bad object
      # fails the job that made it rather than every leg.
      - name: Check the object
        if: matrix.artifact == 'jacpython-object'
        working-directory: .jacpython-object
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for f in jacpython.o sha256 sources manifest.json; do
            [ -s "$f" ] || { echo "::error::the object directory has no $f"; exit 1; }
          done
          [ "$(sha256sum jacpython.o | cut -d' ' -f1)" = "$(tr -d ' \r\n' < sha256)" ] || {
            echo "::error::jacpython.o does not match its sha256"; exit 1; }
          [ "$(jq -r .platform manifest.json)" = "$PLATFORM" ] || {
            echo "::error::the object was lowered for $(jq -r .platform manifest.json), not $PLATFORM"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.platform }}
          path: .${{ matrix.artifact }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
