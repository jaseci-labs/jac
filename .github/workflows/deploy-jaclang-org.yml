name: Deploy jaclang.org

# Deploys jac/examples/jaclang_org to https://jaclang.org whenever the site
# changes on main. It runs the site's own `jac scale deploy` against the live
# namespace on production-cluster, with the production settings in
# .github/jaclang_org/deploy.toml appended to a copy of the site's jac.toml.
#
# The site's [project] jac-version pin picks the jac release for this runner
# and for the pods, so bumping the pin is what moves jaclang.org, and the docs
# it bundles at /docs/latest, to a new release. A release PR's pin bump lands
# on main well before Release publishes that version's binary and image, so
# its push run stands down and the finished Release run deploys it instead.
#
# Editing this workflow does not deploy. To deploy without a site change, run
# it from the Actions tab; tick dry_run to render the plan and apply nothing.

on:
  push:
    branches: [main]
    paths:
      - "jac/examples/jaclang_org/**"
      - ".github/jaclang_org/**"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the deploy plan only; apply nothing"
        type: boolean
        default: false

# One deploy at a time. A push that lands mid-deploy waits, and only the newest
# waiting run is kept, so a burst of merges ends on main's latest tree.
concurrency:
  group: deploy-jaclang-org
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC into AWS for the EKS credentials

env:
  SITE_DIR: jac/examples/jaclang_org
  SITE_URL: https://jaclang.org
  CLUSTER: production-cluster
  NAMESPACE: jb-70d63706-jaclang-website
  AWS_REGION: us-east-2

jobs:
  resolve:
    if: >-
      github.repository == 'jaseci-labs/jac' && (
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pin: ${{ steps.pin.outputs.pin }}
      ready: ${{ steps.pin.outputs.ready }}
    steps:
      - uses: actions/checkout@v5

      # A Release run deploys only when it is the run that published the pin,
      # whether a merged release PR or a hand-run publish started it.
      - name: Read the pin and check its release is out
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          pin=$(sed -n 's/^jac-version = "==\([0-9][0-9.]*\)"$/\1/p' "$SITE_DIR/jac.toml")
          if [ -z "$pin" ]; then
            echo "::error file=$SITE_DIR/jac.toml::jaclang.org deploys need an exact pin: jac-version = \"==X.Y.Z\""
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          published=$(gh release view "v$pin" --repo jaseci-labs/jac --json isDraft,publishedAt \
            --jq 'select(.isDraft | not) | .publishedAt' 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            if [ -n "$published" ] && [[ ! "$published" < "$RUN_STARTED" ]]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::This Release run did not publish jac v$pin; nothing to deploy."
              echo "ready=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ -n "$published" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::notice::jac v$pin is not published yet; the Release run deploys it when it finishes."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::jac v$pin has no published release to deploy."
            exit 1
          fi

  deploy:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: jaclang-org
      url: https://jaclang.org
    steps:
      - uses: actions/checkout@v5

      # [dev] would point the pods at the rolling dev image and ignore the pin,
      # so the deploy copy drops it. The copy lives outside the checkout, the
      # same layout the hand deploys used.
      - name: Stage the deploy copy
        id: stage
        run: |
          stage="$RUNNER_TEMP/jaclang_org"
          cp -R "$SITE_DIR" "$stage"
          awk '/^\[/ { skip = ($0 == "[dev]") } !skip' "$SITE_DIR/jac.toml" > "$stage/jac.toml"
          cat .github/jaclang_org/deploy.toml >> "$stage/jac.toml"
          echo "dir=$stage" >> "$GITHUB_OUTPUT"

      - name: Install jac ${{ needs.resolve.outputs.pin }}
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ needs.resolve.outputs.pin }}
        run: |
          mkdir -p "$HOME/.local/bin" && cd "$RUNNER_TEMP"
          gh release download "v$PIN" --repo jaseci-labs/jac \
            --pattern "jac-$PIN-linux-x86_64" --pattern "jac-$PIN-linux-x86_64.sha256"
          sha256sum -c "jac-$PIN-linux-x86_64.sha256"
          install -m 0755 "jac-$PIN-linux-x86_64" "$HOME/.local/bin/jac"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jac" --version

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::776241927220:role/GitHubActionsJaseciDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # deploy.toml names the kube context, so the alias must match it.
      - name: Connect kubectl
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION" --alias "$CLUSTER"
          kubectl -n "$NAMESPACE" get deploy

      - name: Install the site's dependencies
        working-directory: ${{ steps.stage.outputs.dir }}
        run: jac install

      - name: Plan
        working-directory: ${{ steps.stage.outputs.dir }}
        run: jac scale deploy web --target kubernetes --dry-run

      # A rollout undo restores pods, not rows. Keeps the newest 10 CI dumps
      # on the database volume, beside any taken by hand. The dump shares the
      # volume with the live data, so it needs room for twice the database and
      # a failed dump is deleted rather than left to fill the disk.
      - name: Back up the database
        if: ${{ !inputs.dry_run }}
        run: |
          name="ci-$(date -u +%Y%m%dT%H%MZ)-${GITHUB_SHA::10}.dump"
          kubectl -n "$NAMESPACE" exec jaclang-website-postgres-0 -c postgres -- sh -ec '
            export PGPASSWORD="$POSTGRES_PASSWORD"
            dir=/var/lib/jac/pgdata/backups
            mkdir -p "$dir"
            ls -1t "$dir"/ci-*.dump 2>/dev/null | tail -n +10 | xargs -r rm -f
            size=$(psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select pg_database_size(current_database())")
            free=$(df -Pk "$dir" | awk "NR == 2 { print \$4 * 1024 }")
            echo "database $size bytes, volume free $free bytes"
            case "$size" in ""|*[!0-9]*) echo "Could not read the database size." >&2; exit 1 ;; esac
            case "$free" in ""|*[!0-9]*) echo "Could not read the volume free space." >&2; exit 1 ;; esac
            if [ "$free" -lt $((size * 2)) ]; then
              echo "Not enough room on the database volume for a backup; free some or grow it." >&2
              exit 1
            fi
            pg_dump -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$dir/$1" || { rm -f "$dir/$1"; exit 1; }
            ls -la "$dir/$1"
          ' sh "$name"

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ steps.stage.outputs.dir }}
        run: jac scale deploy web --target kubernetes

      - name: Wait for the rollout
        if: ${{ !inputs.dry_run }}
        env:
          PIN: ${{ needs.resolve.outputs.pin }}
        run: |
          for d in $(kubectl -n "$NAMESPACE" get deploy -l 'jac-scale.role in (gateway,microservice)' -o name); do
            kubectl -n "$NAMESPACE" rollout status "$d" --timeout=15m
          done
          kubectl -n "$NAMESPACE" get deploy
          kubectl -n "$NAMESPACE" exec deploy/web-deployment -c web -- jac --version | tee /dev/stderr | grep -qF "jac $PIN "

      # The site re-ingests the docs bundled with its jac when that version
      # changes, so /docs/latest should name the pin's release once it is up.
      - name: Check the live site
        if: ${{ !inputs.dry_run }}
        env:
          PIN: ${{ needs.resolve.outputs.pin }}
        run: |
          failed=0
          for path in / /docs/latest /jacyac /install.sh; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 "$SITE_URL$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || failed=1
          done
          want="v${PIN%.*}"
          for _ in $(seq 60); do
            got=$(curl -s --max-time 30 -X POST -H 'Content-Type: application/json' -d '{}' \
              "$SITE_URL/function/docs_status" | jq -r '.data.result.latest_label // empty' 2>/dev/null || true)
            [ "$got" = "$want" ] && break
            sleep 15
          done
          echo "docs latest: ${got:-none} (want $want)"
          [ "$got" = "$want" ] || failed=1
          echo "Deployed \`${GITHUB_SHA::10}\` on jac $PIN; /docs/latest is ${got:-unknown}." >> "$GITHUB_STEP_SUMMARY"
          exit $failed

      - name: Show the namespace on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get deploy,pods -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true
          echo "To roll the pods back: kubectl -n $NAMESPACE rollout undo deploy/<name> for each deployment above."
