name: Release

# The release lifecycle in one workflow:
#   - action=create-pr (dispatch): bump versions and open the release PR.
#   - merge of a release/* PR (or action=publish): tag, cut a DRAFT Release,
#     attach every native binary (build-binaries.yml), then publish as latest --
#     so "Latest" never appears mid-build with assets missing.
#   - action=create-github-release (dispatch): recovery -- cut a bare Release
#     for an existing version; binaries attach via the release.published event.
# jaclang ships as the native `jac` binary, not PyPI.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: publish
        options: [publish, create-pr, create-github-release]
      jaclang:
        description: "[create-pr] jaclang bump (the native binary / release anchor)"
        type: choice
        default: skip
        options: [skip, patch, minor, major]
      version:
        description: "[create-github-release] version (reads jac.toml if empty)"
        required: false
        type: string

permissions: {}

jobs:
  create-release-pr:
    if: >-
      github.repository == 'jaseci-labs/jac' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'create-pr'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      # Run the release scripts with the published compiler. The root jac.toml
      # otherwise reroutes the installed binary to this checkout's jaclang.
      JAC_NO_DEV_SOURCE: "1"
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      # PR preparation only needs a released Jac runtime, not a source build.
      - name: Install released jac binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate version bump
        run: |
          jac run scripts/validate_release.jac \
            --jaclang "${{ inputs.jaclang }}"

      - name: Bump versions
        id: release
        run: |
          jac run scripts/release.jac \
            --jaclang "${{ inputs.jaclang }}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch and commit
        env:
          BRANCH_NAME: ${{ steps.release.outputs.branch_name }}
          MODIFIED_FILES: ${{ steps.release.outputs.modified_files }}
          PR_TITLE: ${{ steps.release.outputs.pr_title }}
        run: |
          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "$PR_TITLE"
          git push origin "$BRANCH_NAME"

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ steps.release.outputs.pr_title }}
          PR_BODY: ${{ steps.release.outputs.pr_body }}
          BRANCH_NAME: ${{ steps.release.outputs.branch_name }}
        run: |
          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME")
          echo "::notice::Release PR created: $PR_URL"

          # GITHUB_TOKEN-authored PRs never trigger CI (GitHub anti-recursion):
          # a maintainer must close & reopen the PR to attach checks. See
          # CONTRIBUTING.md "Release Flow".
          echo "::notice::Close & reopen this PR to run its checks, then enable auto-merge (see CONTRIBUTING.md)"

  resolve:
    if: |
      github.repository == 'jaseci-labs/jac' && (
        (github.event_name == 'workflow_dispatch' && inputs.action == 'publish') || (
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          startsWith(github.event.pull_request.head.ref, 'release/')
        )
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      summary: ${{ steps.ver.outputs.summary }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Every later job anchors on this sha, so it has to be the commit that
      # was actually approved -- and on the PR path the obvious answer is the
      # wrong one. GITHUB_SHA there is the base branch resolved when the RUN
      # was created, not the commit this PR produced: any merge landing in
      # between silently retargets the release onto someone else's work. The
      # pull_request payload's merge_commit_sha is this PR's own landed commit
      # (the merge, squash or rebase commit on main, since we only run on
      # merged == true), and it cannot drift. On workflow_dispatch there is no
      # PR and GITHUB_SHA is the dispatched ref's commit, which is exactly the
      # tree being released.
      - name: Resolve the commit being released
        id: commit
        env:
          EVENT: ${{ github.event_name }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            SHA="$MERGE_COMMIT_SHA"
          else
            SHA="$GITHUB_SHA"
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve the commit being released (event=${EVENT}, got '${SHA}'); refusing to tag or build an unidentified tree."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing commit: $SHA"

      # Pinned to the resolved commit, not to whatever the trigger's ref points
      # at now: the version below has to be the one that commit declares.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      # The root jac.toml is the source of truth for the jaclang version.
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' jac.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from jac.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "summary=jac $VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $VERSION"

  # Human approval gate (release-approval environment required reviewers).
  approve:
    needs: resolve
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release-approval
    timeout-minutes: 60
    steps:
      # Fail closed: a nonexistent environment is auto-created with NO
      # protection rules, so verify required reviewers actually exist.
      - name: Verify the gate has required reviewers
        run: |
          set -euo pipefail
          rules="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/release-approval" \
            | jq '[.protection_rules[]? | select(.type=="required_reviewers")] | length')"
          if [ "${rules:-0}" -eq 0 ]; then
            echo "::error::The release-approval environment has no required reviewers configured; refusing to release without a human gate. Configure reviewers on the environment (Settings -> Environments) and re-run."
            exit 1
          fi
          echo "release-approval has required reviewers; gate is real."

      - name: Approval granted
        env:
          SUMMARY: ${{ needs.resolve.outputs.summary }}
        run: |
          echo "Release approved: $SUMMARY"

  # Idempotent tag + Release so a recovery re-run converges.
  tag-and-release:
    needs: [resolve, approve]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # SHA-pinned: contents:write + persisted credentials push the release tag.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Never move an existing tag: a published release's assets and notes
      # describe the commit it was cut from. So a version whose tag already
      # names another commit is refused outright rather than quietly released
      # from the old one (#8793). See scripts/release_tag_guard.sh.
      - name: Create and push tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.sha }}
        run: bash scripts/release_tag_guard.sh "$VERSION" "$COMMIT"

      # Draft: hidden from /releases/latest with no downloadable assets, so
      # install.sh can't resolve it until `publish` reveals it complete. NOT
      # --latest here. Recovery re-runs only refresh notes: never revert a
      # published release to draft.
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SUMMARY: ${{ needs.resolve.outputs.summary }}
        run: |
          set -euo pipefail
          VTAG="v${VERSION}"

          {
            echo "## jac ${VERSION} (native \`jac\` binary)"
            echo ""
            echo "Install: \`curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh | bash\`"
          } > release_notes.md

          if gh release view "$VTAG" >/dev/null 2>&1; then
            echo "Release $VTAG exists; refreshing notes (leaving draft/latest state untouched)."
            gh release edit "$VTAG" \
              --verify-tag \
              --title "Release: $SUMMARY" \
              --notes-file release_notes.md
          else
            echo "Creating draft release $VTAG."
            gh release create "$VTAG" \
              --draft \
              --verify-tag \
              --title "Release: $SUMMARY" \
              --notes-file release_notes.md
          fi

  # Invoked directly (not via release.published: GITHUB_TOKEN can't fire that
  # event into another workflow).
  build-binaries:
    needs: [resolve, tag-and-release]
    permissions:
      contents: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      tag: v${{ needs.resolve.outputs.version }}
      # The tag is only the upload target. What gets BUILT is named by sha, so
      # the artifacts provably correspond to the approved commit even if the
      # tag is ever repointed or predates this release (#8793).
      commit: ${{ needs.resolve.outputs.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Reveal draft as published + latest once every required asset is attached.
  # `needs: build-binaries` waits for the whole build; the guard then checks the
  # draft actually holds what that build was obliged to produce, since a leg
  # marked non-blocking can succeed without shipping a binary. GITHUB_TOKEN
  # publish emits no release.published, so no re-trigger.
  publish:
    needs: [resolve, tag-and-release, build-binaries]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Pinned to the approved commit, like every other job here: the guard
      # this step runs has to be the one that commit ships.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      # The platform list is not restated here. It arrives from
      # build-binaries.yml's `plan` job, which derives it from the same array
      # the build matrix comes from, so what gets verified is exactly what the
      # release was obliged to build. See scripts/release_publish_guard.sh.
      - name: Verify the required assets are attached, then publish as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REQUIRED: ${{ needs.build-binaries.outputs.required_platforms }}
        run: |
          set -euo pipefail
          read -r -a required <<<"$REQUIRED"
          bash scripts/release_publish_guard.sh "$VERSION" "${required[@]}"

  # install.sh's real `curl | bash` path is verified out-of-band -- nightly.yml
  # `installer-live` and ci.yml `installer-test` -- not as a blocking release
  # gate: install.sh queries the GitHub API unauthenticated, and on shared macOS
  # runners the anon rate limit routinely trips, which would fail a release
  # whose assets uploaded fine.

  summary:
    needs: [resolve, tag-and-release, build-binaries, publish]
    if: always() && needs.resolve.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Release summary
        env:
          SUMMARY: ${{ needs.resolve.outputs.summary }}
          RELEASE: ${{ needs.tag-and-release.result }}
          BINARIES: ${{ needs.build-binaries.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          {
            echo "## Release: $SUMMARY"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Draft tag + Release | $RELEASE |"
            echo "| Native binaries | $BINARIES |"
            echo "| Publish (draft -> latest) | $PUBLISH |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE" != "success" ] || [ "$BINARIES" != "success" ] \
             || [ "$PUBLISH" != "success" ]; then
            echo "::error::Release did not complete (draft/release: $RELEASE, binaries: $BINARIES, publish: $PUBLISH)"
            exit 1
          fi

  # Recovery: cut a bare GitHub Release for an existing version. Binaries
  # attach via the release.published event (real-user token fires it).
  create-github-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'create-github-release'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(grep -m1 '^version' jac.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Jac v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest
          echo "Created release v${{ steps.version.outputs.version }}"

      - name: Summary
        run: |
          echo "## Release v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "Release already existed — no action taken." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitHub Release created. The native \`jac\` binary build is triggered by the release-publish event (build-binaries.yml)." >> "$GITHUB_STEP_SUMMARY"
          fi
