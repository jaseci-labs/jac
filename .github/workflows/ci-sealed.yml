name: CI (sealed)

# The sealed, release-shaped kit and the lanes that need it. `build-kit`
# builds the binary from this checkout and publishes `jac-kit` (the binary and
# its floors) and `jac-precompiled` (the JIR tree its payload was built from);
# the lanes below run through that sealed binary, so the compiler under test is
# the one a release would ship. Pull requests and pushes test on the dev kit
# (ci.yml); these lanes run:
#   - every 6 hours on main (schedule),
#   - on demand (Actions > CI (sealed) > Run workflow),
#   - in the daily release rehearsal (release-rehearsal.yml calls this
#     workflow, so a failure here keeps main's `release-rehearsal` check red),
#   - on a pull request carrying the `ci:sealed` label: ci.yml calls this
#     workflow, so its result gates that PR's Everything Passed.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  workflow_call:

concurrency:
  group: ci-sealed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  build-kit:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:sealed') }}
    # The compiler runs from the bytecode the same build precompiles.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The runner label fixes the vCPU count, not the hardware behind it, and
      # build times swing about 2x between hosts. Recording the host lets a
      # slow kit be told apart from a slow change.
      - name: Record the runner hardware
        run: |
          {
            echo "### build-kit runner"
            echo '```'
            echo "vcpus: $(nproc)"
            lscpu | grep -E '^(Model name|CPU family|Model:|BogoMIPS|CPU max MHz|CPU MHz|L3 cache|Thread\(s\) per core)' || true
            free -g | awk '/^Mem:/ {print "memory_gb: total " $2 ", available " $7}'
            echo "load_avg: $(cut -d' ' -f1-3 /proc/loadavg)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the jac binary (cached)
        uses: ./.github/actions/setup-jac
        with:
          # This job runs `zig build` steps below, which go through the
          # source-built interpreter and its native compiler object. A binary
          # cache hit skips producing both, so ask for them explicitly.
          need-build-inputs: "true"
          bytecode-kit: "true"

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      # Both restores above can miss independently of the binary cache, and the
      # steps below cannot build the shim themselves (they only consume it).
      - name: Ensure the LLVMPY shim is present
        working-directory: jac
        run: |
          set -euo pipefail
          if ls jaclang/compiler/backends/native/llvm/libjacllvm.* >/dev/null 2>&1; then
            exit 0
          fi
          zig build fetch-llvm --summary all
          zig build jacllvm --summary all

      # Explicit: a binary-cache hit skips zig build, so these gitignored
      # trees must be materialized either way. The wasm floor is in this list
      # for the same reason as the rest: a full build writes it as a side effect, a
      # cache hit does not, so leaving it implicit made the kit's contents a
      # function of cache state -- present on a miss, missing on a hit, with
      # if-no-files-found blind to it because the other paths matched.
      - name: Materialize typeshed + vendored runtimes
        working-directory: jac
        run: |
          zig build fetch-typeshed --summary all
          zig build vendor-musl --summary all
          zig build vendor-musl-linux-aarch64 --summary all
          zig build vendor-wasm-libc --summary all

      - name: Hermeticity + smoke (no system Python)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          # Outside the checkout: its jac.toml would reroute the binary to
          # this tree's compiler source.
          WORK="$(mktemp -d)"; cd "$WORK"
          ldd "$BIN" || true
          ! ldd "$BIN" | grep -qi python
          # The bundled runtime is the pinned prebuilt CPython 3.14.
          "$BIN" -c 'import sys; assert sys.implementation.name == "cpython", sys.implementation; assert sys.version_info[:2] == (3, 14), sys.version'
          # The kit carries every artifact a release does.
          "$BIN" native status
          "$BIN" native status --require kit
          printf 'obj P { has x:int=0; def sq->int { return self.x*self.x; } }\nwith entry { print(P(x=7).sq()); }\n' > "$WORK/obj.jac"
          env -i HOME="$WORK" PATH=/usr/bin:/bin "$BIN" --version
          env -i HOME="$WORK" PATH=/usr/bin:/bin "$BIN" -c 'import os, ssl; assert os.path.isfile(os.environ["SSL_CERT_FILE"]); assert ssl.create_default_context().cert_store_stats()["x509_ca"] > 0'
          out="$(env -i HOME="$WORK" PATH=/usr/bin:/bin "$BIN" run "$WORK/obj.jac")"
          grep -q 49 <<<"$out"

      - name: Run real jac programs (end-to-end execution)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          WORK="$(mktemp -d)"; cd "$WORK"
          cat > a.jac <<'JAC'
          obj Point { has x: int; has y: int; def dist -> float { return (self.x*self.x + self.y*self.y) ** 0.5; } }
          with entry {
              p = Point(x=3, y=4);
              print("dist", p.dist());
              print([i*i for i in range(5)]);
          }
          JAC
          out="$(env -i HOME="$WORK" PATH=/usr/bin:/bin "$BIN" run "$WORK/a.jac")"
          grep -q "dist 5.0" <<<"$out"
          grep -q "0, 1, 4, 9, 16" <<<"$out"

      - name: jac test runner (self-contained test file)
        working-directory: jac
        run: |
          set -euxo pipefail
          BIN="$PWD/zig-out/bin/jac"
          WORK="$(mktemp -d)"; cd "$WORK"
          cat > "$WORK/test_smoke.jac" <<'JAC'
          test "arithmetic" { assert 6 * 7 == 42; }
          test "comprehension" { assert [i for i in range(3)] == [0, 1, 2]; }
          test "strings" { assert "ja" + "c" == "jac"; }
          JAC
          env -i HOME="$WORK" PATH=/usr/bin:/bin JAC_TEST_JOBS=0 "$BIN" test "$WORK/test_smoke.jac"

      # if-no-files-found only fires when NO path matches, so a single missing
      # tree ships a quietly incomplete kit to every consumer. Assert each one.
      - name: Verify the kit is complete
        working-directory: jac
        run: |
          set -euo pipefail
          for p in zig-out/bin/jac jaclang/vendor/typeshed/stdlib \
                   .pbs-build/linux-x86_64/musl/lib \
                   .pbs-build/linux-aarch64/musl/lib \
                   .pbs-build/wasm32/libc; do
            [ -e "$p" ] || { echo "::error::kit is missing $p"; exit 1; }
          done

      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: jac-kit
          path: |
            jac/zig-out/bin/jac
            jac/jaclang/vendor/typeshed/stdlib
            jac/.pbs-build/linux-x86_64/musl/lib
            jac/.pbs-build/linux-aarch64/musl/lib
            jac/.pbs-build/wasm32/libc
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # The one precompile of this code version. Either `zig build` just
      # produced it (binary-cache miss) or it was restored in lockstep with the
      # binary it belongs to -- setup-jac keys the two together for exactly this
      # reason. Every reroute lane requires this tree to serve every unit and
      # recompiles nothing.
      - name: Verify the precompile bundle is complete
        working-directory: jac
        run: |
          set -euo pipefail
          DIR="$(find .precompiled-build/cpython -maxdepth 1 -type d -name 'cpython-*' | head -1)"
          [ -n "$DIR" ] || { echo "::error::no .precompiled-build/cpython/cpython-<ver> tree"; exit 1; }
          [ -f .precompiled-build/cpython/MANIFEST.json ] || {
            echo "::error::precompile tree has no MANIFEST.json, so the seal did not finish"; exit 1; }
          UNITS="$(find "$DIR" -name '*.jir' | wc -l | tr -d ' ')"
          [ "$UNITS" -ge 400 ] || { echo "::error::precompile tree has only $UNITS units"; exit 1; }
          echo "precompile bundle: $UNITS units in $DIR"

      - name: Upload the precompile bundle
        uses: actions/upload-artifact@v4
        with:
          name: jac-precompiled
          path: jac/.precompiled-build/cpython
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # In-package tests that do not pass through the reroute, run here against
  # the built kit. Each entry names a real divergence between the reroute and
  # the sealed payload, not a CI quirk; the job should shrink to nothing as
  # they are fixed.
  #
  # - byllm/tests/test_mtir_integration.jac: "submodule MTIR keyed by import
  #   fullname" finds an empty mtir_map under the reroute; with the native
  #   pipeline off, two more MTIR tests fail. Registration is tied to the
  #   codegen path.
  # - scale/tests/server/test_serve.jac, the HMR test: a walker:pub added
  #   after start is listed in /openapi.json but POSTs 401. The access table
  #   is rebuilt from Jac.program.find_module(), which returns the pre-reload
  #   tree when the module was compiled in-process; the sealed lane never
  #   has one and recompiles. Fails the same way with the native pipeline
  #   off.
  test-in-package-sealed:
    needs: build-kit
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:sealed') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/jac-kit
        with:
          sealed: "true"
      - name: Install the scale and byllm deps these files import
        run: |
          jac install \
            "python-dotenv>=1.2.1,<2.0.0" \
            "prometheus-client>=0.21.0,<1.0.0" \
            "opentelemetry-sdk>=1.27.0,<2.0.0" \
            "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2.0.0" \
            "apscheduler>=3.11.2,<4.0.0" "kubernetes>=34.1.0,<35.0.0" \
            "docker>=7.1.0,<8.0.0" "boto3>=1.40.0,<2.0.0" \
            requests "moto[s3]>=5.0.0" \
            --global
          jac install \
            "litellm>=1.102.1,<1.103.0" "pillow>=12.0.0,<14.0.0" \
            "httpx>=0.27.0" "loguru>=0.7.2,<0.8.0" \
            --global
      # Run from a copy OUTSIDE the checkout. The resolver's self-tree rule
      # binds a `jaclang.*` import from any file inside a jaclang checkout to
      # that checkout, so run in place, a fixture's `jaclang.byllm.lib`
      # resolved to the checkout's copy and the sealed kit analyzed the
      # checkout's own compiler as project code: some 190 modules cold, two
      # identities for every compiler class, and errors the reroute lanes
      # never see. Copied out, the same import binds to the kit's bundle,
      # which is what "sealed" is meant to test. Cut off at five minutes: the
      # file takes 30 seconds, and the one time it did not (#8876) it took
      # the 4-vcpu runner down with it and uploaded no log, so a regression
      # fails the step, with its log, instead of the runner.
      - name: MTIR integration (byllm)
        env:
          JAC_TEST_RSS_LOG: "1"
          JAC_TEST_STRICT: "1"
        run: |
          set -o pipefail
          cp -r jac/jaclang/byllm/tests "$RUNNER_TEMP/byllm-tests"
          # The suite's archwire.jac fences it off from jaclang's graph inside
          # the checkout; copied out, it is ordinary code beside the package.
          rm "$RUNNER_TEMP/byllm-tests/archwire.jac"
          timeout --kill-after=30 300 jac test "$RUNNER_TEMP/byllm-tests/test_mtir_integration.jac"
      - name: HMR refresh (scale server)
        env:
          JAC_TEST_JOBS: "0"
        run: jac test jac/jaclang/scale/tests/server/test_serve.jac -f hmr

  # One job: both phases share one MicroK8s cluster (hostpath-storage binds
  # the RWX bundle PVC, which kind cannot). Stays on the sealed kit: the
  # failure-path leg ships the binary into the pods, and that must be the one
  # built from this checkout.
  test-scale-k8s:
    needs: build-kit
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:sealed') }}
    runs-on: ubuntu-24.04
    env:
      # The opt-in flag test_deploy_k8s gates on: this is the lane with a
      # cluster.
      JAC_TEST_K8S: "1"
      # Deploys look release assets up through the GitHub API, and a hosted
      # runner's shared IP exhausts the anonymous quota.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/jac-kit
        with:
          sealed: "true"
      - name: Install scale deploy deps
        run: |
          jac install \
            "python-dotenv>=1.2.1,<2.0.0" \
            "kubernetes>=34.1.0,<35.0.0" "docker>=7.1.0,<8.0.0" \
            --global
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Set up MicroK8s (RWX-capable hostpath storage)
        run: |
          set -euxo pipefail
          sudo snap install microk8s --classic --channel=1.31/stable
          sudo microk8s status --wait-ready
          sudo microk8s enable hostpath-storage dns
          sudo microk8s kubectl -n kube-system rollout status deploy/coredns --timeout=180s
          sudo microk8s kubectl -n kube-system rollout status deploy/hostpath-provisioner --timeout=180s || true
          mkdir -p "$HOME/.kube"
          sudo microk8s config > "$HOME/.kube/config"
          sudo chown "$(id -u):$(id -g)" "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl get storageclass
          kubectl get nodes -o wide
      - name: Install KEDA core + HTTP Add-on
        run: |
          set -euxo pipefail
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          helm install keda kedacore/keda --namespace keda --create-namespace --wait
          helm install http-add-on kedacore/keda-add-ons-http --namespace keda --wait
          kubectl get pods -n keda
      # The install step above hides a first deploy on a machine without the
      # client, so this runs each command on a fresh HOME.
      - name: Run first deploy without the client
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          first_run() {
            HOME="$(mktemp -d)" bash -c "jac install --global 'python-dotenv>=1.2.1,<2.0.0' && $1" 2>&1 | tee run.log
            grep -q "Deploy tooling missing" run.log
          }
          cd "$(mktemp -d)"
          printf '[project]\nname = "first"\nversion = "0.1.0"\nentry-point = "main"\n\n[scale.kubernetes]\napp_name = "first"\nnamespace = "first-deploy"\nbundle_storage_class = "microk8s-hostpath"\n' > jac.toml
          echo 'walker:pub hello { can go with Root entry { report "hi"; } }' > main.jac
          source "$GITHUB_WORKSPACE/jac/jaclang/scale/scripts/e2e_lib.sh"
          ship_checkout_binary "$PWD"
          first_run "jac scale deploy main.jac"
          first_run "echo y | jac scale destroy main.jac"
          test -z "$(kubectl get deploy -n first-deploy --no-headers 2>/dev/null)"
      - name: Run K8 tests (deploy-core)
        env:
          JAC_TEST_JOBS: "0"
        run: |
          jac test jac/jaclang/scale/tests/deploy/test_deploy_k8s.jac -x -f "not (early and exit)"
      # Runs the HTTP-activation e2e under an observer, so the 0 -> 1 -> ready
      # -> 0 cycle it already drives is also the cycle watch_scale_targets is
      # proven against. A second deploy would cost minutes for a cycle already
      # paid for.
      - name: Run KEDA HTTP-activation + observer e2e
        env:
          # The harness names this checkout's jac as the fixture's
          # [dev] pod_binary, so the pods run the code under test.
          # This lane's hostpath-storage addon is RWX-capable, but the bundle
          # PVC no longer trusts a cluster default silently; name it.
          BUNDLE_STORAGE_CLASS: microk8s-hostpath
        run: |
          bash jac/jaclang/scale/tests/deploy/keda_observer_real_e2e.sh \
            jac/jaclang/scale/tests/fixtures/keda_http_activation_e2e
      - name: Run K8 tests (failure-path)
        env:
          JAC_TEST_JOBS: "0"
        run: |
          jac test jac/jaclang/scale/tests/deploy/test_deploy_k8s.jac -x --test_name "early exit"

      # Destroy deletes namespaces and volumes, so what it reclaims and what it
      # spares is only decidable by an API server. Runs on every scale PR.
      - name: Run destroy reclamation e2e
        env:
          CLUSTER_TYPE: microk8s
        run: bash jac/jaclang/scale/tests/deploy/destroy_reclaim_real_e2e.sh

  # The CEF dispatch build + export/runpath/deps audit lives in the suite
  # (tests/client/test_cef_dispatch_build.jac, in test-client's lane).

  test-jac-pack-smoke:
    needs: build-kit
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:sealed') }}
    runs-on: ubuntu-24.04
    # actions: read lets the performance report list main's runs and download
    # their pack-smoke-performance artifacts for the wall-time comparison.
    permissions:
      contents: read
      actions: read
    env:
      JAC_CI_PERF: ${{ github.workspace }}/scripts/ci_perf.jac
      JAC_CI_PERF_POLICY: ${{ github.workspace }}/scripts/ci_perf.json
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/jac-kit
        with:
          sealed: "true"

      - name: Validate performance accounting
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/pack-smoke-performance"
          jac test scripts/ci_perf.jac

      # The kit is already sealed: build-kit ran the precompiler over this
      # tree (or restored the binary main sealed from this exact tree), so this
      # job validates the sealed artifact end to end instead of sealing it a
      # second time.
      - name: Verify cold start of the sealed binary
        run: |
          jac cache purge
          timeout 5 jac --version

      # The guide surface, plugin integration (pth finder / CLI dispatch /
      # admin server), and fixture checks live in the suite now
      # (tests/cli/test_guide_docs.jac, tests/cli/test_plugin_integration.jac);
      # this job keeps only what needs the sealed artifact and the outside
      # world: cold start and the in-tree site fullstack smoke. Source export
      # is exercised by test-jac-pack-eject through the same browser journey.
      - name: Install scale serve deps (for the site server)
        run: |
          jac install \
            "python-dotenv>=1.2.1,<2.0.0" \
            "requests>=2.32.0,<3.0.0" \
            --global

      - name: Validate the bundled Tiny JacYac workspace
        timeout-minutes: 5
        run: |
          jac create tiny --awetiny
          cd tiny
          jac check --nowarn

      # Fullstack smoke on the jaclang.org site, scaffolded the way the README
      # quickstart tells a user to. `jac create <name> --awesome` dumps the copy
      # of jac/examples/jaclang_org that the payload bundles beside the jaclang
      # package (awesome_template) and pulls its npm deps. Running the
      # scaffolded copy instead of the checkout is what exercises the bundling
      # step and the template resolver (the [dev] stanza is dropped, the
      # project is renamed); nothing else in CI runs that path. Because the
      # template ships inside the binary, the binary and the site it serves are
      # version-matched by construction, which is why the old happy-path lane
      # (released binary against main's clone) no longer had a quickstart to
      # validate. The lane is sealed, so the kit binary is what gets
      # validated, not a live-source reroute.
      - name: Scaffold the site (jac create --awesome; pulls npm deps)
        run: jac create site --awesome

      # `jac create` reports a failed dependency install as a next step, not a
      # non-zero exit, so check the scaffold before serving it: the failure
      # should name the quickstart step, not a missing module at bundle time.
      - name: Verify the scaffold came from the bundled template
        run: |
          test -f site/web.jac && test -f site/core/site/game/arena.jac \
            || { echo "::error::scaffold is missing the site's entry or the wasm game"; exit 1; }
          test -f site/desktop.jac \
            || { echo "::error::scaffold is missing the desktop app"; exit 1; }
          # Client npm deps live under the project's build dir (.jac/client),
          # not a top-level node_modules; that is where the vite bundler looks.
          test -d site/.jac/client/node_modules/vite \
            || { echo "::error::jac create did not pull the site's npm deps (no vite under site/.jac/client/node_modules)"; exit 1; }
          if grep -q '^\[dev\]' site/jac.toml; then
            echo "::error::the [dev] live-source stanza leaked into the scaffold"; exit 1
          fi
          grep -q '^name = "site"' site/jac.toml \
            || { echo "::error::the scaffold was not renamed to the project name"; exit 1; }
          cmp jac/examples/jaclang_org/core/site/assets/og-card.png site/core/site/assets/og-card.png \
            || { echo "::error::a binary asset did not survive the template round trip"; exit 1; }
          echo "scaffold matches the README quickstart"

      - name: Type check the site
        working-directory: site
        run: |
          hang=$(jq -er '.phases."site-check".hang_seconds' "$JAC_CI_PERF_POLICY")
          LC_ALL=C /usr/bin/time --quiet -o "$RUNNER_TEMP/pack-smoke-performance/site-check.time.json" \
            -f '{"wall_seconds":%e,"user_seconds":%U,"system_seconds":%S,"rss_kib":%M,"exit_code":%x}' \
            timeout --kill-after=5s "${hang}s" jac check

      # The site ships as a desktop app too (apps.desktop, backend jaclang.org):
      # the native engine needs WebKitGTK + a C toolchain to build libwebview,
      # patchelf for the $ORIGIN runpath, and a display to launch under.
      - name: Install desktop build deps
        timeout-minutes: 20
        run: |
          # Only Ubuntu's own repositories are needed. The runner's third-party
          # sources (Microsoft and others) can rate-limit an update into failure.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -delete
          # The runner's mirror list uses HTTP, which can be unreachable while
          # HTTPS works. Keep Ubuntu's signed repositories and refresh over IPv4.
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
                            /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://|https://|g' "$apt_source"
            fi
          done
          printf '%s\n' 'Acquire::ForceIPv4 "true";' 'APT::Update::Error-Mode "any";' \
            'Acquire::Retries "5";' 'Acquire::http::Timeout "60";' 'Acquire::https::Timeout "60";' \
            | sudo tee /etc/apt/apt.conf.d/99-jac-ci >/dev/null
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
              patchelf xvfb && exit 0
            echo "apt attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Build the desktop app
        working-directory: site
        run: |
          hang=$(jq -er '.phases."desktop-build".hang_seconds' "$JAC_CI_PERF_POLICY")
          LC_ALL=C /usr/bin/time --quiet -o "$RUNNER_TEMP/pack-smoke-performance/desktop-build.time.json" \
            -f '{"wall_seconds":%e,"user_seconds":%U,"system_seconds":%S,"rss_kib":%M,"exit_code":%x}' \
            timeout --kill-after=5s "${hang}s" jac build desktop

      - name: Desktop artifact audit
        working-directory: site
        run: |
          OUT=.jac/client/desktop/desktop
          test -x $OUT/jaclang || { echo "::error::no desktop binary"; exit 1; }
          test ! -f $OUT/app.jab || { echo "::error::remote desktop ships an unnecessary local app image"; exit 1; }
          test -f $OUT/dist/index.html || { echo "::error::no client bundle beside the binary"; exit 1; }
          test ! -d $OUT/sv || { echo "::error::loose sources shipped; the image is the program"; exit 1; }
          grep -q "https://jaclang.org" $OUT/dist/client.*.js \
            || { echo "::error::the bundle does not carry its remote backend"; exit 1; }

      # Launch under Xvfb: the host announces its loopback origin on stdout,
      # serves the bundle and the broker there, and answers no walker locally
      # because its backend is remote.
      - name: Desktop smoke (Xvfb)
        working-directory: site/.jac/client/desktop/desktop
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          DISPLAY=:99 GDK_BACKEND=x11 timeout 600s ./jaclang-launch.sh > /tmp/site-desktop.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 110); do
            grep -q "JAC_DESKTOP_SERVING" /tmp/site-desktop.log && break
            if ! kill -0 $APP_PID 2>/dev/null; then echo "::error::desktop app exited early"; cat /tmp/site-desktop.log; exit 1; fi
            sleep 5
          done
          ORIGIN=$(grep -o "JAC_DESKTOP_SERVING http://[^ ]*" /tmp/site-desktop.log | head -1 | cut -d' ' -f2)
          test -n "$ORIGIN" || { echo "::error::the desktop host never announced its origin"; cat /tmp/site-desktop.log; exit 1; }
          curl -fsS "${ORIGIN}__jac/health" | grep -q '"ok": true' || { echo "::error::broker health failed"; exit 1; }
          curl -fsS "$ORIGIN" | grep -q "The Jac Programming Language" || { echo "::error::the site index did not load"; exit 1; }
          curl -fsS "${ORIGIN}docs/getting-started" | grep -q "The Jac Programming Language" || { echo "::error::SPA fallback failed"; exit 1; }
          curl -fsS "${ORIGIN}static/assets/jac-logo.svg" | grep -q "<svg" || { echo "::error::the shared site assets are not served by the desktop host"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${ORIGIN}walker/doc_page" -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "404" ] || [ "$code" = "405" ] || { echo "::error::a remote-backend desktop app served a walker locally ($code)"; exit 1; }
          kill $APP_PID $XVFB_PID 2>/dev/null || true
          echo "desktop app serves the site on $ORIGIN"

      - name: Upload desktop logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-desktop-logs
          path: /tmp/site-desktop.log
          if-no-files-found: ignore

      # The docs section reads the corpus bundled with the jac binary under
      # test in-process (jaclang.cli.guide_store), so the docs journey stop is
      # hermetic with no extra setup.
      # The site is a workspace whose service apps colocate in the served
      # app's process by default. Exercise the exact quickstart, `jac run`, in the single
      # process serving stack. The fleet topology (`--fleet`: one local
      # process per service app behind the gateway) gets its own pass over
      # the same journey below.
      - name: Start the quickstart with bare jac run
        working-directory: site
        run: |
          cat /proc/uptime > "$RUNNER_TEMP/pack-smoke-performance/quickstart-ready.start"
          timeout 1200 jac run > /tmp/site-server.log 2>&1 &
          SERVER_PID=$!
          echo "SITE_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "site server starting with PID $SERVER_PID..."
          sleep 10
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server process died during startup"
            cat /tmp/site-server.log
            exit 1
          fi

      # Cold runner: embedded-postgres bootstrap plus the site's own compile
      # and client bundle all happen before the port answers. This step's
      # timeout is the hang ceiling; the elapsed time is compared with main.
      - name: Wait for site server to be ready
        timeout-minutes: 3
        run: |
          for i in $(seq 1 60); do
            if ! kill -0 ${{ env.SITE_PID }} 2>/dev/null; then
              echo "Server process exited unexpectedly"
              cat /tmp/site-server.log
              exit 1
            fi
            if curl -sf --max-time 10 http://localhost:8000 -o /dev/null 2>&1; then
              echo "site server is ready (attempt $i)"
              cat /proc/uptime > "$RUNNER_TEMP/pack-smoke-performance/quickstart-ready.ready"
              exit 0
            fi
            echo "Attempt $i/60: not ready, waiting 15s..."
            sleep 15
          done
          echo "Server failed to respond after 60 attempts"
          tail -100 /tmp/site-server.log
          exit 1

      - name: Verify site HTTP response
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://localhost:8000)
          echo "site root endpoint: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "site server responding correctly"
          else
            echo "Unexpected HTTP $HTTP_CODE"
            exit 1
          fi

      # @restspec routes only serve their payloads on the scale serving
      # stack; this is the lane that proves them.
      - name: Verify @restspec routes serve real payloads
        run: |
          curl -sf --max-time 30 http://localhost:8000/install.sh | head -1 | grep -q '^#!' \
            || { echo "::error::/install.sh did not serve a shell script"; exit 1; }
          curl -sf --max-time 30 http://localhost:8000/llms.txt | head -1 | grep -qi 'jac' \
            || { echo "::error::/llms.txt did not serve the llms corpus"; exit 1; }
          echo "install.sh and llms.txt serve their payloads"

      - name: Ensure a Chromium binary for jac browse
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "found browser: $c"
              exit 0
            fi
          done
          sudo apt-get update && sudo apt-get install -y chromium-browser

      # Drive every page and fullstack flow with jac browse: landing content,
      # live-source windows, the leaderboard shell, the whole socialize
      # journey (signup, post, trending, like, comment, channels, reload
      # persistence), docs served from this checkout, the 404 page, and a
      # final console-error sweep. The journey lives in
      # scripts/site-browse-journey.sh so it can run locally too.
      - name: Browse the site (full journey)
        timeout-minutes: 15
        env:
          SITE_JOURNEY_ARTIFACTS: /tmp
        run: bash scripts/site-browse-journey.sh http://localhost:8000

      - name: Verify development mode and no dependency scan errors
        run: |
          grep -q 'Development (with HMR)' /tmp/site-server.log
          if grep -E 'Failed to scan for dependencies|No matching export|Could not start Vite dev server' /tmp/site-server.log; then
            echo "::error::the quickstart client failed despite a live server process"
            exit 1
          fi

      - name: Dump server thread stacks on failure
        if: failure()
        run: |
          pip install py-spy >/dev/null 2>&1 || true
          for p in $(pgrep -f "jac run"); do
            echo "=== py-spy dump pid $p ==="
            sudo env "PATH=$PATH" py-spy dump --pid "$p" --nonblocking || true
          done

      - name: Capture browser and module requests on failure
        if: failure()
        run: |
          jac browse screenshot /tmp/site-browse-failure.png || true
          jac browse eval 'JSON.stringify(performance.getEntriesByType("resource").filter(r => r.responseStatus !== 200 || r.name.includes("/web/compiled/")).map(r => ({url: r.name, status: r.responseStatus, duration: r.duration})))' || true
          curl --max-time 10 -sS -D - -o /tmp/site-entry.js http://localhost:8000/web/compiled/_entry.js || true

      - name: Upload browse failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-browse-failure
          path: |
            /tmp/site-browse-failure.png
            /tmp/site-journey-failure.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop site server
        if: always()
        run: |
          jac browse close 2>/dev/null || true
          if [ -n "${{ env.SITE_PID }}" ]; then
            kill ${{ env.SITE_PID }} 2>/dev/null || true
            for i in $(seq 1 30); do
              kill -0 ${{ env.SITE_PID }} 2>/dev/null || break
              sleep 1
            done
            kill -9 ${{ env.SITE_PID }} 2>/dev/null || true
          fi

      - name: Build the production artifact
        working-directory: site
        run: |
          hang=$(jq -er '.phases."production-build".hang_seconds' "$JAC_CI_PERF_POLICY")
          LC_ALL=C /usr/bin/time --quiet -o "$RUNNER_TEMP/pack-smoke-performance/production-build.time.json" \
            -f '{"wall_seconds":%e,"user_seconds":%U,"system_seconds":%S,"rss_kib":%M,"exit_code":%x}' \
            timeout --kill-after=5s "${hang}s" jac build --output dist

      - name: Serve the production artifact outside the source project
        working-directory: ${{ runner.temp }}
        run: |
          cat /proc/uptime > "$RUNNER_TEMP/pack-smoke-performance/production-ready.start"
          timeout 1200 jac run --port 8000 "${{ github.workspace }}/site/dist/site.jab" > /tmp/site-artifact.log 2>&1 &
          echo "ARTIFACT_PID=$!" >> $GITHUB_ENV

      - name: Wait for the production artifact
        timeout-minutes: 1
        run: |
          for i in $(seq 1 60); do
            if ! kill -0 "${{ env.ARTIFACT_PID }}" 2>/dev/null; then
              cat /tmp/site-artifact.log
              exit 1
            fi
            if curl -sf --max-time 10 http://localhost:8000/ -o /dev/null; then
              cat /proc/uptime > "$RUNNER_TEMP/pack-smoke-performance/production-ready.ready"
              exit 0
            fi
            sleep 5
          done
          cat /tmp/site-artifact.log
          exit 1

      - name: Browse the production artifact (same journey)
        timeout-minutes: 15
        run: bash scripts/site-browse-journey.sh http://localhost:8000

      - name: Stop the production artifact
        if: always()
        run: |
          jac browse close 2>/dev/null || true
          if [ -n "${{ env.ARTIFACT_PID }}" ]; then
            kill "${{ env.ARTIFACT_PID }}" 2>/dev/null || true
            sleep 3
            kill -9 "${{ env.ARTIFACT_PID }}" 2>/dev/null || true
          fi
          cat /tmp/site-artifact.log 2>/dev/null || true

      # The other topology for the same site: `jac run --fleet` puts the
      # gateway in front of one local process per service app, with the
      # served app (`web`) as the fleet's root member owning the project
      # root. The journey below is the same one the single-process lane just
      # ran, so the two lanes assert the same site, including the closing
      # console-error sweep.
      - name: Start the site behind the fleet gateway
        working-directory: jac/examples/jaclang_org
        env:
          JAC_DOCS_LOCAL: ${{ github.workspace }}
        run: |
          cat /proc/uptime > "$RUNNER_TEMP/pack-smoke-performance/fleet-ready.start"
          timeout 1800 jac run --serve --fleet --port 8000 web \
            > /tmp/site-ms.log 2>&1 &
          MS_PID=$!
          echo "MS_PID=$MS_PID" >> $GITHUB_ENV
          echo "gateway starting with PID $MS_PID..."
          sleep 10
          if ! kill -0 $MS_PID 2>/dev/null; then
            echo "Gateway process died during startup"
            cat /tmp/site-ms.log
            exit 1
          fi

      - name: Wait for the gateway to be ready
        timeout-minutes: 4
        run: |
          for i in $(seq 1 90); do
            if ! kill -0 ${{ env.MS_PID }} 2>/dev/null; then
              echo "Gateway exited unexpectedly"
              tail -100 /tmp/site-ms.log
              exit 1
            fi
            if curl -sf --max-time 10 http://localhost:8000/health -o /dev/null; then
              echo "gateway is ready (attempt $i)"
              cat /proc/uptime > "$RUNNER_TEMP/pack-smoke-performance/fleet-ready.ready"
              exit 0
            fi
            echo "Attempt $i/90: gateway not ready, waiting 15s..."
            sleep 15
          done
          echo "Gateway failed to answer after 90 attempts"
          tail -200 /tmp/site-ms.log
          exit 1

      - name: Browse the site through the gateway (full journey)
        timeout-minutes: 20
        env:
          SITE_JOURNEY_ARTIFACTS: /tmp
        run: bash scripts/site-browse-journey.sh http://localhost:8000

      - name: Dump gateway and service thread stacks on failure
        if: failure()
        run: |
          pip install py-spy >/dev/null 2>&1 || true
          for p in $(pgrep -f "jac run"); do
            echo "=== py-spy dump pid $p ==="
            sudo env "PATH=$PATH" py-spy dump --pid "$p" --nonblocking || true
          done

      - name: Gateway and service logs
        if: always()
        run: |
          echo "=== gateway ==="
          tail -200 /tmp/site-ms.log || true
          for f in jac/examples/jaclang_org/.jac/logs/*.log; do
            echo "=== $f ==="
            tail -80 "$f" || true
          done

      - name: Stop the fleet gateway
        if: always()
        run: |
          jac browse close 2>/dev/null || true
          if [ -n "${{ env.MS_PID }}" ]; then
            kill ${{ env.MS_PID }} 2>/dev/null || true
            sleep 5
            kill -9 ${{ env.MS_PID }} 2>/dev/null || true
          fi
          pkill -f "jac run --serve --port 1" 2>/dev/null || true

      - name: Upload site server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-test-logs
          path: /tmp/site-server.log
          retention-days: 7

      # Registration cost per served walker is invisible on a small app and
      # dominates a large one, so the journeys above cannot see it. This app is
      # generated, needs no dependencies, and is sized where a per-lookup
      # resolution shows up as minutes rather than seconds.
      - name: Generate a many-walker app
        if: always()
        env:
          WALKERS: 400
          MODULES: 10
        run: |
          APP="$RUNNER_TEMP/walker-scale"
          rm -rf "$APP"
          mkdir -p "$APP/mods"
          printf '[project]\nname = "walkerscale"\nversion = "0.1.0"\n' > "$APP/jac.toml"
          : > "$APP/main.jac"
          per=$((WALKERS / MODULES))
          for k in $(seq 0 $((MODULES - 1))); do
            f="$APP/mods/m$k.jac"
            : > "$f"
            names=""
            for i in $(seq 0 $((per - 1))); do
              n="w_${k}_$i"
              printf 'walker:pub %s {\n    can go with Root entry {\n        report 1;\n    }\n}\n\n' "$n" >> "$f"
              names="$names$n, "
            done
            printf 'import mods.m%s;\nimport from mods.m%s { %s }\n' "$k" "$k" "${names%, }" >> "$APP/main.jac"
          done
          echo "generated $WALKERS walkers over $MODULES modules"

      # First boot prepares the application; the phase below measures the
      # restart that reuses it, which is what a redeploy and a worker respawn
      # pay. Sequential on purpose: the prepare must finish before the timer.
      - name: Prime the many-walker app
        if: always()
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}/walker-scale
        run: |
          timeout 540 jac run --serve --port 8211 main.jac > /tmp/walker-scale-cold.log 2>&1 &
          PID=$!
          for i in $(seq 1 108); do
            kill -0 $PID 2>/dev/null || { echo "server exited during prepare"; tail -50 /tmp/walker-scale-cold.log; exit 1; }
            curl -sf --max-time 10 -o /dev/null http://localhost:8211/healthz && break
            sleep 5
          done
          curl -sf --max-time 10 -o /dev/null http://localhost:8211/healthz || { echo "not ready after prepare"; tail -50 /tmp/walker-scale-cold.log; exit 1; }
          kill $PID 2>/dev/null || true
          sleep 5
          kill -9 $PID 2>/dev/null || true

      # This wait is the phase's ceiling. Registration linear in the walker
      # count answers in seconds here; the ceiling exists so that making it
      # quadratic again fails the job instead of only annotating it.
      - name: Restart the many-walker app
        if: always()
        timeout-minutes: 7
        working-directory: ${{ runner.temp }}/walker-scale
        run: |
          cat /proc/uptime > "$RUNNER_TEMP/pack-smoke-performance/walker-scale-ready.start"
          timeout 330 jac run --serve --port 8212 main.jac > /tmp/walker-scale-warm.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            kill -0 $PID 2>/dev/null || { echo "server exited during restart"; tail -50 /tmp/walker-scale-warm.log; exit 1; }
            if curl -sf --max-time 10 -o /dev/null http://localhost:8212/healthz; then
              cat /proc/uptime > "$RUNNER_TEMP/pack-smoke-performance/walker-scale-ready.ready"
              echo "restart answered /healthz on attempt $i"
              grep -c "Restoring prepared application" /tmp/walker-scale-warm.log || true
              kill $PID 2>/dev/null || true
              exit 0
            fi
            sleep 5
          done
          echo "::error::the many-walker app did not answer /healthz within the restart ceiling"
          tail -80 /tmp/walker-scale-warm.log
          kill -9 $PID 2>/dev/null || true
          exit 1

      # Wall time is compared with the median of main's last runs and only
      # annotated; exit status, the hang ceilings and peak RSS are the gates.
      # See scripts/ci_perf.md.
      - name: Report performance against main
        timeout-minutes: 3
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: jac run "$JAC_CI_PERF"

      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-smoke-performance
          path: ${{ runner.temp }}/pack-smoke-performance
          retention-days: 30
          if-no-files-found: error

  test-jac-pack-eject:
    needs: build-kit
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:sealed') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/jac-kit
        with:
          sealed: "true"
      - name: Install the C export toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev cmake
      # This step carries test_c_backend.jac's coverage: test-runtime also
      # discovers it but skips it there, having no LLVM 22 toolchain.
      - name: Build the LLVM C backend
        run: jac native build llvm-cbe
      - name: Verify C backend comparisons and executable startup
        run: jac test jac/tests/toolchains/test_c_backend.jac
      - name: Scaffold and export the jaclang.org site
        run: |
          jac create site --awesome
          cd site
          jac build web --as source
          test -f dist/source/project.json
          test -s dist/source/applications/web/client/native/arena.c
          test ! -e dist/source/applications/web/client/dist/arena.wasm
      - name: Export the existing native arena replay fixture
        run: |
          cp jac/tests/compiler/backends/native/fixtures/arena_replay.jac site/core/site/game/arena_replay.jac
          sed -i '/^import from sim /d' site/core/site/game/arena_replay.jac
          cat >> site/archwire.jac <<'JAC'

          graph import core.site.game {
              sim ++> arena_replay { sim_tick, world_new }
          }
          JAC
          cat >> site/jac.toml <<'TOML'
          [apps.replay]
          kind = "native-binary"
          entry-point = "core.site.game.arena_replay"

          [apps.replay.check.lint]
          ignore = ["no-print"]
          TOML
          cd site
          jac build replay --as source -o dist/replay
      - name: Build the standalone tool image
        run: docker build -t jac-source-tools .github/actions/polyglot-source
      - name: Build and execute native C without Jac
        run: |
          docker run --rm -v "$PWD/site/dist/replay:/app" jac-source-tools \
            sh -ec 'test -z "$(command -v jac)"; python build.py; applications/replay/main' > /tmp/source-replay.log 2>&1
          cat > /tmp/source-replay.expected <<'EXPECTED'
          0 0 100000 621189187
          0 0 82000 1158027131
          2 0 61883 332907100
          2 0 16883 1958242580
          2 0 12433 1715220132
          2 0 27483 1923114171
          EXPECTED
          tail -6 /tmp/source-replay.log > /tmp/source-replay.actual
          diff -u /tmp/source-replay.expected /tmp/source-replay.actual
      - name: Build and serve the exported site without Jac
        run: |
          docker run -d --name jac-source-site -p 8000:8000 \
            -v "$PWD/site/dist/source:/app" jac-source-tools sh -ec \
            'test -z "$(command -v jac)"; python -m pip install -r requirements.txt; python build.py; exec python main.py --host 0.0.0.0 --port 8000'
          for attempt in $(seq 1 450); do
            if curl -fsS http://localhost:8000/healthz >/dev/null; then
              exit 0
            fi
            test "$(docker inspect -f '{{.State.Running}}' jac-source-site)" = true || break
            sleep 2
          done
          docker logs jac-source-site
          exit 1
      - name: Ensure Chromium is available
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then exit 0; fi
          done
          sudo apt-get update
          sudo apt-get install -y chromium-browser
      - name: Browse the exported site through the shared journey
        timeout-minutes: 15
        env:
          SITE_JOURNEY_ARTIFACTS: /tmp
        run: bash scripts/site-browse-journey.sh http://localhost:8000
      - name: Collect export logs
        if: always()
        run: |
          docker logs jac-source-site > /tmp/source-site.log 2>&1 || true
          docker rm -f jac-source-site || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jac-pack-eject-logs
          path: |
            /tmp/source-*.log
            /tmp/site-journey-failure.png
          retention-days: 7

  test-managed-android:
    needs: build-kit
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:sealed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAC_ACCEPT_ANDROID_LICENSES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/jac-kit
        with:
          sealed: "true"
      # Keep the small multiscreen fixture for focused dual-target tests; this
      # lane packages the real JacYac mobile workspace with a fresh Android SDK.
      - name: Build the JacYac release APK with a fresh managed Android SDK
        run: |
          set -euo pipefail
          # The runner image ships its own SDK at ANDROID_HOME; point it at an
          # empty directory so the managed one is provisioned from scratch.
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          cp -r jac/examples/jaclang_org "$RUNNER_TEMP/mobile-app"
          printf '\n[client.react_native]\nrelease = true\nproject_dir = ".jac/mobile-rn"\n\n[toolchains]\nsystem = false\n' >> "$RUNNER_TEMP/mobile-app/jac.toml"
          cd "$RUNNER_TEMP/mobile-app"
          jac setup --toolchain android
          jac build --platform android mobile
          test -n "$(find .jac/mobile-rn/android/app/build/outputs/apk -name '*.apk' -print -quit)"
      - name: Upload the generated APK
        uses: actions/upload-artifact@v4
        with:
          name: jacyac-android-apk
          path: ${{ runner.temp }}/mobile-app/.jac/mobile-rn/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
