name: Stage-0 pin bump

# Weekly, or on demand: pin the kernel's stage-0 compiler
# (jac/bootstrap/stage0.json) to the newest main commit whose CI passed, and
# open (or update) a PR that changes that file and nothing else. The pin is
# computed by main's own compiler (stage0_build.pin_for_commit), the code a
# checkout runs to verify the snapshot it provisions, so the digest it records
# is the one PRs recompute. A pinned commit must carry
# kernel_stage0.build_target_kernel; an older one would only ever fall back to
# the self build.
#
# Why a PR of its own: only runs on main save the stage-0 snapshot and
# kernel-units caches (ci.yml build-kit), so a pin move rides with a cold stage
# 0 until it lands. Landing the pin alone lets main seed both caches before any
# feature PR builds against it; ci.yml's Contribution Checks refuse a PR that
# moves the pin together with anything else.
#
# Token: a PR or push made with GITHUB_TOKEN triggers no workflows, so CI would
# never run on the bump PR. The job pushes and opens the PR with the
# JAC_AUTOFIX_TOKEN secret (the token ci.yml's jac fmt autofix already uses to
# retrigger CI; it needs contents and pull-requests write on this repo). Without
# it the job falls back to GITHUB_TOKEN and says so: a maintainer then closes
# and reopens the PR to attach its checks.

on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit to pin (default: the newest main commit with passing CI)'
        required: false
        type: string

permissions: {}

concurrency:
  group: stage0-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'jaseci-labs/jac'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      # The sealed kit of this main commit computes the pin.
      JAC_NO_DEV_SOURCE: "1"
      PIN: jac/bootstrap/stage0.json
      BRANCH: stage0-bump
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # The push below authenticates with its own token; a persisted
          # GITHUB_TOKEN header would override it.
          persist-credentials: false

      - name: Choose the commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          commit="$REQUESTED"
          if [ -z "$commit" ]; then
            commit=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""')
          fi
          [ -n "$commit" ] || { echo "::error::no main commit with passing CI"; exit 1; }
          commit=$(git rev-parse --verify "$commit^{commit}")
          git merge-base --is-ancestor "$commit" HEAD || {
            echo "::error::$commit is not on main"; exit 1; }
          git cat-file -e "$commit:jac/jaclang/compiler/backends/native/kernel_stage0.jac" || {
            echo "::error::$commit predates the stage-0 kernel entry point"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # Nothing to do when main already pins this commit, or (unless a
          # commit was named) a newer one.
          current=$(jq -r '.commit // ""' "$PIN" 2>/dev/null || true)
          skip=false
          if [ "$current" = "$commit" ]; then
            echo "::notice::stage 0 is already pinned to $commit"
            skip=true
          elif [ -z "$REQUESTED" ] && [ -n "$current" ] &&
               git merge-base --is-ancestor "$commit" "$current" 2>/dev/null; then
            echo "::notice::stage 0 is pinned to $current, newer than $commit"
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Build the jac binary (cached)
        if: steps.pick.outputs.skip != 'true'
        uses: ./.github/actions/setup-jac

      # The seal's guards (stage0_build.native_tree_trips / file_guard_trips)
      # send a build back to the self build when the pinned commit's native
      # tree, typeshed pin, native ABI or kernel ABI contract differs from the
      # checkout's. A pin that trips them against main would only ever fall
      # back, so check them here, against this main checkout, and skip.
      - name: Compute the pin
        id: compute
        if: steps.pick.outputs.skip != 'true'
        env:
          JAC_STAGE0_ROOT: ${{ github.workspace }}/jac
          JAC_CACHE_HOME: ${{ runner.temp }}/jac-stage0-cache
          STAGE0_COMMIT: ${{ steps.pick.outputs.commit }}
        run: |
          set -euo pipefail
          status=0
          jac -P -c '
          import os
          import sys
          import jaclang
          from jaclang.compiler.backends.native.stage0_build import (
              abi_version_of, checkout_repo, native_tree_trips, pin_for_commit,
              stage0_dir, typeshed_pin_of)
          from jaclang.compiler.backends.native.stage0_pin import (
              abi_contract_differences, stage0_source_dir, write_stage0_pin)
          pin = pin_for_commit(sys.argv[1])
          repo, prefix = checkout_repo()
          here = os.path.join(stage0_source_dir(), "jaclang")
          there = os.path.join(stage0_dir(pin.commit), "jaclang")
          trips = list(native_tree_trips(pin, repo, prefix))
          ours = typeshed_pin_of(here) or "missing"
          if ours != pin.typeshed_pin:
              trips.append(f"typeshed pin {ours} on main, {pin.typeshed_pin} at stage 0")
          if abi_version_of(here) != abi_version_of(there):
              trips.append(f"native ABI {abi_version_of(here)} on main, {abi_version_of(there)} at stage 0")
          changed = abi_contract_differences(there, here)
          if changed:
              trips.append("kernel ABI contract differs: " + ", ".join(changed))
          if trips:
              for trip in trips:
                  print(f"::warning title=stage 0::{pin.commit[:12]} cannot serve as stage 0: {trip}")
              sys.exit(3)
          write_stage0_pin(pin, sys.argv[2])
          print(f"stage 0: {pin.commit} digest {pin.compiler_digest}")
          ' "$STAGE0_COMMIT" "$GITHUB_WORKSPACE/$PIN" || status=$?
          case "$status" in
            0) echo "tripped=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "tripped=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
          git diff -- "$PIN"

      - name: Open or update the pin-bump PR
        if: steps.pick.outputs.skip != 'true' && steps.compute.outputs.tripped == 'false'
        env:
          BOT_TOKEN: ${{ secrets.JAC_AUTOFIX_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
          STAGE0_COMMIT: ${{ steps.pick.outputs.commit }}
          REQUESTED: ${{ inputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$PIN"; then
            echo "::notice::stage 0 is already pinned to $STAGE0_COMMIT"
            exit 0
          fi
          if [ -n "$BOT_TOKEN" ]; then
            token="$BOT_TOKEN"
          else
            token="$DEFAULT_TOKEN"
            echo "::warning::JAC_AUTOFIX_TOKEN is not set: the PR is pushed with GITHUB_TOKEN, which triggers no CI. Close and reopen it to run its checks."
          fi
          export GH_TOKEN="$token"
          git remote set-url origin "https://x-access-token:${token}@github.com/${GITHUB_REPOSITORY}.git"

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main \
            --state open --json number --jq '.[0].number // ""')
          # An open bump PR that already carries this pin needs no new push
          # (a push would only rerun its CI).
          if [ -n "$pr" ] && git fetch --quiet --no-tags origin "$BRANCH" &&
             git diff --quiet FETCH_HEAD -- "$PIN"; then
            echo "::notice::#$pr already pins stage 0 to $STAGE0_COMMIT"
            exit 0
          fi

          short="${STAGE0_COMMIT:0:12}"
          title="stage0: pin the kernel's stage-0 compiler to $short"
          if [ -n "$REQUESTED" ]; then
            why="the commit named when this run was dispatched"
          else
            why="the newest main commit whose CI passed"
          fi
          body_file="$RUNNER_TEMP/stage0-bump-body.md"
          {
            echo "Pins \`$PIN\` to $STAGE0_COMMIT, $why. Opened by the [Stage-0 pin bump workflow]($RUN_URL)."
            echo
            echo "This PR changes only the pin, so that its push to main seeds the stage-0 snapshot and kernel-units caches (only main saves them). Feature PRs that land after it build against a warm stage 0."
            echo
            echo "Kernel builds under this pin run that commit's compiler. The seal's guards (native tree, typeshed pin, native ABI, kernel ABI contract) matched this main checkout when the pin was computed; a later guard trip falls back to the self build with a notice."
            echo
            echo "\`\`\`diff"
            git diff -U0 -- "$PIN" | tail -n +5
            echo "\`\`\`"
          } > "$body_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "$PIN"
          git commit -m "$title"
          git push --force origin "$BRANCH"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file "$body_file" --add-label skip-release-notes-check
            echo "::notice::Updated the stage-0 pin PR #$pr"
          else
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "$title" --body-file "$body_file" --label skip-release-notes-check)
            echo "::notice::Opened the stage-0 pin PR $url"
          fi
