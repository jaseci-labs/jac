name: Set up jac binary
description: >
  Make the self-contained `jac` binary (a Jac launcher + bundled Python) available
  on PATH. `python` picks the interpreter: CPython is the one official
  configuration; JacPython is an accelerator its own lanes build on request. Replaces `pip install -e ./jac`: jaclang ships as the binary, not a
  PyPI/editable package, so no system Python is needed to get the `jac` command.

  The binary is an OUTPUT cache keyed on the content that goes into it (jaclang
  source, build.zig, and the launcher -- including bootstrap/pins.json, which pins the
  LLVM pin and the separate Python source manifest). Merges to main seed the cache;
  every other job and workflow restores the prebuilt binary in seconds instead
  of rebuilding (PR branches cross-restore main's entry, and build their own on
  a miss). Exact-key match only (no restore-keys), so a stale binary can never
  be served -- which is why this is safe even though zig's own incremental cache
  stays disabled (it doesn't reliably invalidate on a jaclang/dist/payload change).
inputs:
  python:
    description: >
      The interpreter to bundle: `cpython` (the official binary) or `jacpython`
      (the JacPython lanes). Every cache below is keyed on it.
    required: false
    default: "cpython"
  need-build-inputs:
    description: >
      Restore the source-built Python and the LLVMPY_* shim even when the
      binary cache hits. Set it when the job runs `zig build` steps of its own:
      every payload-tool step (vendor-musl, vendor-wasm-libc, ...) runs through
      the source-built interpreter, and building that interpreter compiles the
      Jac compiler to native code, which loads the shim. A binary hit alone
      leaves neither on disk, so those steps rebuild the SDK and die in
      prepare_native.py with a missing libjacllvm.so.
    required: false
    default: "false"
  kernel-dir:
    description: >
      A directory holding a compiler kernel built elsewhere for this runner's
      platform (build-kernel.yml's `kernel-<platform>` artifact). The seal
      adopts it instead of building the kernel, and refuses it unless it was
      built from this tree (#10219). Empty builds the kernel as usual.
    required: false
    default: ""
  native-kernel:
    description: >
      Keep the native compiler kernel in a pull request's kit, as the
      `native:kernel` label does. ci.yml's build-kit sets it when the PR
      touches a path the kernel is lowered from.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Resolve Python SDK cache input
      id: python-sdk
      shell: bash
      run: |
        sdk=zig-libc
        if [ "$RUNNER_OS" = macOS ]; then sdk=$(xcrun --sdk macosx --show-sdk-version); fi
        echo "version=$sdk" >> "$GITHUB_OUTPUT"

    - name: Fingerprint immutable build inputs
      id: inputs
      shell: bash
      run: bash scripts/ci_cache_keys.sh >> "$GITHUB_OUTPUT"

    - name: Resolve the interpreter
      id: py
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
        KEY_CPYTHON: ${{ steps.inputs.outputs.python_cpython }}
        KEY_JACPYTHON: ${{ steps.py.outputs.key }}
      run: |
        case "$PYTHON" in
          cpython) echo "key=$KEY_CPYTHON" >> "$GITHUB_OUTPUT" ;;
          jacpython) echo "key=$KEY_JACPYTHON" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::setup-jac python must be cpython or jacpython, not $PYTHON"; exit 1 ;;
        esac
        echo "variant=$PYTHON" >> "$GITHUB_OUTPUT"

    # typeshed stdlib stubs are vendored as plain files now (no submodule);
    # third-party stubs are installed per-project by `jac install` (PEP 561 types-*).
    #
    # Restore/save split with saves gated to main, the same as the
    # read-mostly caches below.
    # The binary key changes on every jaclang/launcher edit, so a
    # per-PR save has almost no reuse value (only a follow-up push touching
    # neither jaclang nor the launcher would hit it) yet a high pool cost
    # (~0.1-0.2 GB each). Left unbounded it dominated the 10 GB pool -- dozens of
    # per-branch binaries -- and its LRU churn evicted the Linux read-mostly
    # caches (Python/bun) this action relies on. PR jobs still build their own
    # binary on a miss (and ci.yml publishes it as an artifact for the same-run
    # test jobs); only main seeds the shared copy. Exact-key match only (no
    # restore-keys), so a stale binary can never be served.
    - name: Restore cached jac binary
      id: cache
      uses: actions/cache/restore@v4
      with:
        # Also cache the gitignored typeshed stdlib stubs: they are materialized
        # during `zig build` and ci.yml publishes them as an artifact for
        # the compiler suite. Without them here, a binary cache hit skips the
        # build and the upload step fails on a fresh checkout.
        #
        # .precompiled-build/${{ steps.py.outputs.variant }} rides WITH the binary, not beside it.
        # ci.yml publishes that tree as the `jac-precompiled` artifact and every
        # reroute lane requires it (`jac native status --require precompiled`), so
        # a tree that does not match this checkout is a hard failure, not a slow
        # lane. Keyed together, a hit restores the exact pair that was built;
        # keyed apart, a hit on one with a restore-keys prefix hit on the other
        # could ship a bundle one payload fingerprint stale. The read-mostly
        # entry below stays prefix-matched, because seeding an incremental
        # BUILD from a near-miss tree is exactly what it is for.
        path: |
          jac/zig-out/bin/jac
          jac/jaclang/vendor/typeshed/stdlib
          jac/.precompiled-build/${{ steps.py.outputs.variant }}
        key: jac-bin-v3-${{ steps.py.outputs.variant }}-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdk${{ steps.python-sdk.outputs.version }}-${{ steps.inputs.outputs.binary }}

    - name: Restore cached typeshed stdlib stubs
      id: typeshed-cache
      uses: actions/cache@v4
      with:
        path: jac/jaclang/vendor/typeshed/stdlib
        key: typeshed-stdlib-${{ hashFiles('jac/jaclang/vendor/typeshed/PIN', 'jac/jaclang/vendor/typeshed/TARBALL_SHA256', 'jac/launcher/payload.zig') }}

    # The four caches below (Python, shim, LLVM, bun) are big (0.2-0.6 GB each).
    # They use restore/save split with SAVES GATED TO MAIN: PR
    # branches read main's entries (cross-branch restore from the default
    # branch), and a per-PR save would only duplicate ~1.2 GB per ref into the repo's 10 GB
    # cache pool -- which is exactly what pushed it into daily LRU eviction and
    # made every "stable" entry a recurring miss. Main runs seed and
    # refresh the shared copies.

    # The runtime key covers the interpreter's source and build inputs; for
    # JacPython also its producing Jac compiler.
    - name: Restore cached source-built Python
      id: python-cache
      if: steps.cache.outputs.cache-hit != 'true' || inputs.need-build-inputs == 'true'
      uses: actions/cache/restore@v4
      with:
        path: jac/.python-build/${{ steps.py.outputs.variant }}
        key: python-build-v4-${{ steps.py.outputs.variant }}-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdk${{ steps.python-sdk.outputs.version }}-${{ steps.py.outputs.key }}
        restore-keys: |
          python-build-v4-${{ steps.py.outputs.variant }}-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdk${{ steps.python-sdk.outputs.version }}-

    # The LLVMPY_* shim is the single most expensive build artifact (statically
    # links ~0.5 GB of LLVM archives; several minutes) and depends only on
    # native/**, build.zig, and the pinned slice (bootstrap/pins.json) -- NOT on
    # jaclang/**. Cache the built shim itself so compiler-only merges (the
    # common case for a binary-cache miss) skip both the LLVM fetch below and
    # the link. The cache path is the shim's in-tree place path, record
    # included: `zig build` reuses a placed shim whose record names these
    # inputs and this target. A from-source build populates it, so a
    # main-branch miss self-seeds when the job ends.
    - name: Restore cached LLVMPY shim
      id: shim-cache
      if: steps.cache.outputs.cache-hit != 'true' || inputs.need-build-inputs == 'true'
      uses: actions/cache/restore@v4
      with:
        path: jac/jaclang/compiler/backends/native/llvm/libjacllvm.*
        key: jac-shim-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/native/**', 'jac/build.zig', 'jac/build.zig.zon', 'jac/bootstrap/pins.json') }}

    # The native (na) backend statically links a pinned LLVM into the LLVMPY_*
    # shim, so `zig build` needs that LLVM extracted first (there is no llvmlite
    # wheel anymore). Cache the pruned ~0.5 GB tree, keyed on the single-sourced
    # slice pin (bootstrap/pins.json) so unrelated payload-tool churn (bun/Python/pip
    # pins) does not orphan a 0.5 GB entry. Only engaged on a binary miss AND a
    # shim miss (a cached shim needs no LLVM at all).
    - name: Restore cached LLVM (jacllvm shim deps)
      id: llvm-cache
      if: (steps.cache.outputs.cache-hit != 'true' || inputs.need-build-inputs == 'true') && steps.shim-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: jac/.llvm-build
        key: llvm-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/bootstrap/pins.json') }}

    # The contained bun runtime is fetched + sha256-verified and bundled into the
    # payload during `zig build`. Cache the extracted tree (~58 MB) so a binary
    # miss does not re-download it, keyed on the resolver pin in
    # client/js_runtime.jac (the one definition; the Jac payload tool imports it, so no lockstep
    # check). Only engaged on a binary miss.
    - name: Restore cached bun runtime
      id: bun-cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: jac/.bun-build
        key: bun-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/jaclang/client/js_runtime.jac') }}

    # The JIR precompile is mkpayload's single most expensive stage (~24 min:
    # it compiles every bundled jaclang module). ONE tree per (code version,
    # runtime variant) serves all of CI; nothing else may recompile it.
    #
    # No runner.os, no runner.arch: a precompiled unit is pure marshalled
    # bytecode plus metadata, and its key folds only the jaclang version, the
    # Python major.minor (packed little-endian, explicitly), FORMAT_VERSION,
    # the source content hashes and the compiler digest -- see
    # jir.jac _toolchain_env_fingerprint / compute_precompile_module_key, which
    # short-circuit the project/target half of the fingerprint for every path
    # under the jaclang package. Stored paths are relocatable through
    # PRECOMPILE_SENTINEL (JirPaths.encode/resolve), so the Linux kit's tree
    # loads unchanged on the macOS and aarch64 lanes.
    #
    # The interpreter token, by contrast, IS load-bearing and stays. Bytecode
    # for a .jac module comes out of the HOST interpreter's `compile`
    # (codegen_shim.compile_ir falls back to the builtin), which on JacPython is
    # the native Jac compiler and on CPython is CPython's own. Equivalent
    # behavior is not identical bytecode, and the module key has no variant
    # axis to catch the difference, so the two variants must never share a tree.
    #
    # restore-keys stays: mkpayload re-validates every seeded .jir per module
    # and recompiles only the mismatches, so a near-miss tree makes the BUILD
    # incremental. The compiler digest scopes the prefix, so a compiler-touching
    # commit starts cold rather than dragging a tree it cannot use. The exact
    # pair that feeds the shared bundle comes from the binary cache above, not
    # from here.
    - name: Restore cached JIR precompile tree
      id: precompiled-cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: jac/.precompiled-build/${{ steps.py.outputs.variant }}
        key: jac-precompiled-${{ steps.py.outputs.variant }}-c${{ steps.inputs.outputs.compiler }}-${{ steps.inputs.outputs.payload }}
        restore-keys: |
          jac-precompiled-${{ steps.py.outputs.variant }}-c${{ steps.inputs.outputs.compiler }}-

    # The payload's compressed deps-layer frame (mkpayload --layer-cache): the
    # level-19 zstd of the ~600 MB dependency layer, the pack's single most
    # expensive stage after the JIR precompile. mkpayload content-addresses the
    # frame and VERIFIES it by decompress + byte-compare before reuse, so like
    # the precompile tree a stale restore can only miss, never mis-serve --
    # restore-keys is safe. The key names every pinned input that feeds the
    # layer (Python sources and pins, the launcher and payload tool, shim inputs in
    # native/** + build.zig, the zon-pinned packages in build.zig.zon, the
    # wasm_rt floor); unpinned pip releases can still drift the content
    # mid-key, which just recompresses until the key next rolls.
    - name: Restore cached payload deps-layer frame
      id: layers-cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: jac/.payload-layers/${{ steps.py.outputs.variant }}
        key: payload-layers-${{ steps.py.outputs.variant }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.layers }}
        restore-keys: |
          payload-layers-${{ steps.py.outputs.variant }}-${{ runner.os }}-${{ runner.arch }}-

    # The Zig package store (.zig-cache/p): every git/tarball dependency
    # `zig build` fetches, as pinned by build.zig.zon. Content-addressed and
    # immutable (the hash IS the identity), so unlike zig's build-artifact cache
    # it can never ship stale bits -- which is why we cache only the `p/`
    # package subdir and leave o/,h/ (the payload-artifact cache, deliberately
    # disabled via use-cache:false) untouched. mlugg/setup-zig pins
    # ZIG_GLOBAL_CACHE_DIR to $GITHUB_WORKSPACE/.zig-cache. Keyed on build.zig.zon
    # (which pins every package hash, and thus the entire transitive closure);
    # restore-keys so a zon bump still reuses every unchanged package instead of
    # re-fetching it. Only engaged on a binary miss.
    - name: Restore cached Zig package store
      id: zig-pkgs-cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: .zig-cache/p
        key: zig-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/build.zig.zon') }}
        restore-keys: |
          zig-pkgs-${{ runner.os }}-${{ runner.arch }}-

    - name: Set up Zig 0.16.0
      if: steps.cache.outputs.cache-hit != 'true' || steps.typeshed-cache.outputs.cache-hit != 'true'
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
        # We key our own output cache above; zig's incremental cache is unreliable
        # for the payload step, so leave it off and rebuild from scratch on a miss.
        use-cache: false

    # Download + extract the pinned LLVM into jac/.llvm-build (idempotent: a no-op
    # when the cache above restored it). Must run before `zig build` so the shim's
    # static archives exist when build.zig configures the jacllvm step. Skipped
    # entirely when a cached shim was restored (a current shim needs no LLVM).
    - name: Fetch LLVM for the jacllvm shim
      if: steps.cache.outputs.cache-hit != 'true' && steps.shim-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: jac
      run: zig build fetch-llvm --summary all

    - name: Fetch typeshed stdlib stubs
      if: steps.typeshed-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: jac
      # Load-bearing on a binary-cache hit, where no full build ran to fetch
      # the stubs otherwise.
      run: zig build fetch-typeshed --summary all

    - name: Build the jac binary
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: jac
      # On a shim-cache hit the build reuses the restored shim in place. On a
      # miss it links the shim from source, the place step writes it in-tree,
      # and the shim cache saves it at job end.
      # On a JacPython lane, a PR reuses the JacPython runtime main last built
      # when the sources it was lowered from are unchanged (build_python.zig
      # sourcesKey); main keeps the full key, so the runtime is at most one main
      # build behind.
      # A pull request's kit leaves the native compiler kernel out unless the
      # PR carries the `native:kernel` label or the caller sets native-kernel.
      # The seal omits only what JAC_KIT_OMIT names (artifacts/kit.jac
      # pr_kit_omits), so a build that does not come through here, such as
      # build-binaries.yml, ships it all.
      env:
        PYTHON: ${{ steps.py.outputs.variant }}
        PR_BUILD: ${{ github.event_name == 'pull_request' }}
        KERNEL_DIR: ${{ inputs.kernel-dir }}
        JAC_KIT_OMIT: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'native:kernel') && inputs.native-kernel != 'true' && 'kernel' || '' }}
      run: |
        PY=(-Dpython="$PYTHON")
        if [ "$PYTHON" = jacpython ]; then PY+=(-Dreuse-python="$PR_BUILD"); fi
        KERNEL_ARG=()
        if [ -n "$KERNEL_DIR" ]; then KERNEL_ARG=(-Dkernel="$KERNEL_DIR"); fi
        TARGET_ARG=()
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) TARGET_ARG=(-Dtarget=x86_64-linux-gnu.2.17) ;;
          Linux/ARM64) TARGET_ARG=(-Dtarget=aarch64-linux-gnu.2.17) ;;
        esac
        # Retried: the cold-store fetches time out transiently, and one
        # flake otherwise costs a whole run. A precompile failure is
        # deterministic, though, so it exits on the first attempt rather
        # than burning two more full builds to reprint itself.
        set -o pipefail
        LOG="$(mktemp)"
        for attempt in 1 2 3; do
          if zig build "${PY[@]}" "${TARGET_ARG[@]}" "${KERNEL_ARG[@]}" --summary all 2>&1 | tee "$LOG"; then
            exit 0
          fi
          if grep -qE 'Seal aborted|Seal incomplete|seal-finalize failed' "$LOG"; then
            echo "::error::zig build failed in the precompile step; that is deterministic, so it is not retried."
            exit 1
          fi
          echo "zig build failed (attempt $attempt); retrying in 30s"
          sleep 30
        done
        exit 1

    # Seed the shared binary cache from trusted refs only (see the note by the
    # restore step). Saved after the build so both the binary and the materialized
    # typeshed stdlib stubs (part of this cache's path) exist.
    - name: Save jac binary cache (trusted refs only)
      if: >-
        github.ref == 'refs/heads/main' &&
        steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          jac/zig-out/bin/jac
          jac/jaclang/vendor/typeshed/stdlib
          jac/.precompiled-build/${{ steps.py.outputs.variant }}
        key: jac-bin-v3-${{ steps.py.outputs.variant }}-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdk${{ steps.python-sdk.outputs.version }}-${{ steps.inputs.outputs.binary }}

    # Seed the shared read-mostly caches from trusted refs only (see the note
    # above the restore steps). Main runs seed
    # pin bumps; PR runs never duplicate these entries.
    - name: Save source Python cache (trusted refs only)
      if: >-
        github.ref == 'refs/heads/main' &&
        steps.cache.outputs.cache-hit != 'true' &&
        steps.python-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: jac/.python-build/${{ steps.py.outputs.variant }}
        key: python-build-v4-${{ steps.py.outputs.variant }}-${{ runner.os }}-${{ runner.arch }}-zig0.16.0-sdk${{ steps.python-sdk.outputs.version }}-${{ steps.py.outputs.key }}

    - name: Save LLVMPY shim cache (trusted refs only)
      if: >-
        github.ref == 'refs/heads/main' &&
        steps.cache.outputs.cache-hit != 'true' &&
        steps.shim-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: jac/jaclang/compiler/backends/native/llvm/libjacllvm.*
        key: jac-shim-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/native/**', 'jac/build.zig', 'jac/build.zig.zon', 'jac/bootstrap/pins.json') }}

    - name: Save LLVM cache (trusted refs only)
      if: >-
        github.ref == 'refs/heads/main' &&
        steps.cache.outputs.cache-hit != 'true' &&
        steps.shim-cache.outputs.cache-hit != 'true' &&
        steps.llvm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: jac/.llvm-build
        key: llvm-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/bootstrap/pins.json') }}

    - name: Save bun cache (trusted refs only)
      if: >-
        github.ref == 'refs/heads/main' &&
        steps.cache.outputs.cache-hit != 'true' &&
        steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: jac/.bun-build
        key: bun-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/jaclang/client/js_runtime.jac') }}

    # cache-hit is only 'true' on an exact-key match, so a restore-keys prefix
    # hit still saves here -- that is what keeps the entry tracking HEAD (each
    # run re-saves the refreshed tree under the new jaclang/** hash).
    #
    # NOT gated to main, unlike every other save in this action. The gate exists
    # to keep ~0.1-0.6 GB entries from churning the 10 GB pool; this tree is
    # ~55 MB and it is the expensive one to regenerate (~24 min cold). Gating it
    # meant a PR iterating on the compiler paid a full cold precompile on every
    # push and could not reuse its own previous one. One key per (compiler
    # digest, payload), so a branch adds at most one entry per distinct tree.
    - name: Save JIR precompile cache
      if: >-
        steps.cache.outputs.cache-hit != 'true' &&
        steps.precompiled-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: jac/.precompiled-build/${{ steps.py.outputs.variant }}
        key: jac-precompiled-${{ steps.py.outputs.variant }}-c${{ steps.inputs.outputs.compiler }}-${{ steps.inputs.outputs.payload }}

    # Same prefix-hit re-save logic as the precompile cache above.
    - name: Save payload deps-layer cache (trusted refs only)
      if: >-
        github.ref == 'refs/heads/main' &&
        steps.cache.outputs.cache-hit != 'true' &&
        steps.layers-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: jac/.payload-layers/${{ steps.py.outputs.variant }}
        key: payload-layers-${{ steps.py.outputs.variant }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.layers }}

    # Seed the Zig package store from trusted refs only (see the restore note).
    # Like the precompile cache, a restore-keys prefix hit still leaves cache-hit
    # != true, so each trusted run re-saves the refreshed closure under the
    # current build.zig.zon hash. Same key as build-binaries.yml's dev-channel
    # entry, so the two share one ~20 MB entry per os/arch.
    - name: Save Zig package store cache (trusted refs only)
      if: >-
        github.ref == 'refs/heads/main' &&
        steps.cache.outputs.cache-hit != 'true' &&
        steps.zig-pkgs-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .zig-cache/p
        key: zig-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jac/build.zig.zon') }}

    # Binary cache hits skip `zig build`, which is what normally runs fetch-typeshed.
    # Older cache entries only stored the binary, so materialize stubs when missing.
    - id: typeshed_check
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        if [ -f jac/jaclang/vendor/typeshed/stdlib/VERSIONS ]; then
          echo "needed=false" >> "$GITHUB_OUTPUT"
        else
          echo "needed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Zig 0.16.0 (for typeshed after binary cache hit)
      if: steps.cache.outputs.cache-hit == 'true' && steps.typeshed_check.outputs.needed == 'true'
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
        use-cache: false

    - name: Materialize typeshed stdlib stubs
      if: steps.cache.outputs.cache-hit == 'true' && steps.typeshed_check.outputs.needed == 'true'
      shell: bash
      working-directory: jac
      run: zig build fetch-typeshed

    - name: Put jac on PATH
      shell: bash
      run: |
        mkdir -p "$HOME/.jacbin"
        ln -sf "$GITHUB_WORKSPACE/jac/zig-out/bin/jac" "$HOME/.jacbin/jac"
        echo "$HOME/.jacbin" >> "$GITHUB_PATH"
