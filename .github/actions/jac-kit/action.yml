name: Get jac kit
description: >
  Download the kit artifact into the checkout (binary, typeshed stubs, vendored
  musl/wasm runtimes land at their in-tree paths), check it against the
  manifest build-kit sealed into it, put jac on PATH, and warm its runtime
  cache. The kit is the binary built from this checkout (build-kit); the
  job's JAC_NO_DEV_SOURCE decides whether it runs sealed ("1") or through
  the [dev] reroute (""). upload-artifact strips the executable bit; restore
  it.
inputs:
  name:
    description: Kit artifact name
    required: false
    default: jac-kit
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: jac

    # download-artifact can report success on a download it never finished:
    # when the blob stream stalls mid-extraction the step exits 0 with the
    # files extracted so far, the last of them cut short, and without its
    # "download completed" line (main run 33816389635: four jobs spent 70s on
    # a kit the other jobs fetched in 7s, then died on a jac binary with no
    # payload trailer). Check every file against the manifest; on a miss,
    # fetch once more and check again, so a stall costs a retry, not the job.
    - name: Check the kit against its manifest
      id: check
      shell: bash
      working-directory: jac
      run: |
        if bash "$GITHUB_ACTION_PATH/manifest.sh" check; then
          echo "ok=1" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::kit download is incomplete; fetching it again"
          echo "ok=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Fetch the kit again
      if: steps.check.outputs.ok != '1'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: jac

    - name: Check the kit again
      if: steps.check.outputs.ok != '1'
      shell: bash
      working-directory: jac
      run: bash "$GITHUB_ACTION_PATH/manifest.sh" check

    - shell: bash
      run: |
        chmod +x "$GITHUB_WORKSPACE/jac/zig-out/bin/jac"
        echo "$GITHUB_WORKSPACE/jac/zig-out/bin" >> "$GITHUB_PATH"

    # Reroute lanes only (job env JAC_NO_DEV_SOURCE other than "1"): one
    # runtime cache for the whole job, outside $HOME, so test steps that
    # re-home themselves (HOME="$(mktemp -d)") keep the warm reroute compile
    # below instead of redoing it inside the first worker of every parallel
    # pool. Named .cache because tests assert the global cache sits in a
    # platform-style cache directory. Sealed lanes keep the default $HOME
    # layout: their first use is a payload unpack, not a compile, and the
    # native suite's memory envelope was measured under that layout.
    - name: Pin the runtime cache for the reroute
      shell: bash
      run: |
        if [ "${JAC_NO_DEV_SOURCE:-}" != "1" ]; then
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/.cache" >> "$GITHUB_ENV"
        fi

    # First use either unpacks the payload (sealed lanes, seconds) or compiles
    # this checkout's compiler through the reroute (reroute lanes, ~200
    # modules, about a minute). Pay it once here, serially. `jac --version` is not
    # enough: it touches a tenth of the modules a real compile does.
    - name: Warm the runtime cache
      shell: bash
      run: |
        set -euo pipefail
        WORK="$(mktemp -d)"
        printf 'with entry { print(6*7); }\n' > "$WORK/warm.jac"
        out="$(jac run "$WORK/warm.jac" 2>&1)" || { echo "$out"; exit 1; }
        echo "$out" | tail -3
        echo "$out" | grep -q 42
