name: Get jac kit
description: >-
  Download the compiler built from this checkout, put jac on PATH, and verify its packaged runtime.
inputs:
  name:
    description: Kit artifact name
    required: false
    default: jac-kit
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: jac

    - shell: bash
      run: |
        chmod +x "$GITHUB_WORKSPACE/jac/zig-out/bin/jac"
        echo "$GITHUB_WORKSPACE/jac/zig-out/bin" >> "$GITHUB_PATH"

    - name: Verify the packaged runtime
      shell: bash
      run: |
        set -euo pipefail
        WORK="$(mktemp -d)"
        printf 'with entry { print(6*7); }\n' > "$WORK/warm.jac"
        out="$(jac run "$WORK/warm.jac" 2>&1)" || { echo "$out"; exit 1; }
        echo "$out" | tail -3
        echo "$out" | grep -q 42
