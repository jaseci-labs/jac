[project]
name = "jaclang_org"

# Deployment values for the apps archwire.jac declares. Each is baked into the
# artifact and can be overridden by its environment variable (`jac build`
# lists them).
[spaces.site]
npm = "web"

[spaces.phone]
npm = "mobile"

[spaces.demo_preact]
npm = "web"
base = "/demos/preact/"

[spaces.demo_preact.ui]
plugin = "preact"

[spaces.demo_preact.bundler.vite]
config = "eco/web/demos/preact.vite.config.ts"

[spaces.demo_solid]
npm = "web"
base = "/demos/solid/"

[spaces.demo_solid.ui]
plugin = "solid"

[spaces.demo_solid.bundler.vite]
config = "eco/web/demos/solid.vite.config.ts"

[apps.web.remote]
knowledge = "https://knowledge.jaclang.org"

[apps.desktop]
name = "jaclang"
identifier = "org.jaclang.desktop"

[apps.desktop.window]
title = "jaclang.org"
width = 1280
height = 860
min_width = 900
min_height = 600

[apps.desktop.remote]
site_api = "https://jaclang.org"
social = "https://jaclang.org"
knowledge = "https://jaclang.org"

[apps.mobile.remote]
site_api = "https://jaclang.org"
social = "https://jaclang.org"
knowledge = "https://jaclang.org"

[apps.cli.remote]
site_api = "https://jaclang.org"
social = "https://jaclang.org"
knowledge = "https://jaclang.org"

# The plugins behind the abstractions the modules name: who a caller is and
# how one signs in (accounts of a username, an email and a password, and
# GitHub where the app runs with an OAuth app's SSO_GITHUB_CLIENT_ID and
# SSO_GITHUB_CLIENT_SECRET), and the model `by llm()` asks.
[auth.accounts]
email_required = true

[llm.anthropic]
model = "claude-sonnet-5-5"
timeout = 150
retries = 1

[precommit]
typecheck = true

[test]
directories = ["."]

[check.lint]
select = ["style"]
exclude = [
    "core/site/examples/*",
    "core/site/source/FloatingSource.jac",
    "core/site/landing/Reveal.jac",
    "core/site/game/webgl_host.jac",
    "core/async_utils.jac",
]

[memory]
profile = "managed"
enforce = ["arena", "core.site.game.sim", "core.site.game.gmath", "core.site.game.platform_rl"]

[npm.web]
name = "jaclang_org"
private = true
type = "module"

[npm.web.dependencies]
"@fontsource-variable/geist" = "^5.2.5"
"@fontsource-variable/geist-mono" = "^5.2.5"
"@hugeicons/core-free-icons" = "4.3.3"
"@hugeicons/react" = "^1.1.1"
class-variance-authority = "^0.7.1"
clsx = "^2.1.1"
embla-carousel-react = "^8.6.0"
lucide-react = "^0.469.0"
mermaid = "^11"
motion = "13.4.2"
radix-ui = "^1.4.2"
react = "^19.1.0"
react-dom = "^19.1.0"
react-native-web = "^0.21.2"
react-router-dom = "^7.6.0"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[npm.web.devDependencies]
"@preact/preset-vite" = "^2.10.6"
"@tailwindcss/vite" = "^4.1.17"
"@vitejs/plugin-react" = "^5.0.0"
preact = "^11.2.0"
solid-js = "^1.9.18"
tailwindcss = "^4.1.17"
vite = "^7.1.0"
vite-plugin-solid = "^2.11.15"

[npm.mobile]
name = "jaclang_org_mobile"
private = true

[npm.mobile.dependencies]
expo = "~54.0.0"
react = "19.1.0"
react-native = "0.81.5"
expo-web-browser = "~15.0.0"
expo-crypto = "~15.0.0"
expo-font = "~14.0.0"
lucide-react-native = "^1.70.0"
react-native-svg = "^15.13.0"
