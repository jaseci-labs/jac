android.useAndroidX=true
kotlin.jvm.target.validation.mode=warning
# --- Gradle caching ---
# Reuse task outputs across builds / machines.
org.gradle.caching=true
# Skip re-evaluating the build scripts when nothing changed.
org.gradle.configuration-cache=true
# Parallel module builds + a warm daemon.
org.gradle.parallel=true
org.gradle.daemon=true
# Kotlin incremental compilation + daemon.
kotlin.daemon.enabled=true
kotlin.incremental=true
# Faster resource handling (defaults on modern AGP, pinned here).
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# Keep the daemon warm but bounded.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
