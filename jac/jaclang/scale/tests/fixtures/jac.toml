[project]
name = "test-api"
version = "1.0.0"
description = "Test fixture for jac-scale serve tests"

[environments.response.headers]
X-Custom-Test-Header = "test-value"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Embedder-Policy = "require-corp"

# GithubEvent in github_webhook.jac verifies X-Hub-Signature-256 against this
# secret; the api-key walkers in test_api.jac never read it.
[scale.webhook]
github_secret = "test-github-webhook-secret"
