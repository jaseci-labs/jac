[project]
name = "jac-shop"
version = "0.1.0"
description = "A small e-commerce app built as a workspace of service apps"
default-app = "web"

[apps.web]
kind = "web-app"
entry-point = "main.jac"

[apps.products_app]
kind = "service"
entry-point = "products_app.jac"
route = "/products"

[apps.orders_app]
kind = "service"
entry-point = "orders_app.jac"
route = "/orders"

[apps.cart_app]
kind = "service"
entry-point = "cart_app.jac"
route = "/cart"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dependencies]
humanize = ">=4.0.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[client]

# --- e2e-harness overlay (appended by k8s_microservice_real_e2e.sh) ---
[scale.gateway.logs]
enabled = true

[scale.gateway.ingress]
enabled = true
host = "jac-shop.local"
ingress_class_name = "nginx"

[scale.gateway.cors]
allow_origins = ["http://app.example.com"]
allow_methods = ["GET", "POST", "OPTIONS"]
allow_headers = ["Authorization", "Content-Type"]
allow_credentials = true
