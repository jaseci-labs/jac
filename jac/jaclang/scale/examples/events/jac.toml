[project]
name = "events-example"
version = "1.0.0"
description = "Minimal event-streaming example for jac-scale"
entry-point = "app.jac"

[scale.events]
enabled = true
# Omit `url` to fall back to [scale.database].url / JAC_DB_URL (the shared
# Postgres database); with no database at all, the in-memory LocalEventStream
# is used. Set it explicitly to stream through a dedicated Postgres server.
# url = "postgresql://user:pass@localhost:5432/jac"
consumer_group = "events-example"

[scale.events.retry]
max_attempts = 3
backoff_seconds = [1, 5, 30]
dead_letter_suffix = ".dlq"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"
