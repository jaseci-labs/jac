<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jac Graph Visualizer</title>
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo svg {
            color: #f59e0b;
        }

        .mode-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 4px;
        }

        .mode-badge.public {
            background: #1e3a5f;
            color: #38bdf8;
            border: 1px solid #0ea5e9;
        }

        .mode-badge.user {
            background: #14532d;
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        .stats {
            font-size: 12px;
            color: #94a3b8;
            padding: 3px 10px;
            background: #0f172a;
            border-radius: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            padding: 5px 12px;
            border-radius: 5px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background: #334155;
            border-color: #475569;
        }

        .btn-logout {
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: #fff;
        }

        #graph-container {
            width: 100%;
            height: calc(100vh - 49px);
            background: #0f172a;
        }

        .node-panel {
            position: absolute;
            top: 64px;
            right: 16px;
            width: 300px;
            max-height: calc(100vh - 96px);
            overflow-y: auto;
            z-index: 20;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: none;
            font-size: 13px;
        }

        .panel-title {
            font-weight: 600;
            color: #f8fafc;
        }

        .panel-id {
            color: #64748b;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            margin-bottom: 8px;
        }

        .panel-subtitle {
            color: #94a3b8;
            font-weight: 600;
            margin: 8px 0 4px;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-family: monospace;
            font-size: 12px;
        }

        .panel-key {
            color: #94a3b8;
        }

        .panel-value {
            color: #e2e8f0;
            word-break: break-all;
            text-align: right;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .panel-status {
            color: #f59e0b;
            font-size: 12px;
            margin-top: 8px;
        }

        .tooltip-title {
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .tooltip-id {
            color: #64748b;
            font-size: 11px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #334155;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            gap: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            gap: 8px;
        }

        .legend {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            z-index: 10;
        }

        .legend-title {
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Login modal overlay */
        .login-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        .login-overlay.open {
            display: flex;
        }

        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 32px;
            width: 360px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .login-card .logo {
            justify-content: center;
            font-size: 20px;
            margin-bottom: 24px;
        }

        .login-card label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .login-card input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }

        .login-card input:focus {
            border-color: #3b82f6;
        }

        .login-card .login-btn {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #3b82f6;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .login-card .login-btn:hover {
            background: #2563eb;
        }

        .login-card .login-btn:disabled {
            background: #334155;
            cursor: not-allowed;
        }

        .login-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 18px;
        }

        .login-close:hover {
            color: #e2e8f0;
        }

        .login-error {
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
            text-align: center;
        }

        .btn-login {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .btn-login:hover {
            background: #2563eb;
            border-color: #2563eb;
        }
    </style>
</head>

<body>
    <!-- Login modal -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-card">
            <button class="login-close" onclick="closeLogin()">&times;</button>
            <div class="logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="5" r="3" />
                    <line x1="12" y1="8" x2="12" y2="16" />
                    <circle cx="6" cy="19" r="3" />
                    <circle cx="18" cy="19" r="3" />
                    <line x1="12" y1="16" x2="6" y2="16.5" />
                    <line x1="12" y1="16" x2="18" y2="16.5" />
                </svg>
                Jac Graph
            </div>
            <div class="login-error" id="login-error"></div>
            <label>Username</label>
            <input type="text" id="login-username" placeholder="Enter username" />
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Enter password" />
            <button class="login-btn" id="login-btn" onclick="doLogin()">
                Sign In
            </button>
        </div>
    </div>

    <!-- Graph page (always visible) -->
    <div class="header">
        <div class="header-left">
            <div class="logo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="5" r="3" />
                    <line x1="12" y1="8" x2="12" y2="16" />
                    <circle cx="6" cy="19" r="3" />
                    <circle cx="18" cy="19" r="3" />
                    <line x1="12" y1="16" x2="6" y2="16.5" />
                    <line x1="12" y1="16" x2="18" y2="16.5" />
                </svg>
                Jac Graph
            </div>
            <div class="mode-badge" id="mode-badge">Loading</div>
            <div class="stats" id="stats"></div>
        </div>
        <div class="header-right">
            <select class="btn" id="dir-select" title="Edges to follow when expanding">
                <option value="out">Outgoing</option>
                <option value="in">Incoming</option>
                <option value="both">Both</option>
            </select>
            <button class="btn" onclick="refreshGraph()" title="Refresh">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 2v6h-6" />
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                    <path d="M3 22v-6h6" />
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                </svg>
                Refresh
            </button>
            <button class="btn" onclick="fitGraph()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h6v6" />
                    <path d="M9 21H3v-6" />
                    <path d="M21 3l-7 7" />
                    <path d="M3 21l7-7" />
                </svg>
                Fit
            </button>
            <button class="btn" onclick="togglePhysics()" id="physics-btn">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M12 1v4m0 14v4M4.22 4.22l2.83 2.83m9.9 9.9l2.83 2.83M1 12h4m14 0h4M4.22 19.78l2.83-2.83m9.9-9.9l2.83-2.83" />
                </svg>
                Physics
            </button>
            <button class="btn btn-login" id="auth-btn" onclick="openLogin()" style="display: none">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                </svg>
                Login
            </button>
            <button class="btn btn-logout" id="logout-btn" onclick="doLogout()" style="display: none">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Logout
            </button>
        </div>
    </div>
    <div id="graph-container"></div>
    <div class="node-panel" id="node-panel">
        <div id="panel-body"></div>
        <div class="panel-actions">
            <button class="btn" id="expand-btn" onclick="expandSelected()">Expand</button>
            <button class="btn" id="more-btn" onclick="expandSelected()">Load more</button>
            <button class="btn" id="collapse-btn" onclick="collapseSelected()">Collapse</button>
        </div>
        <div class="panel-status" id="panel-status"></div>
    </div>

    <script>
        const MAX_NODES = 1500;
        const PAGE_SIZE = 50;
        let network = null;
        let nodes = null;
        let edges = null;
        let physicsEnabled = true;
        let capped = false;
        let selectedId = null;
        let rootId = null;
        let generation = 0;
        const pages = new Map();
        const edgeOwners = new Map();
        const typeColors = new Map();
        // ?public=1 pins the visualizer to the public (super root) graph,
        // ignoring any stored session token - useful for embeds.
        const forcePublic = new URLSearchParams(window.location.search).get("public") === "1";
        let authToken = forcePublic
            ? null
            : localStorage.getItem("jac_token") || null;
        const baseUrl = window.location.origin;

        updateHeaderButtons();
        loadRoot();

        document
            .getElementById("login-password")
            .addEventListener("keydown", function (e) {
                if (e.key === "Enter") doLogin();
            });
        document.getElementById("dir-select").addEventListener("change", function () {
            if (selectedId && pages.has(selectedId)) {
                collapse(selectedId);
                expand(selectedId);
            }
        });

        function updateHeaderButtons() {
            document.getElementById("auth-btn").style.display =
                authToken || forcePublic ? "none" : "flex";
            document.getElementById("logout-btn").style.display = authToken
                ? "flex"
                : "none";
            const badge = document.getElementById("mode-badge");
            badge.textContent = authToken ? "User Graph" : "Public Graph";
            badge.className = "mode-badge " + (authToken ? "user" : "public");
        }

        function openLogin() {
            document.getElementById("login-error").style.display = "none";
            document.getElementById("login-username").value = "";
            document.getElementById("login-password").value = "";
            document.getElementById("login-overlay").classList.add("open");
        }

        function closeLogin() {
            document.getElementById("login-overlay").classList.remove("open");
        }

        async function doLogin() {
            const username = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value;
            const errEl = document.getElementById("login-error");
            const btn = document.getElementById("login-btn");
            errEl.style.display = "none";
            if (!username || !password) {
                errEl.textContent = "Username and password required";
                errEl.style.display = "block";
                return;
            }
            btn.disabled = true;
            btn.textContent = "Signing in...";
            try {
                const resp = await fetch(baseUrl + "/user/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        identity: { type: "username", value: username },
                        credential: { type: "password", password },
                    }),
                });
                const result = (await resp.json().catch(() => null)) || {};
                if (result.ok && result.data && result.data.token) {
                    authToken = result.data.token;
                    localStorage.setItem("jac_token", authToken);
                    closeLogin();
                    updateHeaderButtons();
                    loadRoot();
                } else {
                    errEl.textContent = errorMessage(result, resp.status);
                    errEl.style.display = "block";
                }
            } catch (err) {
                errEl.textContent = "Connection failed: " + err.message;
                errEl.style.display = "block";
            }
            btn.disabled = false;
            btn.textContent = "Sign In";
        }

        function errorMessage(result, status) {
            const err = result.error || result.detail;
            if (typeof err === "string") return err;
            if (Array.isArray(err)) return err.map((e) => e.msg).join("; ");
            return (err && err.message) || "Sign in failed (HTTP " + status + ")";
        }

        function doLogout() {
            authToken = null;
            localStorage.removeItem("jac_token");
            updateHeaderButtons();
            loadRoot();
        }

        async function getJson(path, params) {
            const url = new URL(baseUrl + path);
            Object.entries(params || {}).forEach(([k, v]) => {
                if (v !== null && v !== undefined && v !== "") url.searchParams.set(k, v);
            });
            const headers = {};
            if (authToken) headers["Authorization"] = "Bearer " + authToken;
            const resp = await fetch(url.toString(), { headers });
            const body = await resp.json().catch(() => ({}));
            if (!resp.ok) throw new Error(body.error || "HTTP " + resp.status);
            return body;
        }

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function showMessage(text, isError) {
            const container = document.getElementById("graph-container");
            container.replaceChildren();
            const box = el("div", "empty-state");
            const msg = el("div", null, text);
            if (isError) msg.style.color = "#ef4444";
            box.appendChild(msg);
            container.appendChild(box);
        }

        function colorFor(type, isRoot) {
            if (isRoot) return { background: "#ff7743", border: "#e05a2a" };
            let hash = 0;
            for (const c of type) hash = c.charCodeAt(0) + ((hash << 5) - hash);
            const hue = Math.abs(hash % 360);
            return {
                background: `hsl(${hue}, 60%, 50%)`,
                border: `hsl(${hue}, 60%, 35%)`,
            };
        }

        function tooltipFor(n) {
            const box = el("div");
            box.appendChild(el("div", "tooltip-title", n.root ? "root" : n.type));
            box.appendChild(el("div", "tooltip-id", "ID: " + n.id));
            return box;
        }

        function addNode(n) {
            if (nodes.get(n.id)) return true;
            if (nodes.length >= MAX_NODES) {
                capped = true;
                return false;
            }
            const colors = colorFor(n.type, n.root);
            const legendKey = n.root ? "root" : n.type;
            if (!typeColors.has(legendKey)) typeColors.set(legendKey, colors.background);
            nodes.add({
                id: n.id,
                label: n.root ? "root" : n.type,
                title: tooltipFor(n),
                color: {
                    background: colors.background,
                    border: colors.border,
                    highlight: { background: "#f59e0b", border: "#f59e0b" },
                },
                font: { color: "#ffffff", size: 13 },
                isRoot: !!n.root,
            });
            return true;
        }

        function addEdge(e, owner) {
            const id = e.id || e.from + ">" + e.to;
            if (!nodes.get(e.from) || !nodes.get(e.to)) return;
            if (!edgeOwners.has(id)) edgeOwners.set(id, new Set());
            edgeOwners.get(id).add(owner);
            if (edges.get(id)) return;
            edges.add({
                id,
                from: e.from,
                to: e.to,
                label: e.label || "",
                title: e.type || "edge",
                arrows: e.undirected ? "" : "to",
                color: { color: "#64748b", opacity: 0.8 },
                font: {
                    color: "#94a3b8",
                    size: 11,
                    strokeWidth: 2,
                    strokeColor: "#0f172a",
                    align: "top",
                },
            });
        }

        function buildNetwork() {
            const container = document.getElementById("graph-container");
            container.replaceChildren();
            nodes = new vis.DataSet([]);
            edges = new vis.DataSet([]);
            pages.clear();
            edgeOwners.clear();
            typeColors.clear();
            capped = false;
            const options = {
                autoResize: true,
                nodes: {
                    shape: "dot",
                    size: 25,
                    borderWidth: 2,
                    shadow: { enabled: true, color: "rgba(0,0,0,0.3)", size: 8 },
                },
                edges: {
                    width: 2,
                    smooth: { type: "continuous", forceDirection: "none" },
                    arrows: { to: { enabled: true, scaleFactor: 0.5 } },
                },
                physics: {
                    enabled: physicsEnabled,
                    solver: "forceAtlas2Based",
                    forceAtlas2Based: {
                        gravitationalConstant: -50,
                        centralGravity: 0.01,
                        springLength: 120,
                        springConstant: 0.08,
                        damping: 0.4,
                        avoidOverlap: 0.8,
                    },
                    stabilization: { enabled: true, iterations: 200, updateInterval: 25 },
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200,
                    zoomView: true,
                    dragView: true,
                    dragNodes: true,
                },
            };
            network = new vis.Network(container, { nodes, edges }, options);
            network.on("click", function (params) {
                if (!params.nodes.length) return;
                const id = params.nodes[0];
                selectNode(id);
                if (!pages.has(id)) expand(id);
            });
            container.style.cursor = "grab";
        }

        function currentDir() {
            return document.getElementById("dir-select").value;
        }

        async function loadRoot() {
            const gen = ++generation;
            document.getElementById("node-panel").style.display = "none";
            showMessage("Loading graph...");
            try {
                const root = await getJson("/graph/node", { id: "root" });
                if (gen !== generation) return;
                buildNetwork();
                addNode({ id: root.id, type: root.type, root: root.root });
                rootId = root.id;
                selectedId = root.id;
                renderPanel(root);
                await expand(root.id);
            } catch (err) {
                showMessage("Failed to load graph: " + err.message, true);
            }
        }

        async function expand(id) {
            const gen = generation;
            const state = pages.get(id) || { dir: currentDir(), cursor: null, done: false, busy: false };
            if (state.done || state.busy) return;
            const room = MAX_NODES - nodes.length;
            if (room <= 0) {
                capped = true;
                updateStats();
                return;
            }
            pages.set(id, state);
            state.busy = true;
            try {
                const page = await getJson("/graph/neighbors", {
                    id,
                    dir: state.dir,
                    limit: Math.min(PAGE_SIZE, room),
                    cursor: state.cursor,
                });
                if (gen !== generation || pages.get(id) !== state) return;
                page.nodes.forEach(addNode);
                page.edges.forEach((e) => addEdge(e, id));
                state.cursor = page.next_cursor;
                state.done = !page.next_cursor;
                if (!page.nodes.length && page.next_cursor) {
                    setStatus("Nothing readable in this stretch; Load more keeps looking.");
                }
            } catch (err) {
                if (gen !== generation) return;
                setStatus("Could not load neighbors: " + err.message + " (Load more retries)");
            } finally {
                state.busy = false;
            }
            updateStats();
            if (selectedId === id) refreshPanelButtons();
        }

        function collapse(id) {
            const dropped = [];
            edgeOwners.forEach((owners, edgeId) => {
                owners.delete(id);
                if (!owners.size) dropped.push(edgeId);
            });
            dropped.forEach((edgeId) => edgeOwners.delete(edgeId));
            edges.remove(dropped);
            pages.delete(id);
            const reached = new Set(rootId ? [rootId] : []);
            const queue = rootId ? [rootId] : [];
            while (queue.length) {
                const at = queue.shift();
                network.getConnectedNodes(at).forEach((next) => {
                    if (!reached.has(next)) {
                        reached.add(next);
                        queue.push(next);
                    }
                });
            }
            const gone = nodes.getIds().filter((n) => !reached.has(n));
            gone.forEach((n) => {
                const linked = network.getConnectedEdges(n);
                linked.forEach((edgeId) => edgeOwners.delete(edgeId));
                edges.remove(linked);
                pages.delete(n);
            });
            nodes.remove(gone);
            if (gone.includes(selectedId)) {
                selectedId = null;
                document.getElementById("node-panel").style.display = "none";
            }
            capped = false;
            updateStats();
            refreshPanelButtons();
        }

        async function selectNode(id) {
            const gen = generation;
            selectedId = id;
            try {
                const detail = await getJson("/graph/node", { id });
                if (gen !== generation || selectedId !== id) return;
                renderPanel(detail);
            } catch (err) {
                if (gen !== generation || selectedId !== id) return;
                setStatus("Could not load node: " + err.message);
            }
        }

        function renderCounts(parent, title, counts, exact) {
            const rows = Object.entries(counts || {});
            if (!rows.length) return;
            parent.appendChild(el("div", "panel-subtitle", exact === false ? title + " (at least)" : title));
            rows.forEach(([key, count]) => {
                const row = el("div", "panel-row");
                row.appendChild(el("span", "panel-key", key.split(".").pop()));
                row.appendChild(el("span", "panel-value", exact === false ? String(count) + "+" : String(count)));
                parent.appendChild(row);
            });
        }

        function renderPanel(detail) {
            const panel = document.getElementById("node-panel");
            const body = document.getElementById("panel-body");
            body.replaceChildren();
            body.appendChild(el("div", "panel-title", detail.root ? "root" : detail.type));
            body.appendChild(el("div", "panel-id", detail.id));
            const fields = Object.entries(detail.fields || {});
            if (fields.length) {
                body.appendChild(el("div", "panel-subtitle", "Fields"));
                fields.forEach(([key, value]) => {
                    const row = el("div", "panel-row");
                    row.appendChild(el("span", "panel-key", key));
                    row.appendChild(el("span", "panel-value", value));
                    body.appendChild(row);
                });
            }
            const counts = detail.counts || {};
            const out = counts.out || {};
            const inc = counts.in || {};
            renderCounts(body, "Outgoing nodes", out.nodes, out.exact);
            renderCounts(body, "Outgoing edges", out.edges, out.exact);
            renderCounts(body, "Incoming nodes", inc.nodes, inc.exact);
            renderCounts(body, "Incoming edges", inc.edges, inc.exact);
            panel.style.display = "block";
            refreshPanelButtons();
        }

        function refreshPanelButtons() {
            const state = selectedId ? pages.get(selectedId) : null;
            document.getElementById("more-btn").style.display =
                state && !state.done ? "inline-flex" : "none";
            document.getElementById("expand-btn").style.display =
                state ? "none" : "inline-flex";
            document.getElementById("collapse-btn").style.display =
                state ? "inline-flex" : "none";
        }

        function expandSelected() {
            if (selectedId) expand(selectedId);
        }

        function collapseSelected() {
            if (selectedId) collapse(selectedId);
        }

        function setStatus(text) {
            document.getElementById("panel-status").textContent = text;
        }

        function updateStats() {
            let text = nodes.length + " nodes, " + edges.length + " edges";
            if (capped) text += " (showing the first " + MAX_NODES + "; collapse a node to explore further)";
            document.getElementById("stats").textContent = text;
            updateLegend();
        }

        function updateLegend() {
            const container = document.getElementById("graph-container");
            let legend = document.getElementById("graph-legend");
            if (!legend) {
                legend = el("div", "legend");
                legend.id = "graph-legend";
                container.appendChild(legend);
            }
            legend.replaceChildren(el("div", "legend-title", "Node Types"));
            typeColors.forEach((color, type) => {
                const item = el("div", "legend-item");
                const swatch = el("div", "legend-color");
                swatch.style.background = color;
                item.appendChild(swatch);
                item.appendChild(document.createTextNode(type));
                legend.appendChild(item);
            });
        }

        function refreshGraph() {
            loadRoot();
        }
        function fitGraph() {
            if (network)
                network.fit({
                    animation: { duration: 500, easingFunction: "easeInOutQuad" },
                });
        }
        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            if (network)
                network.setOptions({ physics: { enabled: physicsEnabled } });
            document.getElementById("physics-btn").style.borderColor =
                physicsEnabled ? "#334155" : "#f59e0b";
        }
    </script>
</body>

</html>
