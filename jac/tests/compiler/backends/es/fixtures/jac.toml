[project]
name = "es-fixtures"

# App boundaries for the sv-to-sv / typed-interop fixture pairs (#7772):
# each provider stem is a file-rooted service app; consumers compiled here
# are shared modules that bridge to the app owning the stem they import.
[apps.sv_relative_provider]
kind = "service"
entry-point = "sv_relative_provider.jac"
route = "/sv-relative"

[apps.sv_relative_consumer]
kind = "service"
entry-point = "sv_relative_consumer.jac"
route = "/sv-relative-consumer"

