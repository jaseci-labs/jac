<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(120% 140% at 15% 110%, #1b1008 0%, #0d0a08 45%, #070607 100%);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #f5f2ee; display: flex; align-items: center;
  }
  .wrap { display: flex; align-items: center; gap: 72px; padding: 0 96px; width: 100%; }
  .logo { width: 300px; flex-shrink: 0; filter: drop-shadow(0 0 60px rgba(240,105,53,0.35)); }
  h1 { font-size: 64px; font-weight: 800; letter-spacing: -1px; line-height: 1.08; }
  h1 .accent { color: #f06935; }
  p { margin-top: 26px; font-size: 30px; line-height: 1.35; color: #b8b0a8; max-width: 640px; }
  .url { margin-top: 34px; font-size: 26px; color: #f06935; font-family: "SF Mono", Menlo, monospace; }
</style></head>
<body>
  <div class="wrap">
    <img class="logo" src="../assets/jac-logo.svg" alt=""/>
    <div>
      <h1>One language. Every stack.<br/><span class="accent">No glue.</span></h1>
      <p>AI, graphs, persistence, APIs, UIs, and cloud deployment as language features.</p>
      <div class="url">jaclang.org</div>
    </div>
  </div>
</body>
</html>
