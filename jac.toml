# jaclang project manifest AND repo-wide config, consolidated. Config resolves
# to the nearest ANCESTOR jac.toml (walk-up, nearest wins, no merging), so this
# single root file covers every cwd in the repo -- including `cd jac`. The
# single binary is built from this source tree; the build reads version/metadata
# here (not from a Python pyproject backend).
[project]
name = "jaclang"
version = "0.37.22"
description = "Jac programming language - Python-like syntax, compiles to Python bytecode, JavaScript, and native machine code with novel constructs for AI-integrated programming."
license = "MIT"
readme = "jac/README.md"
requires_python = ">=3.14"
# No runtime PyPI deps: native LLVM is the in-tree LLVMPY_* shim, statically
# linked by Zig (jac/native + `zig build fetch-llvm`), not the llvmlite wheel.
dependencies = []

[project.urls]
Repository = "https://github.com/jaseci-labs/jaseci"
Homepage = "https://jaseci.org"
Documentation = "https://www.jaclang.org/docs"

# Editable dev loop: reroute `import jaclang` to the in-repo source under jac/
# so the `jac` binary runs your latest edits with no rebuild. Enabled here so
# building from this repo always runs the in-tree compiler source; this skips
# the binary's precompiled JIR bundle (the per-module cache is content-keyed, so
# edits still self-invalidate). A one-time `zig build` is needed first, since
# sitecustomize.py -- which reads this key -- ships inside the binary payload.
# Comment this stanza out to fall back to the binary's bundled jaclang.
# Set JAC_NO_DEV_SOURCE=1 to force it off for a single command.
[dev]
jaclang_source = "jac"   # dir CONTAINING jaclang/, relative to this file

# `jac test` worker count. The generic default is sized from MemAvailable
# assuming ~2 GB per worker, which suits an ordinary project. This repo's
# compiler suite is far heavier: workers running the native/LLVM tests were
# measured at ~4.9 GB PSS average and 7.1 GB peak (they fork `jac build --native`
# subprocesses), so the generic default over-subscribes here. Pin it.
# JAC_TEST_JOBS overrides this; "0" or "1" runs everything in one process.
test_jobs = "8"

# `jac test` discovers the suite here (mirrors pytest's testpaths); relative to
# this file, so a bare `jac test` works from any directory in the repo. The
# in-package suites are part of the standard plan on purpose: enumerating them
# in workflow YAML let files rot out of coverage silently. Their optional deps
# (litellm, kubernetes, ...) turn into per-file skips where absent; CI lanes
# that install them set JAC_TEST_STRICT=1 so those skips fail there instead.
[test]
directories = [
    "jac/tests",
    "jac/jaclang/compiler/tests",
    "jac/jaclang/byllm/tests",
    "jac/jaclang/scale/tests",
]
# The scale suite relies on per-file process isolation (servers, sockets,
# module-level config); each of these files gets a dedicated worker.
isolate = ["jac/jaclang/scale/tests/*"]
# These share one shelf_db_path SQLite file, so they additionally run one at
# a time after the parallel phase.
serial = [
    "jac/jaclang/scale/tests/data/test_gcs_storage.jac",
    "jac/jaclang/scale/tests/server/test_firebase_auth_sso.jac",
    "jac/jaclang/scale/tests/data/test_identity_password.jac",
    "jac/jaclang/scale/tests/data/test_firebase_env.jac",
]

# JacPython is a native-only library in checks, builds and cached imports.
[native]
require = [
    "jaclang.compiler.frontend.python.*",
    "jaclang.compiler.backends.py.jacpython.*",
    "jaclang.runtime.python.*",
]

[check]
# Modules excluded from the `jac check` gate. `jac check` reads this list, so
# CI, the precommit hook and a local run all apply the same policy; --ignore
# adds to it. This replaces the old .jacignore, which now only governs what a
# `jac build` bundle ships.
#
# Matching (project/source.jac:path_matches_exclude): an entry containing `/`
# is fnmatched against the whole path; a bare entry is fnmatched against EVERY
# path component, so a bare `types.jac` silences every file of that basename
# repo-wide. Every path entry below is path-qualified for that reason -- one
# line per excluded module, so a fix deletes exactly one line.
exclude = [
    # Test trees and the fixtures that hold deliberate diagnostics: a checker
    # fixture exists to fail `jac check`, so checking it proves nothing and
    # blocks every commit that touches it.
    "tests",
    "checker_*.jac",
    "*_err.jac",

    # Everything below is a module that does not currently pass `jac check`.
    # Adding to this list is a debt, not a policy: the goal is to empty it.
    # llvmlite-bound native IR generation.
    # These NaIRGenPass body files reach llvmlite handles (ir.Function.args,
    # .linkage, IRBuilder.append_basic_block, Type.as_pointer) through the
    # vendored py2jac translation under backends/native/llvm/, whose
    # ctypes-derived values the checker sees as Unknown. Not annotatable
    # without typing that vendored surface. The declaration
    # (na_ir_gen_pass.jac) and the other 32 body files are checked.
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/calls.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/core.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/debug.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/enums.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/expr.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/func.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/generics.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/iterators.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/objects.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/refcount.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/stmt.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/types.impl.jac",
    "jac/jaclang/compiler/backends/native/na_ir_gen_pass.impl/vtable.impl.jac",

    # byllm -- litellm/LLM-provider glue.
    "jac/jaclang/byllm/llm.impl/basellm.impl.jac",
    "jac/jaclang/byllm/llm.impl/local.impl.jac",
    "jac/jaclang/byllm/llm.impl/mockllm.impl.jac",
    "jac/jaclang/byllm/llm.impl/model.impl.jac",
    "jac/jaclang/byllm/llm.impl/modelpool.impl.jac",
    "jac/jaclang/byllm/llm.jac",
    "jac/jaclang/byllm/telemetry.impl/telemetry.impl.jac",
    "jac/jaclang/byllm/telemetry.jac",
    "jac/jaclang/byllm/types.jac",

    # jac-scale server surface.

    # jac-scale -- kubernetes / opentelemetry client glue.
    "jac/jaclang/scale/deploy/autoscale/hpa_autoscaler.impl.jac",
    "jac/jaclang/scale/deploy/autoscale/hpa_autoscaler.jac",
    "jac/jaclang/scale/runtime/context/tracing.jac",

    # Runtime library.
    "jac/jaclang/client/targets/desktop/native/cef/cef_subprocess.jac",

    # ECMAScript backend.
    "jac/jaclang/compiler/backends/es/esast_gen_pass.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/assign.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/calls.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/comptime.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/core.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/decls.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/dts.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/expr.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/imports.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/match.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/module.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/ops.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/osp.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/stmt.impl.jac",
    "jac/jaclang/compiler/backends/es/esast_gen_pass.impl/view.impl.jac",

    # Example apps.

    # CPython-derived Python grammar.
    "jac/jaclang/compiler/frontend/python/parser.jac",
]

[check.lint]
# "all" enables every autolint rule; the two strip-* entries are the opt-in
# "deslop" rules (W3050/W3051) that remove all comments and docstrings. They
# only activate when named explicitly here, so `jac format --lintfix`,
# `jac precommit`, and CI's `jac format --check --lintfix` will strip comments
# and docstrings from every non-excluded .jac file.
select = ["all", "strip-comments", "strip-docstrings"]
exclude = [
    "docs/*",
    "*/examples/*",
    "*/tests/*",
    "jac/jaclang/compiler/frontend/python/*",
    "jac/jaclang/compiler/backends/py/jacpython/*",
    "jac/jaclang/runtime/python/*",
    # Ops scripts keep their usage docstrings; CI's fmt sweep skips ^scripts/
    # for the same reason -- this entry keeps the precommit hook consistent
    # with that (without it, any commit touching a script is blocked on deslop).
    "scripts/*",
    # Excluded for the no-print rule, not deslop (exclusion is file-level across
    # all lint rules): console.impl.jac IS the console implementation, and
    # cli_boot.jac is the minimal boot path that must run (an app binary's
    # embedded image) before the full CLI/console can load -- bare print() is
    # their mechanism.
    # Both were deslopped once by hand and should stay comment/docstring-free.
    "console.impl.jac",
    "cli_boot.jac",
    # Same reason for the fused runtime's diagnostics: report.jac narrates the
    # single binary's cold start and its failures to stderr before CPython (and
    # so the console) exists -- bare print() is its mechanism too.
    "fused/report.jac",
    # llvm/*.jac is the vendored llvmlite port (ir + binding); its comments are
    # load-bearing, so it is NOT deslopped -- it keeps upstream's
    # docstring/property style so diffs against llvmlite stay reviewable.
    "*/llvm/ir/*",
    "*/llvm/binding/*",
]

[byllm.model]
default_model = "anthropic/claude-sonnet-4-6"
#default_model = "ollama/gemma4:31b"
#default_model = "ollama/qwen3-coder"
